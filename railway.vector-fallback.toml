# Temporary, reversible Railway build-path fallback for VECTOR hosted proof.
# Purpose: bypass Metal/V3 scheduler failures that occur before Dockerfile execution.
# This preserves the canonical Dockerfile, runtime, health check and admission gates.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildEnvironment = "V2"

[deploy]
runtime = "V2"
startCommand = "node security-runtime/bootstrap.cjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
sleepApplication = true
restartPolicyType = "NEVER"
