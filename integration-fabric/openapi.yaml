openapi: 3.0.3
info:
  title: Manufacturing WFM Integration Gateway
  version: 0.2.0
  description: Vendor-neutral integration contract for ERP, HCM, payroll, MES, learning/skills, safety/EHS, access, industrial and iPaaS interoperability.
servers:
  - url: https://{customer-host}/api/integration/v1
    variables:
      customer-host:
        default: example.invalid
security:
  - bearerAuth: []
paths:
  /connectors:
    get:
      operationId: listConnectors
      responses:
        '200':
          description: Connector catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connector'
  /connectors/{connectorId}/health:
    get:
      operationId: connectorHealth
      parameters:
        - in: path
          name: connectorId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Connector state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHealth'
  /workers:
    post:
      operationId: ingestWorkers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Worker' }
      responses:
        '202': { description: Accepted }
  /shifts:
    post:
      operationId: ingestShifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Shift' }
      responses:
        '202': { description: Accepted }
  /time-events:
    post:
      operationId: ingestTimeEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TimeEvent' }
      responses:
        '202': { description: Accepted }
  /production-events:
    post:
      operationId: ingestProductionEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ProductionEvent' }
      responses:
        '202': { description: Accepted }
  /access-events:
    post:
      operationId: ingestAccessEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/AccessEvent' }
      responses:
        '202': { description: Accepted }
  /qualifications:
    post:
      operationId: ingestQualifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Qualification' }
      responses:
        '202': { description: Accepted }
  /training-completions:
    post:
      operationId: ingestTrainingCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TrainingCompletion' }
      responses:
        '202': { description: Accepted }
  /worker-restrictions:
    post:
      operationId: ingestWorkerRestrictions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/WorkerRestriction' }
      responses:
        '202': { description: Accepted }
  /safety-signals:
    post:
      operationId: ingestSafetySignals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/SafetySignal' }
      responses:
        '202': { description: Accepted }
  /events:
    post:
      operationId: ingestCanonicalEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/CanonicalEvent' }
      responses:
        '202': { description: Accepted }
  /webhooks/{connectorId}:
    post:
      operationId: receiveConnectorWebhook
      security: []
      parameters:
        - in: path
          name: connectorId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: Accepted after connector-specific signature verification }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Connector:
      type: object
      required: [id, name, category, maturity]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        maturity: { type: string }
        capabilities:
          type: array
          items: { type: string }
    ConnectorHealth:
      type: object
      required: [connectorId, state, checkedAt]
      properties:
        connectorId: { type: string }
        state:
          type: string
          enum: [healthy, degraded, authentication_required, unreachable, unconfigured]
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer, minimum: 0 }
    Worker:
      type: object
      required: [externalId]
      properties:
        externalId: { type: string }
        employeeNumber: { type: string }
        displayName: { type: string }
        siteExternalId: { type: string }
        departmentExternalId: { type: string }
        active: { type: boolean }
        attributes: { type: object, additionalProperties: true }
    Shift:
      type: object
      required: [externalId, workerExternalId, start, end]
      properties:
        externalId: { type: string }
        workerExternalId: { type: string }
        siteExternalId: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        role: { type: string }
    TimeEvent:
      type: object
      required: [workerExternalId, occurredAt, eventType]
      properties:
        workerExternalId: { type: string }
        occurredAt: { type: string, format: date-time }
        eventType:
          type: string
          enum: [clock_in, clock_out, break_start, break_end, correction]
        source: { type: string }
        siteExternalId: { type: string }
    ProductionEvent:
      type: object
      required: [occurredAt, eventType]
      properties:
        occurredAt: { type: string, format: date-time }
        eventType: { type: string }
        siteExternalId: { type: string }
        lineExternalId: { type: string }
        workOrderExternalId: { type: string }
        quantity: { type: number }
        attributes: { type: object, additionalProperties: true }
    AccessEvent:
      type: object
      required: [occurredAt, eventType]
      properties:
        occurredAt: { type: string, format: date-time }
        eventType: { type: string }
        personExternalId: { type: string }
        doorExternalId: { type: string }
        siteExternalId: { type: string }
        result: { type: string }
    Qualification:
      type: object
      description: Customer-policy qualification evidence. A source qualification does not by itself grant work eligibility.
      required: [workerExternalId, qualificationExternalId, status, sourceSystem]
      properties:
        workerExternalId: { type: string }
        qualificationExternalId: { type: string }
        status:
          type: string
          enum: [valid, expired, suspended, pending, unknown]
        effectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidenceReference: { type: string }
        sourceSystem: { type: string }
        sourceRecordId: { type: string }
        attributes: { type: object, additionalProperties: true }
    TrainingCompletion:
      type: object
      description: Learning completion evidence that may contribute to a separately configured qualification rule.
      required: [workerExternalId, learningItemExternalId, status, sourceSystem]
      properties:
        workerExternalId: { type: string }
        learningItemExternalId: { type: string }
        learningItemRevision: { type: string }
        status:
          type: string
          enum: [completed, incomplete, failed, withdrawn, unknown]
        completedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        score: { type: number }
        sourceSystem: { type: string }
        sourceRecordId: { type: string }
    WorkerRestriction:
      type: object
      description: Minimal derived workforce restriction/clearance signal. Do not transmit underlying medical or investigation records.
      required: [workerExternalId, restrictionExternalId, state, sourceSystem]
      properties:
        workerExternalId: { type: string }
        restrictionExternalId: { type: string }
        restrictionType: { type: string }
        state:
          type: string
          enum: [review_required, restricted, cleared]
        effectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        siteExternalId: { type: string }
        roleExternalId: { type: string }
        sourceSystem: { type: string }
        sourceRecordId: { type: string }
    SafetySignal:
      type: object
      description: Data-minimised safety/compliance signal for workforce decisions; intentionally excludes free-text incident narratives and medical detail.
      required: [eventId, occurredAt, classification, sourceSystem]
      properties:
        eventId: { type: string }
        occurredAt: { type: string, format: date-time }
        classification: { type: string }
        severity: { type: string }
        workerExternalId: { type: string }
        siteExternalId: { type: string }
        roleExternalId: { type: string }
        actionRequired: { type: boolean }
        sourceSystem: { type: string }
        sourceRecordId: { type: string }
    CanonicalEvent:
      type: object
      required: [eventId, eventType, occurredAt, sourceSystem]
      properties:
        eventId: { type: string }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceSystem: { type: string }
        sourceRecordId: { type: string }
        tenantExternalId: { type: string }
        siteExternalId: { type: string }
        payload: { type: object, additionalProperties: true }
