name: Agency Labour Exchange Shadow Gate

on:
  push:
    branches:
      - 'frontier/agency-labour-exchange-v1'
    paths:
      - 'src/frontier/agency-labour-exchange.mjs'
      - 'src/frontier/agency-labour-performance.mjs'
      - 'src/frontier/agency-right-to-work.mjs'
      - 'src/frontier/agency-right-to-work-dvsp-evidence.mjs'
      - 'src/frontier/agency-right-to-work-lifecycle.mjs'
      - 'src/frontier/agency-right-to-work-refresh.mjs'
      - 'src/frontier/agency-right-to-work-assurance-ledger.mjs'
      - 'src/frontier/agency-right-to-work-authoritative-planner.mjs'
      - 'src/frontier/agency-supplier-compliance.mjs'
      - 'src/frontier/agency-supplier-portal.mjs'
      - 'src/frontier/agency-portal-token-store.mjs'
      - 'src/frontier/agency-supplier-delivery.mjs'
      - 'src/frontier/agency-supplier-delivery-receipt.mjs'
      - 'src/frontier/agency-provider-twilio-sms.mjs'
      - 'test/frontier/agency-labour-exchange.test.mjs'
      - 'test/frontier/agency-labour-performance.test.mjs'
      - 'test/frontier/agency-right-to-work.test.mjs'
      - 'test/frontier/agency-right-to-work-dvsp-transition.test.mjs'
      - 'test/frontier/agency-right-to-work-dvsp-evidence.test.mjs'
      - 'test/frontier/agency-right-to-work-dvsp-evidence-postgres.test.mjs'
      - 'test/frontier/agency-right-to-work-lifecycle.test.mjs'
      - 'test/frontier/agency-right-to-work-integration.test.mjs'
      - 'test/frontier/agency-right-to-work-refresh.test.mjs'
      - 'test/frontier/agency-right-to-work-assurance-ledger.test.mjs'
      - 'test/frontier/agency-right-to-work-assurance-ledger-postgres.test.mjs'
      - 'test/frontier/agency-right-to-work-authoritative-planner.test.mjs'
      - 'test/frontier/agency-dvsp-planner-gate.test.mjs'
      - 'test/frontier/agency-supplier-compliance.test.mjs'
      - 'test/frontier/agency-supplier-compliance-integration.test.mjs'
      - 'test/frontier/agency-supplier-portal.test.mjs'
      - 'test/frontier/agency-supplier-delivery.test.mjs'
      - 'test/frontier/agency-supplier-delivery-claim.test.mjs'
      - 'test/frontier/agency-supplier-delivery-receipt.test.mjs'
      - 'test/frontier/agency-provider-twilio-sms.test.mjs'
      - 'test/frontier/agency-postgres-integration.test.mjs'
      - 'test/frontier/agency-postgres-delivery-claim-race.test.mjs'
      - 'test/frontier/agency-postgres-send-receipt-race.test.mjs'
      - '.github/workflows/agency-labour-exchange-shadow.yml'
      - 'docs/AGENCY_LABOUR_EXCHANGE_V1.md'
      - 'docs/AGENCY_SUPPLIER_DELIVERY_V1.md'
      - 'docs/AGENCY_POSTGRES_INTEGRATION_PROOF_V1.md'
      - 'docs/AGENCY_RIGHT_TO_WORK_ASSURANCE_V1.md'
      - 'docs/AGENCY_RIGHT_TO_WORK_LIFECYCLE_V1.md'
      - 'docs/AGENCY_RIGHT_TO_WORK_REFRESH_V1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-labour-exchange-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agency-labour-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run deterministic agency-labour tests on pinned Node runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            node:22.23.2-bookworm-slim@sha256:4d676821dff059fd00d277ee4261ef34ea712317fed0737c03941481b5760c96 \
            node --test \
              test/frontier/agency-labour-exchange.test.mjs \
              test/frontier/agency-labour-performance.test.mjs \
              test/frontier/agency-right-to-work.test.mjs \
              test/frontier/agency-right-to-work-dvsp-transition.test.mjs \
              test/frontier/agency-right-to-work-dvsp-evidence.test.mjs \
              test/frontier/agency-right-to-work-lifecycle.test.mjs \
              test/frontier/agency-right-to-work-integration.test.mjs \
              test/frontier/agency-right-to-work-refresh.test.mjs \
              test/frontier/agency-right-to-work-assurance-ledger.test.mjs \
              test/frontier/agency-right-to-work-authoritative-planner.test.mjs \
              test/frontier/agency-dvsp-planner-gate.test.mjs \
              test/frontier/agency-supplier-compliance.test.mjs \
              test/frontier/agency-supplier-compliance-integration.test.mjs \
              test/frontier/agency-supplier-portal.test.mjs \
              test/frontier/agency-supplier-delivery.test.mjs \
              test/frontier/agency-supplier-delivery-claim.test.mjs \
              test/frontier/agency-supplier-delivery-receipt.test.mjs \
              test/frontier/agency-provider-twilio-sms.test.mjs
      - name: Run real PostgreSQL agency-store race proof
        shell: bash
        env:
          AGENCY_POSTGRES_PROOF_REQUIRED: '1'
        run: |
          set -euo pipefail
          node --version
          node --test test/frontier/agency-postgres-integration.test.mjs
          node --test test/frontier/agency-postgres-delivery-claim-race.test.mjs
          node --test test/frontier/agency-postgres-send-receipt-race.test.mjs
          node --test test/frontier/agency-right-to-work-dvsp-evidence-postgres.test.mjs
          node --test test/frontier/agency-right-to-work-assurance-ledger-postgres.test.mjs
