name: Invisible Attendance Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'clocking-security-v2/**'
      - '.github/workflows/invisible-attendance-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record runner Node runtime
        run: node --version

      - name: Run invisible-attendance safety suite
        run: node --test clocking-security-v2/invisible-attendance-engine.test.mjs
