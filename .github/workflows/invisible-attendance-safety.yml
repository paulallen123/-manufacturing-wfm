name: Invisible Attendance Safety

on:
  push:
    branches:
      - main
      - feature/invisible-attendance-v1
    paths:
      - 'clocking-security-v2/**'
      - '.github/workflows/invisible-attendance-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invisible-attendance-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-safety:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run invisible-attendance regression suite
        run: node --test clocking-security-v2/*.test.mjs

      - name: Run explicit release-grade rollback-authority suite
        env:
          WFM_RELEASE_GRADE_SECURITY: '1'
        run: node --test clocking-security-v2/release-grade-rollback-authority.test.mjs clocking-security-v2/release-grade-anchor-provenance.security.test.mjs clocking-security-v2/signed-crash-recovery.test.mjs clocking-security-v2/signed-rollback-store-integration.test.mjs
