name: Invisible Attendance Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'clocking-security-v2/**'
      - '.github/workflows/invisible-attendance-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify supported Node runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --input-type=module <<'NODE'
          const [major, minor, patch] = process.versions.node.split('.').map(Number);
          const supported = major > 22 || (major === 22 && (minor > 23 || (minor === 23 && patch >= 2)));
          if (!supported) throw new Error(`Node 22.23.2+ required; runner has ${process.versions.node}`);
          NODE

      - name: Run invisible-attendance safety suite
        run: node --test clocking-security-v2/invisible-attendance-engine.test.mjs
