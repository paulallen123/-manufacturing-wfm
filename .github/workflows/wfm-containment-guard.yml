name: WFM containment guard

on:
  push:
    branches:
      - main
      - 'autonomy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-containment-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-containment:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact trusted push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prove temporary credential and deploy containment
        shell: bash
        run: |
          set -euo pipefail
          SELF='.github/workflows/wfm-containment-guard.yml'
          CANONICAL='.github/workflows/canonical-staging-release.yml'
          RAILWAY_PROOF='.github/workflows/railway-first-deploy.yml'
          BROWSER_PROOF='.github/workflows/live-browser-readonly-proof.yml'

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          if grep -RInE 'pull_request_target:|pull_request:|workflow_run:|issue_comment:' .github/workflows --include='*.yml' --include='*.yaml' --exclude='wfm-every-push-security.yml'; then
            echo 'Untrusted-event workflow execution is present.' >&2
            exit 1
          fi

          if grep -RInE 'runs-on:[[:space:]]*ubuntu-latest' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Mutable ubuntu-latest runner reference is present.' >&2
            exit 1
          fi

          bad_actions="$(
            grep -RhoE '^[[:space:]]*uses:[[:space:]]+[^#[:space:]]+' .github/workflows --include='*.yml' --include='*.yaml' 2>/dev/null \
              | sed -E 's/^[[:space:]]*uses:[[:space:]]+//' \
              | grep -vE '^\./' \
              | grep -vE '@[0-9a-fA-F]{40}$' \
              || true
          )"
          if [ -n "$bad_actions" ]; then
            echo 'Mutable third-party GitHub Action reference is present.' >&2
            echo "$bad_actions" >&2
            exit 1
          fi

          secret_expressions="$(grep -RlF '${{ secrets.' .github/workflows --include='*.yml' --include='*.yaml' || true)"
          inherited_secrets="$(grep -RlE 'secrets:[[:space:]]*inherit' .github/workflows --include='*.yml' --include='*.yaml' || true)"
          if [ -n "$secret_expressions" ] || [ -n "$inherited_secrets" ]; then
            echo 'A GitHub workflow can still consume a repository secret during containment.' >&2
            printf '%s\n%s\n' "$secret_expressions" "$inherited_secrets" >&2
            exit 1
          fi

          for file in "$CANONICAL" "$RAILWAY_PROOF" "$BROWSER_PROOF"; do
            test -f "$file"
            grep -Fq 'workflow_dispatch:' "$file"
            ! grep -Eq '^[[:space:]]+push:' "$file"
            ! grep -Fq 'RAILWAY_TOKEN' "$file"
            ! grep -Fq 'WFM_DEMO_PASSWORD' "$file"
            grep -Fq 'exit 1' "$file"
          done

          grep -Fq 'CANONICAL_STAGING_RELEASE=CONTAINED' "$CANONICAL"
          grep -Fq 'RAILWAY_CUSTOMER_PROOF_ACCESS=CONTAINED' "$RAILWAY_PROOF"
          grep -Fq 'LIVE_BROWSER_CREDENTIAL=CONTAINED' "$BROWSER_PROOF"

          echo 'WFM_TEMPORARY_CONTAINMENT=PASS'
