name: Live browser read-only proof

on:
  push:
    branches:
      - main
      - 'security/**'
    paths:
      - '.github/workflows/live-browser-readonly-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-proof:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WFM_ORIGIN: https://wfm-customer-proof-0676-production.up.railway.app
    steps:
      - name: Install pinned browser driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wfm-browser-proof"
          cd "$RUNNER_TEMP/wfm-browser-proof"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-exact playwright@1.63.0 >/dev/null

      - name: Require patched Chrome before exposing staging credential
        shell: bash
        run: |
          set -euo pipefail
          CHROME_VERSION="$(google-chrome --version | grep -oE '[0-9]+(\.[0-9]+){3}' | head -n1)"
          test -n "$CHROME_VERSION" || { echo 'Unable to determine Google Chrome version.' >&2; exit 1; }
          node - "$CHROME_VERSION" <<'NODE'
          const assert = require('node:assert/strict');
          const actual = process.argv[2].split('.').map(Number);
          const minimum = '153.0.8010.47'.split('.').map(Number);
          const gte = (a,b) => {
            for (let i = 0; i < Math.max(a.length,b.length); i += 1) {
              const av = a[i] || 0, bv = b[i] || 0;
              if (av > bv) return true;
              if (av < bv) return false;
            }
            return true;
          };
          assert.ok(gte(actual, minimum), `Google Chrome ${actual.join('.')} is below the WFM browser-proof security floor ${minimum.join('.')}. Refusing to expose WFM_DEMO_PASSWORD to a browser session until the hosted runner is patched.`);
          console.log(`CHROME_SECURITY_FLOOR=PASS actual=${actual.join('.')} minimum=${minimum.join('.')}`);
          NODE

      - name: Run authenticated read-only customer journey
        env:
          WFM_DEMO_PASSWORD: ${{ secrets.WFM_DEMO_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WFM_DEMO_PASSWORD:-}" || { echo 'WFM_DEMO_PASSWORD repository secret is not configured.' >&2; exit 1; }
          cd "$RUNNER_TEMP/wfm-browser-proof"
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const origin = process.env.WFM_ORIGIN;
            const password = process.env.WFM_DEMO_PASSWORD;
            const browser = await chromium.launch({ channel: 'chrome', headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              const page = await context.newPage();
              const api = [];
              page.on('response', r => {
                try {
                  const u = new URL(r.url());
                  if (u.origin === origin && u.pathname.startsWith('/api/')) api.push(`${r.request().method()} ${u.pathname} ${r.status()}`);
                } catch {}
              });
              await page.goto(origin, { waitUntil: 'networkidle', timeout: 30000 });

              const login = page.locator('#v2-login');
              if (await login.count()) {
                const email = await login.locator('select[name="email"]').inputValue();
                console.log(`LOGIN_FORM_EMAIL=${email}`);
                await login.locator('input[name="password"]').fill(password);
                const loginResponse = page.waitForResponse(r => r.url() === `${origin}/api/login` && r.request().method() === 'POST', { timeout: 15000 });
                await login.locator('button[type="submit"]').click();
                const response = await loginResponse;
                console.log(`BROWSER_LOGIN_STATUS=${response.status()}`);
                if (response.status() !== 200) throw new Error(`Hosted fixture login returned HTTP ${response.status()}`);
              }

              await page.waitForFunction(() => !document.querySelector('#v2-login'), null, { timeout: 15000 });
              await page.waitForTimeout(1000);
              console.log('AUTHENTICATED_BROWSER_SESSION=true');
              console.log(`PAGE_TITLE=${await page.title()}`);

              async function clickReadOnly(label) {
                const loc = page.getByText(label, { exact: true }).first();
                if (!await loc.count() || !await loc.isVisible()) {
                  console.log(`NAV_SKIP=${label}`);
                  return false;
                }
                await loc.click();
                await page.waitForTimeout(800);
                console.log(`NAV_OK=${label}`);
                return true;
              }

              for (const label of ['Inspect readiness','Open weekly schedule','Schedule','Readiness','Time','Payroll','Personal']) {
                await clickReadOnly(label);
              }

              const navLabels = await page.locator('a,button,[role="tab"]').evaluateAll(nodes =>
                [...new Set(nodes.map(n => (n.textContent || '').replace(/\s+/g,' ').trim()).filter(Boolean))].slice(0,120)
              );
              console.log('VISIBLE_NAV_LABELS=' + JSON.stringify(navLabels));

              const kiosk = await context.newPage();
              const kioskResponse = await kiosk.goto(`${origin}/kiosk.html`, { waitUntil: 'networkidle', timeout: 30000 });
              console.log(`KIOSK_STATUS=${kioskResponse?.status()}`);
              if (!kioskResponse || kioskResponse.status() !== 200) throw new Error('Kiosk did not load successfully.');
              console.log(`KIOSK_TITLE=${await kiosk.title()}`);

              console.log('API_RESPONSES_START');
              for (const line of [...new Set(api)]) console.log(line);
              console.log('API_RESPONSES_END');
              console.log('LIVE_BROWSER_READ_ONLY_PROOF=PASS');
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
