name: Integration fabric gate

on:
  push:
    branches:
      - main
      - 'integration/**'
    paths:
      - 'integration-fabric/**'
      - '.github/workflows/integration-fabric-gate.yml'
  pull_request:
    paths:
      - 'integration-fabric/**'
      - '.github/workflows/integration-fabric-gate.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

concurrency:
  group: integration-fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Validate registry and northbound contract
        run: node integration-fabric/scripts/validate.mjs
      - name: Read-only public integration-surface probes
        env:
          PROBE_TIMEOUT_MS: '12000'
          PROBE_CONCURRENCY: '4'
        run: node integration-fabric/scripts/probe-public.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-public-probe-${{ github.sha }}
          path: integration-fabric/reports/public-probe.json
          if-no-files-found: error
          retention-days: 30
