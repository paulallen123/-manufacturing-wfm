name: WFM role-first UX gate

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'ux-overlay/**'
      - '.github/workflows/ux-role-first-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-role-first-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and product-intent checks
        shell: bash
        run: |
          set -euo pipefail
          node --check ux-overlay/ux-reset.js
          node <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync('ux-overlay/ux-reset.js','utf8');
          const css = fs.readFileSync('ux-overlay/ux-reset.css','utf8');
          const requiredJs = [
            "overview:'Today'",
            "leave:'Absence'",
            "'weekly-review':'Sign off'",
            "'savings-decisions':'Performance'",
            'Annual entitlement',
            'Remaining now',
            'Left if approved',
            'Available after all pending',
            'Who else is off',
            '/api/leave-capacity',
            'ux-more-button'
          ];
          for (const x of requiredJs) if (!js.includes(x)) throw new Error(`Missing UX invariant: ${x}`);
          const requiredCss = [
            'html,body{max-width:100%;overflow-x:hidden}',
            '.ux-tool-drawer',
            '.ux-leave-card',
            '.ux-employee-balance'
          ];
          for (const x of requiredCss) if (!css.includes(x)) throw new Error(`Missing CSS invariant: ${x}`);
          console.log('ROLE_FIRST_SOURCE_INVARIANTS=PASS');
          NODE

      - name: Build the exact Docker image
        run: docker build --pull=false -t wfm-role-first-ux:pr .

      - name: Verify approved-asset composition and order
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-role-first-ux:pr)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/wfm-public
          docker cp "$cid:/app/public/index.html" /tmp/wfm-public/index.html
          docker cp "$cid:/app/public/value-cockpit-ui.js" /tmp/wfm-public/value-cockpit-ui.js
          docker cp "$cid:/app/public/factory-control-ui.css" /tmp/wfm-public/factory-control-ui.css
          node --check /tmp/wfm-public/value-cockpit-ui.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/wfm-public/index.html','utf8');
          const js = fs.readFileSync('/tmp/wfm-public/value-cockpit-ui.js','utf8');
          const css = fs.readFileSync('/tmp/wfm-public/factory-control-ui.css','utf8');
          if (!html.includes('value-cockpit-ui.js') || !html.includes('factory-control-ui.css')) throw new Error('Approved presentation assets are not loaded by the base page.');
          if (/ux-reset(?:-cycle[23])?\.(?:js|css)/.test(html)) throw new Error('Standalone UX paths must not be introduced outside the sealed static allow-list.');
          const j1=js.indexOf('WFM_UX_RESET_BASE_BEGIN'),j2=js.indexOf('WFM_UX_RESET_CYCLE2_BEGIN'),j3=js.indexOf('WFM_UX_RESET_CYCLE3_BEGIN');
          const c1=css.indexOf('WFM_UX_RESET_BASE_BEGIN'),c2=css.indexOf('WFM_UX_RESET_CYCLE2_BEGIN'),c3=css.indexOf('WFM_UX_RESET_CYCLE3_BEGIN');
          if (!(j1>=0&&j2>j1&&j3>j2)) throw new Error('UX JS layers are not composed in deterministic order.');
          if (!(c1>=0&&c2>c1&&c3>c2)) throw new Error('UX CSS layers are not composed in deterministic order.');
          if (!js.includes('window.WFMUXReset=')) throw new Error('Role-first UX implementation is missing from the served JS bundle.');
          console.log('ROLE_FIRST_APPROVED_ASSET_COMPOSITION=PASS');
          NODE

      - name: Confirm base artifact and server contract remain intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d' Dockerfile
          ! grep -q 'server.cjs' <(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD) || { echo '::error::UX PR must not modify sealed server logic'; exit 1; }
          echo 'BASE_RUNTIME_ARTIFACT_AND_SERVER_CONTRACT_UNCHANGED=PASS'
