name: Energy Flexibility Shadow Experiment

on:
  pull_request:
    paths:
      - 'src/frontier/energy-*.mjs'
      - 'test/frontier/energy-*.test.mjs'
      - '.github/workflows/energy-flexibility-shadow.yml'
  push:
    branches:
      - 'frontier/energy-flex-shadow-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  energy-flex-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Run deterministic shadow-mode benchmarks
        run: node --test test/frontier/energy-*.test.mjs
