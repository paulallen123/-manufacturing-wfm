name: Energy Flexibility Shadow Experiment

on:
  pull_request:
    paths:
      - 'src/frontier/energy-flexibility.mjs'
      - 'test/frontier/energy-flexibility.test.mjs'
      - '.github/workflows/energy-flexibility-shadow.yml'
  push:
    branches:
      - 'frontier/energy-flex-shadow-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  energy-flex-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run deterministic shadow-mode benchmark
        run: node --test test/frontier/energy-flexibility.test.mjs
