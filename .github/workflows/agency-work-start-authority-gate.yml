name: Agency work-start authority gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'src/frontier/agency-work-start-readiness.mjs'
      - 'test/frontier/agency-work-start-readiness.test.mjs'
      - '.github/workflows/agency-work-start-authority-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-agency-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test test/frontier/agency-work-start-readiness.test.mjs
      - run: node --check src/frontier/agency-work-start-readiness.mjs
      - run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-agency-authority:gate .
      - name: Verify and test installed agency source
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker create vector-agency-authority:gate)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          mkdir -p installed-agency/src/frontier installed-agency/test/frontier
          docker cp "$container_id":/app/operations-runtime/agency/. installed-agency/src/frontier/
          cmp src/frontier/agency-work-start-readiness.mjs installed-agency/src/frontier/agency-work-start-readiness.mjs
          cmp src/frontier/agency-identity-continuity.mjs installed-agency/src/frontier/agency-identity-continuity.mjs
          cp test/frontier/agency-work-start-readiness.test.mjs installed-agency/test/frontier/
          node --test installed-agency/test/frontier/agency-work-start-readiness.test.mjs
          docker image inspect --format '{{.Id}}' vector-agency-authority:gate
