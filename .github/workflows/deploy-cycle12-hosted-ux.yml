name: Deploy Cycle 12 hosted UX proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cycle12-hosted-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cycle12-hosted-ux
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      RAILWAY_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      RAILWAY_SERVICE_ID: '74c1b6e8-a752-4f5e-be0f-f29e15fd1a65'
      EXPECTED_UI_SHA: '8709de700668dca9765568d9c87d2ae27b5db4b8'
      WFM_PUBLIC_ORIGIN: 'https://wfm-ux-cycle12-hosted-production.up.railway.app'

    steps:
      - name: Checkout exact Cycle 12 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '8709de700668dca9765568d9c87d2ae27b5db4b8'
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity and Cycle 12 composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_UI_SHA"
          grep -F 'WFM_UX_RESET_CYCLE12_BEGIN' Dockerfile
          grep -F 'ux-reset-cycle12.js' Dockerfile
          grep -F 'ux-reset-cycle12.css' Dockerfile
          node --check ux-overlay/ux-reset-cycle12-model.js
          node --check ux-overlay/ux-reset-cycle12.js
          echo "CYCLE12_SOURCE_IDENTITY=PASS"

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN="$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)"
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"
          "$CLI_BIN" --version

      - name: Upload exact candidate to isolated Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN repository secret is not configured.' >&2; exit 1; }

          "$RAILWAY_BIN" variable list \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json > "$RUNNER_TEMP/cycle12-railway-vars.json"

          node scripts/validate-railway-proof-env.mjs "$RUNNER_TEMP/cycle12-railway-vars.json"

          "$RAILWAY_BIN" up \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --ci

          success=0
          for attempt in $(seq 1 90); do
            "$RAILWAY_BIN" deployment list \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --json > "$RUNNER_TEMP/cycle12-deployments.json"
            status="$(node --input-type=module - "$RUNNER_TEMP/cycle12-deployments.json" <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const list = Array.isArray(value) ? value : (value.deployments || []);
          const latest = list[0] || {};
          process.stdout.write(String(latest.status || latest.state || '').toUpperCase());
          NODE
            )"
            echo "RAILWAY_DEPLOYMENT_STATUS=$status"
            if [ "$status" = "SUCCESS" ]; then success=1; break; fi
            if [ "$status" = "FAILED" ] || [ "$status" = "CRASHED" ] || [ "$status" = "REMOVED" ]; then exit 1; fi
            sleep 4
          done
          test "$success" = "1"

          curl --fail --silent --show-error "$WFM_PUBLIC_ORIGIN/api/health" > "$RUNNER_TEMP/cycle12-health.json"
          node --input-type=module - "$RUNNER_TEMP/cycle12-health.json" <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(health.productionApproved !== false || health.pilotReady !== false) throw new Error('Unexpected release authority state.');
          if(health.release !== '0.6.76-hosted-staging-rc1') throw new Error('Unexpected release identity.');
          console.log('CYCLE12_HOSTED_HEALTH=PASS');
          NODE

          curl --fail --silent --show-error "$WFM_PUBLIC_ORIGIN/value-cockpit-ui.js" > "$RUNNER_TEMP/cycle12-ui.js"
          grep -F 'WFM_UX_RESET_CYCLE12_BEGIN' "$RUNNER_TEMP/cycle12-ui.js"
          grep -F 'WFMUXCycle12' "$RUNNER_TEMP/cycle12-ui.js"
          echo "CYCLE12_SERVED_ASSET=PASS"

          node --input-type=module - "$RUNNER_TEMP/cycle12-railway-vars.json" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const vars=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!vars.WFM_STAGING_PASSWORD || vars.WFM_STAGING_PASSWORD.length < 16) throw new Error('Staging credential unavailable.');
          process.env.WFM_STAGING_PASSWORD=vars.WFM_STAGING_PASSWORD;
          process.env.WFM_PUBLIC_ORIGIN='https://wfm-ux-cycle12-hosted-production.up.railway.app';
          const source=fs.readFileSync('scripts/live-browser-screenshot-proof.mjs','utf8')
            .replaceAll('https://wfm-customer-proof-0676-production.up.railway.app', process.env.WFM_PUBLIC_ORIGIN);
          const file=path.join(process.env.RUNNER_TEMP,'cycle12-browser-proof.mjs');
          fs.writeFileSync(file,source);
          await import(pathToFileURL(file).href);
          delete process.env.WFM_STAGING_PASSWORD;
          NODE

          rm -f "$RUNNER_TEMP/cycle12-railway-vars.json"

      - name: Upload Cycle 12 hosted screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wfm-cycle12-hosted-evidence
          path: ${{ runner.temp }}/wfm-evidence-output
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
