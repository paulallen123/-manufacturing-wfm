name: WFM UX evolution cycle 4 gate

on:
  push:
    branches:
      - main
      - 'ux/**'
      - 'autonomy/**'
    paths:
      - 'Dockerfile'
      - 'ux-overlay/**'
      - '.github/workflows/ux-cycle4-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-ux-cycle4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cycle4-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Syntax and value-safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check ux-overlay/ux-reset-cycle4.js
          node <<'NODE'
          const fs=require('node:fs');
          const js=fs.readFileSync('ux-overlay/ux-reset-cycle4.js','utf8');
          const css=fs.readFileSync('ux-overlay/ux-reset-cycle4.css','utf8');
          for(const x of ['COST & EFFICIENCY','VALUE AWAITING A DECISION','Highest-value evidenced opportunity','More opportunities','Reviewed decisions','Estimate · not realised cash','not automatically claimable','opportunityValue','uxPerformance=\'focused\'']) if(!js.includes(x)) throw new Error('Missing Cycle 4 invariant: '+x);
          for(const x of ['.ux-performance-desk','.ux-performance-focus','.ux-performance-detail-body','[data-ux-job="performance"]','@media(max-width:680px)']) if(!css.includes(x)) throw new Error('Missing Cycle 4 CSS invariant: '+x);
          if(/predictedValueAwaitingPence\s*=/.test(js)||/hardCashAvoidableCostPoolPence\s*=/.test(js)) throw new Error('Presentation layer must not rewrite value calculations.');
          console.log('UX_CYCLE4_SOURCE_INVARIANTS=PASS');
          NODE

      - name: Build exact composed image
        run: docker build --pull=false -t wfm-ux-cycle4:pr .

      - name: Verify Cycle 4 is the final approved presentation layer
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-ux-cycle4:pr)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/wfm-cycle4
          docker cp "$cid:/app/public/index.html" /tmp/wfm-cycle4/index.html
          docker cp "$cid:/app/public/value-cockpit-ui.js" /tmp/wfm-cycle4/value-cockpit-ui.js
          docker cp "$cid:/app/public/factory-control-ui.css" /tmp/wfm-cycle4/factory-control-ui.css
          node --check /tmp/wfm-cycle4/value-cockpit-ui.js
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('/tmp/wfm-cycle4/index.html','utf8');
          const js=fs.readFileSync('/tmp/wfm-cycle4/value-cockpit-ui.js','utf8');
          const css=fs.readFileSync('/tmp/wfm-cycle4/factory-control-ui.css','utf8');
          if(/ux-reset(?:-cycle[234])?\.(?:js|css)/.test(html)) throw new Error('Standalone UX paths must not be introduced outside the sealed static allow-list.');
          const j3=js.indexOf('WFM_UX_RESET_CYCLE3_BEGIN'),j4=js.indexOf('WFM_UX_RESET_CYCLE4_BEGIN');
          const c3=css.indexOf('WFM_UX_RESET_CYCLE3_BEGIN'),c4=css.indexOf('WFM_UX_RESET_CYCLE4_BEGIN');
          if(!(j3>=0&&j4>j3&&c3>=0&&c4>c3)) throw new Error('Cycle 4 must compose after Cycle 3.');
          if(!js.includes('window.WFMUXCycle4=')) throw new Error('Cycle 4 is missing from the served JS bundle.');
          if(!css.includes('.ux-performance-desk')) throw new Error('Cycle 4 is missing from the served CSS bundle.');
          console.log('UX_CYCLE4_APPROVED_ASSET_COMPOSITION=PASS');
          NODE
          grep -q '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d' Dockerfile
          if grep -Eq '^(COPY|ADD).*server\.cjs|^RUN .*server\.cjs' Dockerfile; then echo '::error::UX composition must not replace or mutate sealed server logic'; exit 1; fi
          echo 'BASE_RUNTIME_ARTIFACT_AND_SERVER_CONTRACT_UNCHANGED=PASS'

      - name: Verify sealed server delivers Cycle 4 through approved assets
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name wfm-ux-cycle4-run --network host \
            -e PORT=4101 \
            -e NODE_ENV=staging \
            -e NODE_OPTIONS=--experimental-sqlite \
            -e WFM_DB=/tmp/wfm-ux-cycle4.sqlite \
            wfm-ux-cycle4:pr
          trap 'docker rm -f wfm-ux-cycle4-run >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4101/api/health >/tmp/health4.json; then break; fi
            sleep .5
          done
          test -s /tmp/health4.json
          curl -fsS http://127.0.0.1:4101/value-cockpit-ui.js >/tmp/served-ui4.js
          curl -fsS http://127.0.0.1:4101/factory-control-ui.css >/tmp/served-ui4.css
          grep -q 'WFM_UX_RESET_CYCLE4_BEGIN' /tmp/served-ui4.js
          grep -q 'WFM_UX_RESET_CYCLE4_BEGIN' /tmp/served-ui4.css
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4101/ux-reset-cycle4.js)" = "404"
          echo 'UX_CYCLE4_SERVER_DELIVERY_CONTRACT=PASS'

      - name: Browser-check focused performance desk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ux-performance-harness
          cp ux-overlay/ux-reset-cycle4.js /tmp/ux-performance-harness/ux-reset-cycle4.js
          cp ux-overlay/ux-reset-cycle4.css /tmp/ux-performance-harness/ux-reset-cycle4.css
          cat > /tmp/ux-performance-harness/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/ux-reset-cycle4.css"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f7;font-family:Arial,sans-serif}.content{max-width:1280px;margin:auto;padding:24px}.vc-card{background:#fff;border:1px solid #dfe6e3;border-radius:16px;padding:18px}.vc-card-top{display:flex;justify-content:space-between;gap:12px}.vc-value strong{display:block;font-size:32px}.vc-buttons{display:flex;gap:8px}.eyebrow{font-size:10px}.vc-principle{padding:14px;background:#f5f7f6}.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}</style></head>
          <body class="ux-reset-active" data-ux-job="performance"><main class="content">
            <section class="vc-hero"><h1>Original value desk</h1></section>
            <div class="vc-insight">Original avoidable-cost context</div>
            <div class="vc-grid">
              <article class="vc-card"><div class="vc-card-top"><div><span class="eyebrow">manufacturing recovery</span><h2>Protect output on Packaging</h2></div><span class="vc-state waiting">Decision needed</span></div><div class="vc-value"><small>Predicted economic improvement</small><strong>£500</strong><span>Estimate · not realised cash</span></div><p class="vc-why">A reviewed recovery scenario is available.</p><div class="vc-buttons"><button data-act="vc-decision" data-decision="no">NO · not now</button><button data-act="vc-decision" data-decision="yes">YES · proceed</button></div></article>
              <article class="vc-card"><div class="vc-card-top"><div><span class="eyebrow">staffing recommendation</span><h2>Prevent premium on Assembly</h2></div><span class="vc-state waiting">Decision needed</span></div><div class="vc-value"><small>Estimated plan cost reduction</small><strong>£1,200</strong><span>Estimate · not realised cash</span></div><p class="vc-why">Lower-cost eligible cover exists.</p><div class="vc-explain"><b>What happens if you say YES?</b><p>Create the controlled recommendation.</p></div><details><summary>Show evidence</summary><p>Evidence A</p></details><div class="vc-buttons"><button data-act="vc-decision" data-decision="no">NO · not now</button><button data-act="vc-decision" data-decision="yes">YES · proceed</button></div></article>
              <article class="vc-card"><div class="vc-card-top"><div><span class="eyebrow">staffing recommendation</span><h2>Reviewed Mixing plan</h2></div><span class="vc-state yes">YES · approved</span></div><div class="vc-value"><small>Estimated plan cost reduction</small><strong>£300</strong></div><div class="vc-done"><b>Approved for controlled progression.</b></div></article>
            </div>
            <div class="vc-principle"><b>Control rule:</b> YES never bypasses consent, coverage, payroll authority or fresh eligibility.</div>
          </main>
          <script>
          var ui={page:'savings-decisions',role:'director'};
          var F={actor:{role:'director',costs:true}};
          function isEmployee(){return false}
          async function render(){}
          var VCU={report:{summary:{awaitingDecision:2,predictedValueAwaitingPence:170000,predictedValueApprovedPence:30000},insight:{hardCashAvoidableCostPoolPence:240000},opportunities:[
            {key:'op-b',status:'awaiting_decision',value:{amountPence:50000}},
            {key:'op-a',status:'awaiting_decision',value:{amountPence:120000}},
            {key:'op-c',status:'yes',value:{amountPence:30000}}
          ]}};
          </script><script src="/ux-reset-cycle4.js"></script></body></html>
          HTML
          python3 -m http.server 9227 --bind 127.0.0.1 --directory /tmp/ux-performance-harness >/tmp/ux-performance-harness.log 2>&1 &
          HARNESS_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9226 --user-data-dir=/tmp/wfm-cycle4-chrome --window-size=1440,1000 http://127.0.0.1:9227 >/tmp/chrome4.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$HARNESS_PID" >/dev/null 2>&1 || true' EXIT
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(fn,n=60){let e;for(let i=0;i<n;i++){try{return await fn()}catch(x){e=x;await sleep(200)}}throw e}
          const targets=await retry(async()=>{const r=await fetch('http://127.0.0.1:9226/json/list');const x=await r.json();const p=x.find(v=>v.type==='page');if(!p)throw Error('No browser page');return x});
          const page=targets.find(x=>x.type==='page'),ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=()=>bad(Error('CDP open failed'))});
          let id=1;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
          const evalx=async expression=>(await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true})).result?.value;
          await send('Runtime.enable');
          await retry(async()=>{const ready=await evalx("document.readyState==='complete'&&Boolean(document.querySelector('.ux-performance-desk'))");if(!ready)throw Error('not ready');return true});
          const proof=await evalx(`(()=>({desk:!!document.querySelector('.ux-performance-desk'),focused:document.querySelector('.ux-performance-card-focus')?.dataset.uxOpportunityKey||null,queueKey:document.querySelector('.ux-performance-detail.queue .vc-card')?.dataset.uxOpportunityKey||null,queueCards:document.querySelectorAll('.ux-performance-detail.queue .vc-card').length,reviewedCards:document.querySelectorAll('.ux-performance-detail.reviewed .vc-card').length,oldHero:!!document.querySelector('.vc-hero'),oldGrid:!!document.querySelector('.vc-grid'),state:document.body.dataset.uxPerformance||null,yesButtons:document.querySelectorAll('.ux-performance-focus [data-decision="yes"]').length,noButtons:document.querySelectorAll('.ux-performance-focus [data-decision="no"]').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,text:document.querySelector('.ux-performance-desk')?.textContent||''}))()`);
          console.log('UX_CYCLE4_BROWSER_PROOF='+JSON.stringify(proof));
          if(!proof.desk||proof.focused!=='op-a')throw Error('Highest-value waiting opportunity is not focused independent of source order');
          if(proof.queueKey!=='op-b'||proof.queueCards!==1||proof.reviewedCards!==1)throw Error('Opportunity value ranking/grouping is incorrect');
          if(proof.oldHero||proof.oldGrid)throw Error('Legacy long-stack containers remain visible');
          if(proof.state!=='focused')throw Error('Focused performance state marker is missing');
          if(proof.yesButtons!==1||proof.noButtons!==1)throw Error('Existing YES/NO controls were not preserved');
          if(proof.overflow>2)throw Error('Desktop page-wide overflow detected');
          for(const x of ['2 decisions need you','£1,700','£2,400'])if(!proof.text.includes(x))throw Error('Missing performance summary '+x);
          const queueOpen=await evalx(`(()=>{const d=document.querySelector('.ux-performance-detail.queue');if(!d)return false;d.open=true;return d.open&&d.querySelectorAll('.vc-card').length===1})()`);if(!queueOpen)throw Error('More-opportunities disclosure failed');
          await send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:1,mobile:true});await sleep(250);
          const mobile=await evalx(`(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,kpis:getComputedStyle(document.querySelector('.ux-performance-kpis')).gridTemplateColumns}))()`);
          console.log('UX_CYCLE4_MOBILE_PROOF='+JSON.stringify(mobile));
          if(mobile.overflow>2)throw Error('Mobile page-wide overflow detected');
          console.log('UX_CYCLE4_BROWSER_INTERACTION=PASS');
          ws.close();
          NODE
