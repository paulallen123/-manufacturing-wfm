name: WFM staging browser proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wfm-staging-browser-proof.yml']

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://wfm-staging-runtime-0670-production.up.railway.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/wfm-proof"
          cd "$RUNNER_TEMP/wfm-proof"
          npm init -y >/dev/null
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run authenticated RC6 customer journey
        run: |
          cd "$RUNNER_TEMP/wfm-proof"
          cat > proof.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base=process.env.BASE_URL;
          const proofCredential=createHash('sha256').update('PUBLIC-WFM-E2E:'+base).digest('hex');
          const out='proof'; fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:`${out}/video`,size:{width:1280,height:720}}});
          await context.tracing.start({screenshots:true,snapshots:true,sources:true});
          const page=await context.newPage();
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          const health=await context.request.get(`${base}/api/health`); assert.equal(health.status(),200); const healthBody=await health.json();
          assert.equal(healthBody.mode,'hosted-staging'); assert.equal(healthBody.release,'0.6.70-hosted-staging-rc6'); assert.equal(healthBody.productionApproved,false); assert.equal(healthBody.pilotReady,false);
          await page.goto(base,{waitUntil:'networkidle'});
          const loginText=await page.locator('body').innerText(); assert.match(loginText,/Isolated hosted staging demo/); assert.doesNotMatch(loginText,/locked to your computer/i); assert.equal(await page.locator('input[name="password"]').inputValue(),'');
          await page.screenshot({path:`${out}/01-hosted-login.png`,fullPage:true});
          await page.locator('select[name="email"]').selectOption('manager@northstar.example');
          await page.locator('input[name="password"]').fill(proofCredential);
          await page.locator('#v2-login button[type="submit"]').click();
          await page.waitForFunction(()=>!document.querySelector('#v2-login'),null,{timeout:15000}); await page.waitForLoadState('networkidle');
          await page.waitForFunction(()=>document.body.innerText.includes('FACTORY CONTROL CENTRE'));
          const overviewText=await page.locator('body').innerText(); assert.match(overviewText,/FACTORY CONTROL CENTRE/); assert.match(overviewText,/HOSTED STAGING DEMO/); assert.match(overviewText,/Hosted staging demo/); assert.match(overviewText,/Hosted staging evidence/); assert.doesNotMatch(overviewText,/LOCAL DEVELOPMENT|Development evidence/);
          await page.screenshot({path:`${out}/02-factory-control-centre.png`,fullPage:true});
          const boot=await page.evaluate(async()=>{const r=await fetch('/api/bootstrap');return {status:r.status,body:await r.json()}}); assert.equal(boot.status,200); assert.equal(boot.body.mode,'hosted-staging'); assert.equal(boot.body.actor?.email,'manager@northstar.example'); assert.equal(boot.body.actor?.tenant,'northstar-demo');
          const cookies=await context.cookies(base); const session=cookies.find(c=>c.name==='wfm_session'); assert.ok(session); assert.equal(session.httpOnly,true); assert.equal(session.secure,true); assert.equal(session.sameSite,'Strict');
          await page.locator('.fcc-workspace[data-page="schedule-publication"]').click(); await page.waitForFunction(()=>document.body.innerText.includes('Build and publish the week.'),null,{timeout:15000}); await page.screenshot({path:`${out}/03-schedule.png`,fullPage:true});
          await page.locator('.fcc-workspace[data-page="readiness"]').click(); await page.waitForFunction(()=>document.body.innerText.includes('MANUFACTURING DECISION DESK'),null,{timeout:15000}); await page.screenshot({path:`${out}/04-readiness.png`,fullPage:true});
          const payrollTab=page.locator('.fcc-workspace[data-page="payroll-run"]'); if(await payrollTab.count()){await payrollTab.click(); await page.waitForTimeout(500); const payrollText=await page.locator('body').innerText(); assert.match(payrollText,/Payroll authority required|Weekly readiness|Payroll readiness/); assert.match(payrollText,/HOSTED STAGING DEMO|Hosted staging demo/); await page.screenshot({path:`${out}/05-payroll-boundary.png`,fullPage:true});}
          const unauth=await browser.newContext(); const denied=await unauth.request.get(`${base}/api/bootstrap`); assert.equal(denied.status(),401); await unauth.close();
          const kiosk=await browser.newContext({viewport:{width:1024,height:768}}); const kp=await kiosk.newPage(); await kp.goto(`${base}/kiosk.html`,{waitUntil:'networkidle'}); const kioskText=await kp.locator('body').innerText(); assert.match(kioskText,/Register this tablet/); assert.match(kioskText,/Fictional demonstration environment/); assert.doesNotMatch(kioskText,/Fictional development build/); await kp.screenshot({path:`${out}/06-kiosk.png`,fullPage:true}); await kiosk.close();
          const result={passed:true,base,release:healthBody.release,actor:{email:boot.body.actor.email,tenant:boot.body.actor.tenant,role:boot.body.actor.role},staff:boot.body.state?.staff?.length??null,assignments:boot.body.state?.assignments?.length??null,secureCookie:{httpOnly:session.httpOnly,secure:session.secure,sameSite:session.sameSite},unauthenticatedBootstrap:denied.status(),pageErrors};
          fs.writeFileSync(`${out}/result.json`,JSON.stringify(result,null,2)); await context.tracing.stop({path:`${out}/trace.zip`}); await context.close(); await browser.close(); assert.equal(pageErrors.length,0); console.log(JSON.stringify(result));
          NODE
          node proof.mjs
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfm-staging-browser-proof
          path: ${{ runner.temp }}/wfm-proof/proof
          if-no-files-found: warn
