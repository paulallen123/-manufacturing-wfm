name: WFM sealed 0.6.76 browser proof

# Security model: prove the exact sealed candidate only on localhost.
# No public staging endpoint, deterministic public credential, npm/Playwright install,
# or mutable GitHub Action is permitted in this proof lane.
on:
  push:
    branches:
      - main
      - 'autonomy/**'
    paths:
      - 'Dockerfile'
      - 'DEPLOYMENT_MANIFEST.json'
      - 'STAGING_FREEZE.json'
      - 'artifact/**'
      - 'resilience/security-baseline.json'
      - 'scripts/validate-deployment.mjs'
      - '.github/workflows/wfm-staging-browser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-sealed-browser-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sealed-browser-proof:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted sealed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Validate sealed deployment contract
        run: node scripts/validate-deployment.mjs

      - name: Enforce signed patched browser floor
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'No approved Chrome/Chromium binary present on runner' >&2; exit 1; }
          MINIMUM="$(node -p "require('./resilience/security-baseline.json').browser.minimum")"
          version_ge() {
            ACTUAL_VERSION="$1" MIN_VERSION="$2" node <<'NODE'
          const parse = v => String(v).split('.').map(Number);
          const a = parse(process.env.ACTUAL_VERSION), m = parse(process.env.MIN_VERSION);
          if (a.length !== 4 || m.length !== 4 || a.some(Number.isNaN) || m.some(Number.isNaN)) process.exit(2);
          for (let i=0;i<4;i++) { if (a[i] > m[i]) process.exit(0); if (a[i] < m[i]) process.exit(1); }
          process.exit(0);
          NODE
          }
          ACTUAL="$($BROWSER --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if ! version_ge "$ACTUAL" "$MINIMUM"; then
            echo "Runner browser $ACTUAL is below required security floor $MINIMUM; requesting exact Google-signed stable package."
            grep -RqsE 'https?://dl\.google\.com/linux/chrome/deb/' /etc/apt/sources.list /etc/apt/sources.list.d || { echo 'Approved Google Chrome apt repository is not configured on this runner' >&2; exit 1; }
            sudo apt-get update -qq
            sudo apt-get install -y --only-upgrade "google-chrome-stable=${MINIMUM}-1"
            BROWSER="$(command -v google-chrome || command -v google-chrome-stable)"
            ACTUAL="$($BROWSER --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            INSTALLED="$(dpkg-query -W -f='${Version}' google-chrome-stable)"
            test "$INSTALLED" = "${MINIMUM}-1"
          fi
          version_ge "$ACTUAL" "$MINIMUM" || { echo "Browser $ACTUAL remains below security floor $MINIMUM" >&2; exit 1; }
          echo "WFM_BROWSER=$BROWSER" >> "$GITHUB_ENV"
          echo "WFM_BROWSER_VERSION=$ACTUAL" >> "$GITHUB_ENV"
          echo "Approved browser: $BROWSER $ACTUAL (minimum $MINIMUM)"

      - name: Build exact sealed customer-proof container
        run: docker build --pull=false -t manufacturing-wfm:sealed-browser-proof .

      - name: Start exact candidate with non-public ephemeral auth
        shell: bash
        run: |
          set -euo pipefail
          PROOF_PASSWORD="CI-$(openssl rand -hex 24)"
          echo "WFM_PROOF_PASSWORD=$PROOF_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name wfm-proof -p 3000:3000 \
            -e PORT=3000 \
            -e NODE_ENV=staging \
            -e NODE_OPTIONS=--experimental-sqlite \
            -e WFM_HOSTED_STAGING=true \
            -e WFM_PUBLIC_ORIGIN=https://wfm-ci.invalid:8443 \
            -e WFM_DB=/tmp/wfm-browser-proof.sqlite \
            -e WFM_STAGING_PASSWORD="$PROOF_PASSWORD" \
            manufacturing-wfm:sealed-browser-proof
          test "$(docker exec wfm-proof id -u)" != "0"

      - name: Start localhost-only TLS reverse proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wfm-browser-proof" "$RUNNER_TEMP/wfm-browser-proof/evidence"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=wfm-ci.invalid' \
            -addext 'subjectAltName=DNS:wfm-ci.invalid' \
            -keyout "$RUNNER_TEMP/wfm-browser-proof/key.pem" \
            -out "$RUNNER_TEMP/wfm-browser-proof/cert.pem" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/wfm-browser-proof/proxy.mjs" <<'NODE'
          import https from 'node:https';
          import http from 'node:http';
          import fs from 'node:fs';
          const key=fs.readFileSync(process.env.PROXY_KEY);
          const cert=fs.readFileSync(process.env.PROXY_CERT);
          const server=https.createServer({key,cert},(req,res)=>{
            const headers={...req.headers,host:'wfm-ci.invalid:8443','x-forwarded-proto':'https','x-forwarded-host':'wfm-ci.invalid:8443'};
            const upstream=http.request({host:'127.0.0.1',port:3000,path:req.url,method:req.method,headers},u=>{res.writeHead(u.statusCode||502,u.headers);u.pipe(res);});
            upstream.on('error',e=>{res.statusCode=502;res.end('proxy error');console.error(e);});
            req.pipe(upstream);
          });
          server.listen(8443,'127.0.0.1',()=>console.log('LOCAL_TLS_PROXY_READY'));
          NODE
          PROXY_KEY="$RUNNER_TEMP/wfm-browser-proof/key.pem" PROXY_CERT="$RUNNER_TEMP/wfm-browser-proof/cert.pem" \
            node "$RUNNER_TEMP/wfm-browser-proof/proxy.mjs" >"$RUNNER_TEMP/wfm-browser-proof/proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wfm-browser-proof/proxy.pid"
          for i in $(seq 1 30); do
            if curl -kfsS --resolve wfm-ci.invalid:8443:127.0.0.1 https://wfm-ci.invalid:8443/api/health >"$RUNNER_TEMP/wfm-browser-proof/evidence/health.json"; then break; fi
            sleep 1
          done
          curl -kfsS --resolve wfm-ci.invalid:8443:127.0.0.1 https://wfm-ci.invalid:8443/api/health

      - name: Run Chromium customer journey with built-in CDP only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/wfm-browser-proof"
          "$WFM_BROWSER" \
            --headless=new \
            --remote-debugging-port=9222 \
            --user-data-dir="$ROOT/chrome-profile" \
            --ignore-certificate-errors \
            --host-resolver-rules='MAP * 127.0.0.1' \
            --disable-background-networking \
            --disable-component-update \
            --disable-default-apps \
            --disable-sync \
            --metrics-recording-only \
            --no-first-run \
            about:blank >"$ROOT/chrome.log" 2>&1 &
          echo $! > "$ROOT/chrome.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >"$ROOT/evidence/browser-version.json"; then break; fi
            sleep 1
          done
          cat > "$ROOT/browser-proof.mjs" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://wfm-ci.invalid:8443';
          const out=process.env.EVIDENCE_DIR;
          const password=process.env.WFM_PROOF_PASSWORD;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const target=await (await fetch('http://127.0.0.1:9222/json/new?'+encodeURIComponent(base+'/'),{method:'PUT'})).json();
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true});});
          let seq=0; const pending=new Map(); const errors=[];
          ws.addEventListener('message',event=>{
            const msg=JSON.parse(event.data);
            if(msg.id){const p=pending.get(msg.id);if(!p)return;pending.delete(msg.id);msg.error?p.reject(new Error(JSON.stringify(msg.error))):p.resolve(msg.result);return;}
            if(msg.method==='Runtime.exceptionThrown') errors.push('exception:'+JSON.stringify(msg.params.exceptionDetails?.exception?.description||msg.params.exceptionDetails?.text||msg.params));
            if(msg.method==='Runtime.consoleAPICalled'&&msg.params.type==='error') errors.push('console:'+JSON.stringify(msg.params.args?.map(x=>x.value||x.description)));
            if(msg.method==='Log.entryAdded'&&msg.params.entry?.level==='error') errors.push('log:'+msg.params.entry.text);
          });
          const cdp=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          const evaluate=async expression=>{const r=await cdp('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true,userGesture:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'Runtime evaluation failed');return r.result?.value;};
          const body=()=>evaluate('document.body ? document.body.innerText : ""');
          const waitFor=async(fn,label,timeout=15000)=>{const start=Date.now();while(Date.now()-start<timeout){if(await fn())return;await sleep(200);}throw new Error('Timed out waiting for '+label);};
          const screenshot=async name=>{const r=await cdp('Page.captureScreenshot',{format:'png',captureBeyondViewport:true,fromSurface:true});fs.writeFileSync(`${out}/${name}.png`,Buffer.from(r.data,'base64'));};
          const clickAny=async(names,label)=>{const selectors=names.flatMap(n=>[`.fcc-workspace[data-page="${n}"]`,`.sidebar [data-page="${n}"]`,`[data-page="${n}"]`]);const result=await evaluate(`(()=>{for(const s of ${JSON.stringify(selectors)}){const el=document.querySelector(s);if(el){el.click();return s}}return null})()`);assert.ok(result,`No navigation control found for ${label}: ${names.join(',')}`);await sleep(500);return result;};
          await cdp('Page.enable');await cdp('Runtime.enable');await cdp('Network.enable');await cdp('Log.enable');
          await cdp('Emulation.setDeviceMetricsOverride',{width:1440,height:1000,deviceScaleFactor:1,mobile:false});
          await cdp('Page.navigate',{url:base+'/'});await waitFor(async()=>await evaluate('document.readyState')==='complete','initial page load');
          const health=await evaluate(`fetch('/api/health').then(async r=>({status:r.status,body:await r.json()}))`);
          assert.equal(health.status,200);assert.equal(health.body.mode,'hosted-staging');assert.equal(health.body.release,'0.6.76-hosted-staging-rc1');assert.equal(health.body.productionApproved,false);assert.equal(health.body.pilotReady,false);
          const loginText=await body();assert.match(loginText,/staging|demo/i);assert.equal(await evaluate('document.querySelector(\'input[name="password"]\')?.value||""'),'');await screenshot('01-login');
          const login=await evaluate(`(()=>{const email=document.querySelector('select[name="email"]');const pass=document.querySelector('input[name="password"]');const submit=document.querySelector('#v2-login button[type="submit"],form button[type="submit"]');if(!email||!pass||!submit)return {ok:false,email:!!email,pass:!!pass,submit:!!submit};email.value='manager@northstar.example';email.dispatchEvent(new Event('change',{bubbles:true}));pass.value=${JSON.stringify(password)};pass.dispatchEvent(new Event('input',{bubbles:true}));submit.click();return {ok:true}})()`);assert.equal(login.ok,true,JSON.stringify(login));
          await waitFor(async()=>/FACTORY CONTROL CENTRE|Manufacturing|Operations/i.test(await body()),'authenticated workspace');await screenshot('02-authenticated-home');
          const boot=await evaluate(`fetch('/api/bootstrap').then(async r=>({status:r.status,body:await r.json()}))`);assert.equal(boot.status,200);assert.equal(boot.body.mode,'hosted-staging');assert.equal(boot.body.actor?.tenant,'northstar-demo');
          const cookies=(await cdp('Network.getAllCookies')).cookies;const session=cookies.find(x=>x.name==='wfm_session');assert.ok(session,'Missing wfm_session');assert.equal(session.httpOnly,true);assert.equal(session.secure,true);assert.equal(session.sameSite,'Strict');
          await clickAny(['schedule-publication','shifts'],'schedule');await screenshot('03-schedule');
          await clickAny(['readiness','operations'],'readiness/operations');await screenshot('04-readiness');
          await clickAny(['time-review','attendance'],'time review/attendance');await screenshot('05-time-review');
          await clickAny(['payroll-run','payroll'],'payroll');await screenshot('06-payroll');
          await clickAny(['costs','cost','recommendation'],'cost/recommendation');await screenshot('07-cost');
          await cdp('Page.navigate',{url:base+'/kiosk.html'});await waitFor(async()=>await evaluate('document.readyState')==='complete','kiosk');const kioskText=await body();assert.match(kioskText,/Register this tablet|clock/i);assert.match(kioskText,/fictional|demo/i);await screenshot('08-kiosk');
          const summary={passed:true,release:health.body.release,browserVersion:process.env.WFM_BROWSER_VERSION,actor:{email:boot.body.actor?.email,tenant:boot.body.actor?.tenant,role:boot.body.actor?.role},secureCookie:{httpOnly:session.httpOnly,secure:session.secure,sameSite:session.sameSite},screenshots:8,runtimeErrors:errors};fs.writeFileSync(`${out}/browser-proof-result.json`,JSON.stringify(summary,null,2));ws.close();assert.equal(errors.length,0,JSON.stringify(errors));console.log(JSON.stringify(summary));
          NODE
          EVIDENCE_DIR="$ROOT/evidence" WFM_PROOF_PASSWORD="$WFM_PROOF_PASSWORD" WFM_BROWSER_VERSION="$WFM_BROWSER_VERSION" node "$ROOT/browser-proof.mjs"
          denied=$(curl -ksS --resolve wfm-ci.invalid:8443:127.0.0.1 -o "$ROOT/evidence/bootstrap-unauth.json" -w '%{http_code}' https://wfm-ci.invalid:8443/api/bootstrap)
          test "$denied" = "401"
          echo "unauthenticated_bootstrap=$denied" > "$ROOT/evidence/security-boundary.txt"

      - name: Upload sealed browser proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wfm-sealed-0.6.76-browser-proof
          path: ${{ runner.temp }}/wfm-browser-proof/evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker logs wfm-proof || true
          cat "$RUNNER_TEMP/wfm-browser-proof/proxy.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/wfm-browser-proof/chrome.log" 2>/dev/null || true

      - name: Stop isolated proof processes
        if: always()
        shell: bash
        run: |
          docker rm -f wfm-proof || true
          test ! -f "$RUNNER_TEMP/wfm-browser-proof/proxy.pid" || kill "$(cat "$RUNNER_TEMP/wfm-browser-proof/proxy.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/wfm-browser-proof/chrome.pid" || kill "$(cat "$RUNNER_TEMP/wfm-browser-proof/chrome.pid")" 2>/dev/null || true
