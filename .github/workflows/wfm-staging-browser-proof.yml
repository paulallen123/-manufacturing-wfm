name: WFM staging browser proof - SECURITY HOLD

# Browser proof is deliberately fail-closed until a reviewed staging endpoint and
# non-public, non-derivable ephemeral authentication mechanism are available.
# Do not install browser tooling or contact a public staging endpoint from this
# workflow while the hold is active.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wfm-staging-browser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-staging-browser-proof-security-hold
  cancel-in-progress: true

jobs:
  contained:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce browser-proof containment
        shell: bash
        run: |
          set -euo pipefail
          echo 'SECURITY_CONTAINMENT_ACTIVE browser_proof=DISABLED reason=public_or_derivable_staging_auth_and_unreviewed_browser_supply_chain' >&2
          echo 'Release requires: reviewed staging endpoint, non-public ephemeral authentication, immutable/pinned tooling, patched browser floor, and explicit staging validation.' >&2
          exit 1
