name: Live sealed runtime provenance proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-sealed-provenance-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live-bytes-and-fail-closed-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WFM_ORIGIN: https://wfm-customer-proof-0676-production.up.railway.app
      EXPECTED_RELEASE: 0.6.76-hosted-staging-rc1
      EXPECTED_RUNTIME_SHA256: 3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d
    steps:
      - name: Checkout immutable proof repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct exact reviewed live composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz | awk '{print $1}')" = "$EXPECTED_RUNTIME_SHA256"
          mkdir -p "$RUNNER_TEMP/wfm-sealed"
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C "$RUNNER_TEMP/wfm-sealed"
          cp "$RUNNER_TEMP/wfm-sealed/public/factory-control-ui.css" "$RUNNER_TEMP/expected-factory-control-ui.css"
          cp "$RUNNER_TEMP/wfm-sealed/public/value-cockpit-ui.js" "$RUNNER_TEMP/expected-value-cockpit-ui.js"
          printf '\n/* WFM_UX_RESET_BASE_BEGIN */\n' >> "$RUNNER_TEMP/expected-factory-control-ui.css"
          cat ux-overlay/ux-reset.css >> "$RUNNER_TEMP/expected-factory-control-ui.css"
          for n in 2 3 4 5 6 7 8 9; do printf '\n/* WFM_UX_RESET_CYCLE%s_BEGIN */\n' "$n" >> "$RUNNER_TEMP/expected-factory-control-ui.css"; cat "ux-overlay/ux-reset-cycle${n}.css" >> "$RUNNER_TEMP/expected-factory-control-ui.css"; done
          printf '\n/* WFM_UX_RESET_BASE_BEGIN */\n' >> "$RUNNER_TEMP/expected-value-cockpit-ui.js"
          cat ux-overlay/ux-reset.js >> "$RUNNER_TEMP/expected-value-cockpit-ui.js"
          for n in 2 3 4 5 6 7 8 9; do printf '\n;/* WFM_UX_RESET_CYCLE%s_BEGIN */\n' "$n" >> "$RUNNER_TEMP/expected-value-cockpit-ui.js"; cat "ux-overlay/ux-reset-cycle${n}.js" >> "$RUNNER_TEMP/expected-value-cockpit-ui.js"; done
          echo "SEALED_RUNTIME_SHA256=$EXPECTED_RUNTIME_SHA256"
          echo "EXPECTED_FACTORY_SHA256=$(sha256sum "$RUNNER_TEMP/expected-factory-control-ui.css" | awk '{print $1}')"
          echo "EXPECTED_COCKPIT_SHA256=$(sha256sum "$RUNNER_TEMP/expected-value-cockpit-ui.js" | awk '{print $1}')"

      - name: Record exact release health and fail-closed unauthenticated boundary
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 "$WFM_ORIGIN/api/health" -o "$RUNNER_TEMP/health.json"
          node - "$RUNNER_TEMP/health.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs');
          const h=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const a=(x,m)=>{if(!x)throw Error(m)};
          a(h.status==='ok','health not ok');
          a(h.release===process.env.EXPECTED_RELEASE,`unexpected release ${h.release}`);
          a(h.fixtureOnly===true,'host is not fixture-only');
          a(h.productionApproved===false,'host unexpectedly production-approved');
          a(h.pilotReady===false,'host unexpectedly pilot-ready');
          console.log(`HEALTH_RELEASE=${h.release}`);
          console.log(`HEALTH_FIXTURE_ONLY=${h.fixtureOnly}`);
          console.log(`HEALTH_PRODUCTION_APPROVED=${h.productionApproved}`);
          console.log(`HEALTH_PILOT_READY=${h.pilotReady}`);
          console.log(`HEALTH_EXTERNAL_NOTIFICATIONS_ENABLED=${h.externalNotificationsEnabled}`);
          console.log(`HEALTH_LIVE_PAYROLL_ENABLED=${h.livePayrollEnabled}`);
          fs.appendFileSync(process.argv[3],`external_notifications=${String(h.externalNotificationsEnabled)}\nlive_payroll=${String(h.livePayrollEnabled)}\n`);
          NODE
          for header in '' 'X-WFM-Tenant: isolation-test' 'X-WFM-Tenant: northstar-demo'; do
            args=(); if [ -n "$header" ]; then args=(-H "$header"); fi
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/unauth.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "${args[@]}" "$WFM_ORIGIN/api/bootstrap")
            test "$status" = '401'
          done
          echo 'UNAUTHENTICATED_BOOTSTRAP_AND_FORGED_TENANT_HEADERS=PASS'

      - name: Prove live static bytes match sealed runtime plus reviewed UX overlay
        shell: bash
        run: |
          set -euo pipefail
          compare() { local route="$1" expected="$2" label="$3"; curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 "$WFM_ORIGIN/$route" -o "$RUNNER_TEMP/live.bin"; local e l; e=$(sha256sum "$expected" | awk '{print $1}'); l=$(sha256sum "$RUNNER_TEMP/live.bin" | awk '{print $1}'); test "$e" = "$l"; echo "${label}_SHA256=$l"; }
          compare 'factory-control-ui.css' "$RUNNER_TEMP/expected-factory-control-ui.css" 'LIVE_FACTORY_CONTROL'
          compare 'value-cockpit-ui.js' "$RUNNER_TEMP/expected-value-cockpit-ui.js" 'LIVE_VALUE_COCKPIT'
          for f in index.html kiosk.html attendance-corrections.js payroll-control.js personal-ui.js schedule-publication.js; do test -f "$RUNNER_TEMP/wfm-sealed/public/$f"; route="$f"; [ "$f" = 'index.html' ] && route=''; compare "$route" "$RUNNER_TEMP/wfm-sealed/public/$f" "LIVE_${f//[^A-Za-z0-9]/_}"; done
          echo 'LIVE_STATIC_PROVENANCE=PASS'

      - name: Prove security headers on public entry
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -D "$RUNNER_TEMP/headers.txt" -o /dev/null "$WFM_ORIGIN/"
          grep -i '^x-content-type-options:[[:space:]]*nosniff' "$RUNNER_TEMP/headers.txt"
          grep -i '^referrer-policy:[[:space:]]*no-referrer' "$RUNNER_TEMP/headers.txt"
          grep -i '^content-security-policy:' "$RUNNER_TEMP/headers.txt"
          if grep -qi '^access-control-allow-origin:[[:space:]]*\*' "$RUNNER_TEMP/headers.txt"; then echo 'Wildcard CORS observed on public entry.' >&2; exit 1; fi
          echo 'PUBLIC_ENTRY_SECURITY_HEADERS=PASS'

      - name: Inspect safety health contract without secrets
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/wfm-sealed/server.cjs" <<'NODE'
          const fs=require('node:fs'); const s=fs.readFileSync(process.argv[2],'utf8');
          for(const needle of ['externalNotificationsEnabled','livePayrollEnabled']){
            const i=s.indexOf(needle); if(i<0){console.log(`${needle}=NOT_FOUND`);continue}
            const snippet=s.slice(Math.max(0,i-700),Math.min(s.length,i+1100)).replace(/([A-Za-z0-9_]*(?:PASSWORD|TOKEN|SECRET|KEY)[A-Za-z0-9_]*\s*[:=]\s*)[^,;\n}]+/gi,'$1[REDACTED]');
            console.log(`SAFETY_CONTRACT_${needle}_BEGIN`); console.log(snippet); console.log(`SAFETY_CONTRACT_${needle}_END`);
          }
          NODE

      - name: Enforce synthetic Test communication and payroll safety boundary
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          if [ '${{ steps.health.outputs.external_notifications }}' != 'false' ]; then echo 'SAFETY_GATE=FAIL externalNotificationsEnabled is not false.' >&2; failed=1; fi
          if [ '${{ steps.health.outputs.live_payroll }}' != 'false' ]; then echo 'SAFETY_GATE=FAIL livePayrollEnabled is not false.' >&2; failed=1; fi
          if [ "$failed" -ne 0 ]; then echo 'No authenticated mutation, invitation, notification or payroll proof is permitted while this safety gate is open.' >&2; exit 1; fi
          echo 'TEST_EXTERNAL_COMMUNICATION_AND_PAYROLL_SAFETY=PASS'
