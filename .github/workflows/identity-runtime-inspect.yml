name: Identity runtime inspect

on:
  push:
    branches: [identity-runtime-guard]
    paths:
      - '.github/workflows/identity-runtime-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect sealed server identity and route contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C "$RUNNER_TEMP/runtime"
          echo '=== FILES ==='
          find "$RUNNER_TEMP/runtime" -maxdepth 3 -type f | sed "s#$RUNNER_TEMP/runtime/##" | sort | head -250
          echo '=== SERVER SECURITY/ROUTE EXCERPTS ==='
          node - "$RUNNER_TEMP/runtime/server.cjs" <<'NODE'
          const fs = require('node:fs');
          const p = process.argv[2];
          const s = fs.readFileSync(p, 'utf8');
          const needles = [
            'createServer', 'authorization', 'cookie', 'session', 'tenant', 'role',
            '/api/', 'login', 'logout', 'health', 'csrf', 'origin', 'password'
          ];
          for (const needle of needles) {
            let from = 0, count = 0;
            while (count < 8) {
              const at = s.toLowerCase().indexOf(needle.toLowerCase(), from);
              if (at < 0) break;
              console.log(`--- ${needle} @ ${at} ---`);
              console.log(s.slice(Math.max(0, at - 900), Math.min(s.length, at + 1800)));
              from = at + needle.length;
              count++;
            }
          }
          NODE
