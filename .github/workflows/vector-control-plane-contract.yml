name: VECTOR Control Plane Contract

on:
  push:
    branches:
      - design/vector-control-plane-20260928
      - hardening/vector-control-plane-proof-contract-20260928
    paths:
      - 'control-plane/**'
      - 'docs/superpowers/specs/2026-09-28-vector-durable-control-plane-design.md'
      - '.github/workflows/vector-control-plane-contract.yml'
  pull_request:
    paths:
      - 'control-plane/**'
      - 'docs/superpowers/specs/2026-09-28-vector-durable-control-plane-design.md'
      - '.github/workflows/vector-control-plane-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-control-plane-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run durable control-plane contract tests
        run: node --test control-plane/test/engine.test.mjs

      - name: Prove checked-out identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'control-plane-sha=%s\n' "${GITHUB_SHA}"
