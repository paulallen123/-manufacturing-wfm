name: WFM provider-derived browser credential safety

on:
  push:
    branches:
      - 'autonomy/**'
      - 'ux/**'
      - main
    paths:
      - '.github/workflows/ux-cycle10-r4-proof.yml'
      - '.github/workflows/reliability-provider-browser-credential-policy.yml'
      - 'scripts/browser-security-floor.mjs'
      - 'scripts/validate-provider-browser-credential-order.mjs'
      - 'resilience/browser-security-floor.json'
      - 'scripts/ux-cycle10-r4-hosted-proof.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-browser-credential-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run deterministic browser floor boundaries
        run: node scripts/browser-security-floor.mjs --self-test
      - name: Prove provider credential retrieval cannot precede browser preflight
        run: node scripts/validate-provider-browser-credential-order.mjs
