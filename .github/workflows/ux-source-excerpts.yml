name: UX source excerpts

on:
  push:
    branches: ['ux/simplified-role-shell']
    paths:
      - '.github/workflows/ux-source-excerpts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract targeted UX source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wfm
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C /tmp/wfm
          echo 'AVAILABILITY_UI_START'
          cat /tmp/wfm/public/availability-ui.js
          echo 'AVAILABILITY_UI_END'
          echo 'APP_STRUCTURE_START'
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('/tmp/wfm/public/app.js','utf8');
          const terms=['data-nav','factory-section','operations-section','resources-section','company-section','section-jump','UIShell','<main','sidebar','workspace'];
          for(const term of terms){
            let from=0,count=0;
            while(count<8){
              const at=s.indexOf(term,from); if(at<0) break;
              console.log(`TERM ${term} AT ${at}`);
              console.log(s.slice(Math.max(0,at-900),Math.min(s.length,at+3200)));
              from=at+term.length; count++;
            }
          }
          NODE
          echo 'APP_STRUCTURE_END'
