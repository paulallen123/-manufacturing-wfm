name: Return-to-work task evidence gate

on:
  pull_request:
    paths:
      - 'operations/runtime/return-to-work-task-evidence.cjs'
      - 'operations/runtime/return-to-work-task-evidence.test.cjs'
      - '.github/workflows/return-to-work-task-evidence-gate.yml'

permissions:
  contents: read

jobs:
  advisory-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test operations/runtime/return-to-work-task-evidence.test.cjs
