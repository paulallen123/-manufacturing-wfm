name: Capability retirement evidence gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925, fix/capability-source-path-admission-20261012]
    paths:
      - 'scripts/validate-capability-superset.mjs'
      - 'scripts/validate-capability-superset.test.mjs'
      - 'scripts/validate-capability-retirement.test.mjs'
      - 'release/retirement-proof-contract.md'
      - '.github/workflows/capability-retirement-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retirement-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify retirement evidence contract
        run: node --test scripts/validate-capability-superset.test.mjs scripts/validate-capability-retirement.test.mjs
      - name: Validate current non-retired manifest
        run: node scripts/validate-capability-superset.mjs
      - name: Build exact customer candidate
        run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-retirement-evidence:gate .
