name: L6 directory OAuth session binding

on:
  pull_request:
    branches:
      - release/vector-customer-ready-candidate-20260925
    paths:
      - integration/runtime/directory-oauth-broker.cjs
      - integration/runtime/directory-oauth-broker.test.cjs
      - .github/workflows/l6-directory-oauth-session-binding.yml

permissions:
  contents: read

jobs:
  targeted:
    if: github.head_ref == 'l6/directory-oauth-session-binding-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Run directory OAuth broker tests
        run: node --test integration/runtime/directory-oauth-broker.test.cjs
