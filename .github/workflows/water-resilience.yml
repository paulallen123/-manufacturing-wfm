name: Water resilience integrity

on:
  pull_request:
    branches:
      - release/vector-customer-ready-candidate-20260925
    paths:
      - 'frontier/water-resilience-orchestration/**'
      - '.github/workflows/water-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  water-policy-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Run water resilience regressions
        run: node --test frontier/water-resilience-orchestration/water-resilience-orchestration.test.mjs
