name: Vector-only UI guard

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ux/**'
    paths:
      - 'ux-overlay/**'
      - 'Dockerfile'
      - 'operations/runtime/vector-intelligence-*.cjs'
      - 'security/runtime/bootstrap.cjs'
      - 'scripts/validate-vector-only-ui.mjs'
      - '.github/workflows/vector-only-ui-guard.yml'
  pull_request:
    paths:
      - 'ux-overlay/**'
      - 'Dockerfile'
      - 'operations/runtime/vector-intelligence-*.cjs'
      - 'security/runtime/bootstrap.cjs'
      - 'scripts/validate-vector-only-ui.mjs'
      - '.github/workflows/vector-only-ui-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Refuse retired UI source
        run: node scripts/validate-vector-only-ui.mjs
      - name: Prove Vector intelligence contract
        run: node --test operations/runtime/vector-intelligence-layer.test.cjs operations/runtime/vector-intelligence-control-plane.test.cjs

  image-build:
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build exact runtime
        run: docker build --pull=false -t wfm-vector-intelligence-diagnostic .

  vector-only:
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Refuse retired UI source
        run: node scripts/validate-vector-only-ui.mjs
      - name: Prove Vector intelligence contract
        run: node --test operations/runtime/vector-intelligence-layer.test.cjs operations/runtime/vector-intelligence-control-plane.test.cjs
      - name: Build exact runtime
        run: docker build --pull=false -t wfm-vector-only .
      - name: Prove Vector is the only active presentation
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-vector-only)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf "$RUNNER_TEMP/public" && mkdir -p "$RUNNER_TEMP/public"
          docker cp "$cid:/app/public/." "$RUNNER_TEMP/public/"
          if grep -RIlE 'WFM_UX_RESET_CYCLE11_BEGIN|WFM_UX_RESET_CYCLE12_BEGIN|VECTOR_PRIORITY_BRIDGE_V1' "$RUNNER_TEMP/public" --include='*.js' --include='*.css' --include='*.html'; then
            echo 'Retired presentation overlay found in built public assets.' >&2
            exit 1
          fi
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/public/vector-shell.js"
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/public/factory-control-ui.css"
          grep -F 'vector-shell.js' "$RUNNER_TEMP/public/index.html"
          grep -F 'body:not(.vector-ui-active) .app>.sidebar:not(.vector-sidebar){visibility:hidden!important}' "$RUNNER_TEMP/public/factory-control-ui.css"
          grep -F '.vector-home-source{display:none!important}' "$RUNNER_TEMP/public/factory-control-ui.css"
          echo 'VECTOR_ONLY_BUILT_ASSET_GUARD=PASS'
