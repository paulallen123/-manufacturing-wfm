name: Vector-only UI guard

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ux/**'
    paths:
      - 'ux-overlay/**'
      - 'implementation/ui/**'
      - 'learning/ui/**'
      - 'operations/runtime/workflow-action-evidence-contract.cjs'
      - 'operations/runtime/workflow-action-evidence-contract.test.cjs'
      - 'artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz'
      - 'Dockerfile'
      - 'scripts/compose-vector-presentation.mjs'
      - 'scripts/compose-vector-presentation.regression.test.mjs'
      - 'scripts/prove-vector-built-asset-provenance.mjs'
      - 'scripts/prove-vector-built-asset-provenance.test.mjs'
      - 'scripts/validate-vector-only-ui.mjs'
      - '.github/workflows/vector-only-ui-guard.yml'
  pull_request:
    paths:
      - 'ux-overlay/**'
      - 'implementation/ui/**'
      - 'learning/ui/**'
      - 'operations/runtime/workflow-action-evidence-contract.cjs'
      - 'operations/runtime/workflow-action-evidence-contract.test.cjs'
      - 'artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz'
      - 'Dockerfile'
      - 'scripts/compose-vector-presentation.mjs'
      - 'scripts/compose-vector-presentation.regression.test.mjs'
      - 'scripts/prove-vector-built-asset-provenance.mjs'
      - 'scripts/prove-vector-built-asset-provenance.test.mjs'
      - 'scripts/validate-vector-only-ui.mjs'
      - '.github/workflows/vector-only-ui-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vector-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind proof to the exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha" || {
            echo "Candidate identity mismatch: expected $expected_sha, got $actual_sha" >&2
            exit 1
          }
          echo "VECTOR_SOURCE_SHA=$actual_sha"
      - name: Prove source-owned action evidence semantics
        run: node --test operations/runtime/workflow-action-evidence-contract.test.cjs ux-overlay/vector-action-queue.test.cjs
      - name: Prove retired presentation purge fails closed
        run: node --test scripts/compose-vector-presentation.regression.test.mjs
      - name: Prove marker spoof cannot satisfy built-asset provenance
        run: node --test scripts/prove-vector-built-asset-provenance.test.mjs
      - name: Refuse retired UI source
        run: node scripts/validate-vector-only-ui.mjs
      - name: Build exact runtime
        run: docker build --pull=false -t wfm-vector-only .
      - name: Prove Vector is the only active presentation
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-vector-only)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf "$RUNNER_TEMP/public" && mkdir -p "$RUNNER_TEMP/public"
          docker cp "$cid:/app/public/." "$RUNNER_TEMP/public/"

          test -f "$RUNNER_TEMP/public/vector-ui.js"
          test -f "$RUNNER_TEMP/public/vector-ui.css"
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/public/vector-ui.js"
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/public/vector-ui.css"
          grep -F '/vector-ui.js' "$RUNNER_TEMP/public/index.html"
          grep -F '/vector-ui.css' "$RUNNER_TEMP/public/index.html"

          retired=(
            vector-shell.js
            review-ui.js
            review-ui.css
            factory-control-ui.js
            factory-control-ui.css
            value-cockpit-ui.js
            value-cockpit-ui.css
            ui-evolution.css
          )
          for asset in "${retired[@]}"; do
            test ! -e "$RUNNER_TEMP/public/$asset" || {
              echo "Retired presentation asset remains active: $asset" >&2
              exit 1
            }
            ! grep -F "$asset" "$RUNNER_TEMP/public/index.html"
          done

          if grep -RIlE 'WFM_UX_RESET_CYCLE11_BEGIN|WFM_UX_RESET_CYCLE12_BEGIN|VECTOR_PRIORITY_BRIDGE_V1' "$RUNNER_TEMP/public" --include='*.js' --include='*.css' --include='*.html'; then
            echo 'Retired presentation overlay found in built public assets.' >&2
            exit 1
          fi

          echo '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d  artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz' | sha256sum -c -
          base_css_member="$(tar -tzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz | grep -E '(^|/)public/factory-control-ui\.css$')"
          test -n "$base_css_member"
          test "$(printf '%s\n' "$base_css_member" | wc -l)" -eq 1
          tar -xOzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz "$base_css_member" > "$RUNNER_TEMP/sealed-factory-control-ui.css"

          node scripts/prove-vector-built-asset-provenance.mjs \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/public" \
            "$RUNNER_TEMP/sealed-factory-control-ui.css"

          echo 'VECTOR_ONLY_BUILT_ASSET_GUARD=PASS'
