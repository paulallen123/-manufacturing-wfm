name: Vector-only UI guard

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ux/**'
    paths:
      - 'ux-overlay/**'
      - 'Dockerfile'
      - 'scripts/validate-vector-only-ui.mjs'
      - 'scripts/validate-built-ui-provenance.mjs'
      - 'scripts/validate-built-ui-provenance.test.mjs'
      - 'scripts/retire-legacy-presentation.mjs'
      - 'artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz'
      - 'DEPLOYMENT_MANIFEST.json'
      - '.github/workflows/vector-only-ui-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vector-only:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse retired UI source
        run: node scripts/validate-vector-only-ui.mjs
      - name: Reject marker-spoofed built assets
        run: node --test scripts/validate-built-ui-provenance.test.mjs
      - name: Build exact runtime
        run: docker build --pull=false -t wfm-vector-only .
      - name: Bind built public assets to validated source
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-vector-only)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf "$RUNNER_TEMP/public" && mkdir -p "$RUNNER_TEMP/public"
          docker cp "$cid:/app/public/." "$RUNNER_TEMP/public/"
          if grep -RIlE 'Payroll review due today|Automated value desk|The system finds the saving\.|ux-signoff-desk|ux11-queue|VECTOR_PRIORITY_BRIDGE_V1' "$RUNNER_TEMP/public" --include='*.js' --include='*.css' --include='*.html'; then
            echo 'Retired UI content found in built public assets.' >&2
            exit 1
          fi
          node scripts/validate-built-ui-provenance.mjs \
            --public "$RUNNER_TEMP/public" \
            --receipt "$RUNNER_TEMP/vector-ui-provenance.json" \
            --source-sha "$GITHUB_SHA" \
            --image-id "$(docker image inspect --format '{{.Id}}' wfm-vector-only)"
          cp "$RUNNER_TEMP/vector-ui-provenance.json" vector-ui-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vector-ui-provenance
          path: vector-ui-provenance.json
          if-no-files-found: ignore
