name: Industrial Semantic Edge shadow proof

on:
  pull_request:
    paths:
      - 'integration/semantic-edge/**'
      - '.github/workflows/industrial-semantic-edge.yml'
  push:
    branches:
      - 'frontier/industrial-semantic-edge-readonly'
    paths:
      - 'integration/semantic-edge/**'
      - '.github/workflows/industrial-semantic-edge.yml'

permissions:
  contents: read

jobs:
  synthetic-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Read-only synthetic PubSub fixture and replay gate
        run: node --test integration/semantic-edge/industrial-signal-envelope.test.cjs
