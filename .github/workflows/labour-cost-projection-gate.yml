name: Labour cost projection gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'operations/runtime/labour-cost-projection.cjs'
      - 'operations/runtime/labour-cost-projection.test.cjs'
      - 'operations/runtime/manufacturing-demand-forecast.cjs'
      - 'operations/runtime/manufacturing-demand-forecast.test.cjs'
      - 'operations/runtime/payroll-money.cjs'
      - 'scripts/patch-payroll-money.test.mjs'
      - '.github/workflows/labour-cost-projection-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-advisory-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify projection and its source engines
        run: node --test operations/runtime/labour-cost-projection.test.cjs operations/runtime/manufacturing-demand-forecast.test.cjs scripts/patch-payroll-money.test.mjs
