name: External risk gate

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'DEPLOYMENT_MANIFEST.json'
      - 'artifact/**'
      - 'security/external-risk/**'
      - 'scripts/external-risk-*.mjs'
      - '.github/workflows/external-risk-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-risk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  undici-websocket-containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify CVE-2026-85024 containment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/external-risk-undici-websocket-gate.mjs
