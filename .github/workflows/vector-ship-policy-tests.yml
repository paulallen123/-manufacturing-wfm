name: VECTOR Ship control module

on:
  push:
    branches:
      - main
      - 'automation/vector-ship-*'
    paths:
      - 'automation/vector-ship/**'
      - '.github/workflows/vector-ship-policy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-ship-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    if: github.repository == 'paulallen123/-manufacturing-wfm' && github.actor == 'paulallen123'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.22.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Test control module
        run: node --test automation/vector-ship/decision.test.mjs

  policy-result:
    name: VECTOR Ship policy tests
    if: always()
    needs: [policy-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.policy-tests.result }}
        run: |
          if [ "$MATRIX_RESULT" != 'success' ]; then
            echo 'Control module matrix did not succeed.' >&2
            exit 1
          fi
          echo 'Control module tests passed. This is not a product release check.'
