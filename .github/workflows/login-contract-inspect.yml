name: Inspect sealed hosted login validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-contract-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout sealed proof repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Inspect sealed server login contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-runtime"
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C "$RUNNER_TEMP/sealed-runtime"
          SERVER="$RUNNER_TEMP/sealed-runtime/server.cjs"
          test -f "$SERVER"
          node - "$SERVER" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const needles = ['/api/login','WFM_STAGING_PASSWORD','timingSafeEqual','superuser@northstar.example'];
          for (const needle of needles) {
            let at = source.indexOf(needle);
            if (at < 0) continue;
            console.log(`SEALED_LOGIN_NEEDLE=${needle}`);
            console.log('SEALED_LOGIN_SNIPPET_START');
            console.log(source.slice(Math.max(0, at - 1800), Math.min(source.length, at + 3200)));
            console.log('SEALED_LOGIN_SNIPPET_END');
          }
          NODE
