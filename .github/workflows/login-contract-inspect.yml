name: Inspect sealed tenant and kiosk proof contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-contract-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout sealed proof repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Inspect tenant and kiosk contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-runtime"
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C "$RUNNER_TEMP/sealed-runtime"
          SERVER="$RUNNER_TEMP/sealed-runtime/server.cjs"
          test -f "$SERVER"
          node - "$SERVER" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const routeMatches = [...source.matchAll(/['"](\/api\/[^'"]+)['"]/g)].map(m => m[1]);
          const interesting = [...new Set(routeMatches.filter(r => /bootstrap|kiosk|attendance|correction|audit|time-review/i.test(r)))];
          console.log('INTERESTING_ROUTES=' + JSON.stringify(interesting));
          for (const needle of ['/api/bootstrap','/api/kiosk','attendance-corrections','kiosk_devices','kiosk_events']) {
            let start = 0, count = 0;
            while (count < 4) {
              const at = source.indexOf(needle, start);
              if (at < 0) break;
              console.log(`CONTRACT_NEEDLE=${needle}#${count+1}`);
              console.log('CONTRACT_SNIPPET_START');
              console.log(source.slice(Math.max(0, at - 1400), Math.min(source.length, at + 2800)));
              console.log('CONTRACT_SNIPPET_END');
              start = at + needle.length;
              count++;
            }
          }
          NODE
