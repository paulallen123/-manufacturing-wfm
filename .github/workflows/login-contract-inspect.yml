name: Inspect sealed correction validation contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-contract-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout sealed proof repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Inspect correction validation contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-runtime"
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C "$RUNNER_TEMP/sealed-runtime"
          CORR="$RUNNER_TEMP/sealed-runtime/public/attendance-corrections.js"
          ENGINE="$RUNNER_TEMP/sealed-runtime/lib/engine.js"
          test -f "$CORR"
          test -f "$ENGINE"
          node - "$CORR" "$ENGINE" <<'NODE'
          const fs = require('node:fs');
          const corr = fs.readFileSync(process.argv[2], 'utf8');
          const engine = fs.readFileSync(process.argv[3], 'utf8');
          for (const [name, source, needles] of [
            ['CORRECTION', corr, ['function note','function submit','resolveLondon(x.clockIn)']],
            ['ENGINE', engine, ['function resolveLondon','resolveLondon=','resolveLondon:']]
          ]) {
            for (const needle of needles) {
              const at = source.indexOf(needle);
              if (at < 0) continue;
              console.log(`${name}_NEEDLE=${needle}`);
              console.log(source.slice(Math.max(0, at - 1400), Math.min(source.length, at + 4200)));
            }
          }
          NODE
