name: Inspect sealed attendance correction contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-contract-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout sealed proof repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Inspect correction engine contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-runtime"
          tar -xzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz -C "$RUNNER_TEMP/sealed-runtime"
          TARGET="$RUNNER_TEMP/sealed-runtime/public/attendance-corrections.js"
          test -f "$TARGET"
          node - "$TARGET" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          console.log('MODULE_BYTES=' + Buffer.byteLength(source));
          for (const needle of ['function dashboard','function authorise','function dispatch','correction-submit','correction-review','correction-respond','correction-propose','correction-decide','module.exports']) {
            let start = 0, count = 0;
            while (count < 4) {
              const at = source.indexOf(needle, start);
              if (at < 0) break;
              console.log(`CORRECTION_NEEDLE=${needle}#${count+1}`);
              console.log('CORRECTION_SNIPPET_START');
              console.log(source.slice(Math.max(0, at - 1200), Math.min(source.length, at + 3600)));
              console.log('CORRECTION_SNIPPET_END');
              start = at + needle.length;
              count++;
            }
          }
          NODE
