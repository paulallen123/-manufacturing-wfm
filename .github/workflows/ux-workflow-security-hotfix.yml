name: Normalize merged UX workflow security

on:
  push:
    branches:
      - 'autonomy/ux-workflow-security-hotfix'
    paths:
      - '.github/workflows/ux-*.yml'
      - '.github/workflows/ux-workflow-security-hotfix.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: ux-workflow-security-hotfix
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout bounded hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Pin actions and remove untrusted PR triggers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          files = sorted(p for p in root.glob('ux-*.yml') if p.name != 'ux-workflow-security-hotfix.yml')
          if not files:
              raise SystemExit('No UX workflows found')

          trigger_old = "on:\n  pull_request:\n    paths:"
          trigger_new = "on:\n  push:\n    branches:\n      - main\n      - 'ux/**'\n      - 'autonomy/**'\n    paths:"
          pins = {
              'actions/checkout@v4': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
          }

          changed = []
          for p in files:
              text = p.read_text()
              original = text
              text = text.replace(trigger_old, trigger_new)
              for old, new in pins.items():
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text)
                  changed.append(str(p))

          bad = []
          for p in files:
              text = p.read_text()
              if re.search(r'^\s*(pull_request_target|pull_request|workflow_run|issue_comment):', text, re.M):
                  bad.append(f'{p}: untrusted trigger remains')
              for m in re.finditer(r'^\s*uses:\s+([^#\s]+)', text, re.M):
                  ref = m.group(1)
                  if ref.startswith('./'):
                      continue
                  if not re.search(r'@[0-9a-fA-F]{40}$', ref):
                      bad.append(f'{p}: mutable action {ref}')
          if bad:
              raise SystemExit('\n'.join(bad))

          print('UX_WORKFLOW_SECURITY_NORMALIZED=' + str(len(changed)))
          for p in changed:
              print(p)
          PY

          if git diff --quiet -- .github/workflows/ux-*.yml; then
            echo 'No normalization changes needed.'
            exit 0
          fi

          git config user.name 'wfm-security-hotfix'
          git config user.email 'wfm-security-hotfix@users.noreply.github.com'
          git add .github/workflows/ux-*.yml
          git commit -m 'security: pin and trust-bound UX workflows'
          git push origin HEAD:autonomy/ux-workflow-security-hotfix
