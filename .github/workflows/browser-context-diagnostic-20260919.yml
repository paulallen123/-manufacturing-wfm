name: Browser context diagnostic - bounded transport

on:
  push:
    branches:
      - 'evidence/browser-context-diagnostic-20260919'
    paths:
      - '.github/workflows/browser-context-diagnostic-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-context-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact candidate ancestry and static contracts
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c165f2137e554af3bd3acb1b50b2802664ded2cd HEAD
          node --check .github/scripts/ux-cycle11-context-browser.mjs
          node .github/scripts/ux-cycle12-signal-contract.mjs
          echo 'EXACT_CANDIDATE_ANCESTRY=PASS'
      - name: Run unchanged browser assertions with bounded diagnostic transport
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/ux-cycle11-context-browser.mjs "$RUNNER_TEMP/ux-cycle11-context-browser-diagnostic.mjs"
          python3 - "$RUNNER_TEMP/ux-cycle11-context-browser-diagnostic.mjs" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          replacements=[
          ("""  await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=()=>reject(new Error('CDP open failed'));});\n""",
           """  await Promise.race([new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=()=>reject(new Error('CDP open failed'));}),sleep(3000).then(()=>{throw new Error('CDP open timeout')})]);\n  console.log('CDP_OPEN=PASS');\n"""),
          ("""  const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});\n""",
           """  const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;const timer=setTimeout(()=>{pending.delete(n);reject(new Error('CDP command timeout: '+method));},3000);pending.set(n,{resolve:v=>{clearTimeout(timer);resolve(v);},reject:e=>{clearTimeout(timer);reject(e);}});ws.send(JSON.stringify({id:n,method,params}));});\n"""),
          ("""} finally {\n  try { ws?.close(); } catch {}\n  try { chrome.kill('SIGTERM'); } catch {}\n  await new Promise(resolve=>server.close(resolve));\n  rmSync(temp,{recursive:true,force:true});\n}\n""",
           """} finally {\n  try { ws?.close(); } catch {}\n  try { chrome.kill('SIGTERM'); } catch {}\n  try { server.closeIdleConnections?.(); } catch {}\n  try { server.closeAllConnections?.(); } catch {}\n  await Promise.race([new Promise(resolve=>server.close(()=>resolve())), sleep(1500)]);\n  try { chrome.kill('SIGKILL'); } catch {}\n  try { rmSync(temp,{recursive:true,force:true}); } catch (e) { console.error('DIAGNOSTIC_CLEANUP_WARNING='+e.code); }\n}\n""")]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('diagnostic contract not found; refusing rewrite')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check "$RUNNER_TEMP/ux-cycle11-context-browser-diagnostic.mjs"
          timeout 90s node "$RUNNER_TEMP/ux-cycle11-context-browser-diagnostic.mjs"
          echo 'BROWSER_CONTEXT_DIAGNOSTIC=PASS'
