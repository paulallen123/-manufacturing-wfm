name: Support self-help catalogue ownership
on:
  push:
    branches: ['backlog/support-selfhelp-ownership-20261013']
permissions:
  contents: read
concurrency:
  group: support-selfhelp-ownership-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-regression:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Bind exact source and supported runtime
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = "v22.23.2"
          git hash-object resilience/support-selfhelp.cjs resilience/support-selfhelp.test.cjs
      - name: Exercise support knowledge ownership and existing contract
        run: |
          node --test resilience/support-selfhelp.test.cjs
          node scripts/validate-support-selfhelp.mjs
