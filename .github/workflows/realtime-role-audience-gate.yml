name: Realtime role audience gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'operations/runtime/realtime-event-service.cjs'
      - 'operations/runtime/realtime-event-service.test.cjs'
      - '.github/workflows/realtime-role-audience-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-realtime-role-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test operations/runtime/realtime-event-service.test.cjs
      - run: node --check operations/runtime/realtime-event-service.cjs
      - run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-realtime-role-audience:gate .
