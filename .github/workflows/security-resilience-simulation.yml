name: Security resilience simulation contract

on:
  push:
    branches:
      - security/last-line-defense
    paths:
      - 'security/adversary-simulation/**'
      - '.github/workflows/security-resilience-simulation.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 / Node 24
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate bounded resilience scenarios
        run: node security/adversary-simulation/validate-resilience-scenarios.mjs
