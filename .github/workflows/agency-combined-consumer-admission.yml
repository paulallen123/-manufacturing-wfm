name: Agency combined consumer admission

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'test/frontier/agency-work-start-combined-consumer.test.mjs'
      - 'scripts/prepare-agency-consumer-fixture.py'
      - '.github/workflows/agency-combined-consumer-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-agency-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - id: prepare
        name: Prepare isolated immutable source union
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-agency-consumer-fixture.py
      - name: Verify existing paired source suites
        env:
          FIXTURE: ${{ steps.prepare.outputs.fixture }}
        run: node --test "$FIXTURE/test/frontier/agency-identity-continuity.test.mjs" "$FIXTURE/test/frontier/agency-work-start-readiness.test.mjs"
      - name: Admit real combined consumer contract
        env:
          FIXTURE: ${{ steps.prepare.outputs.fixture }}
        run: node --test "$FIXTURE/test/frontier/agency-work-start-combined-consumer.test.mjs"
