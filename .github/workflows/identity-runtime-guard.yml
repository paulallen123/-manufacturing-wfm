name: Identity Runtime Guard

on:
  push:
    branches:
      - main
      - identity-runtime-guard
      - 'autonomy/**'

permissions:
  contents: read

concurrency:
  group: identity-runtime-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-resource-side-identity-survival:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Validate deployment and resilience metadata
        run: |
          set -euo pipefail
          node scripts/validate-deployment.mjs
          node scripts/validate-resilience-scenarios.mjs

      - name: Enforce proof integrity contract
        run: node --test scripts/proof-integrity-contract.test.mjs

      - name: Prove guard source uses only reviewed local or Node built-in modules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const Module = require('node:module');
          const builtins = new Set(Module.builtinModules.flatMap(x => [x, `node:${x}`]));
          // node:sqlite is an experimental built-in in Node 22 and is not returned by
          // Module.builtinModules on this runtime, so review and allow that exact specifier.
          builtins.add('node:sqlite');
          const files = [
            'security/runtime/identity-survival-guard.cjs',
            'security/runtime/bootstrap.cjs'
          ];
          const external = [];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            for (const re of [/require\(['"]([^'"]+)['"]\)/g, /from\s+['"]([^'"]+)['"]/g]) {
              let match;
              while ((match = re.exec(source))) {
                const spec = match[1];
                const reviewedAbsolute = file.endsWith('bootstrap.cjs') && spec === '/app/server.cjs';
                if (spec.startsWith('.') || builtins.has(spec) || reviewedAbsolute) continue;
                external.push({ file, spec });
              }
            }
          }
          assert.deepEqual(external, [], 'Identity guard introduced an unreviewed external runtime module.');
          NODE

      - name: Run identity survival unit and isolation tests
        run: node --test security/runtime/identity-survival-guard.test.cjs

      - name: Build exact guarded staging image
        run: docker build --pull=false -t wfm-identity-guard:${{ github.sha }} .

      - name: Prove non-root immutable guarded runtime
        shell: bash
        run: |
          set -euo pipefail
          image="wfm-identity-guard:${GITHUB_SHA}"
          test "$(docker inspect --format '{{json .Config.Entrypoint}}' "$image")" = '["/usr/local/bin/vector-entrypoint.sh"]'
          test "$(docker run --rm "$image" id -u)" != '0'
          test "$(docker inspect --format '{{json .Config.Cmd}}' "$image")" = '["node","security-runtime/bootstrap.cjs"]'
          test "$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image" | grep '^WFM_IDENTITY_SURVIVAL_GUARD=' )" = 'WFM_IDENTITY_SURVIVAL_GUARD=enforce'

          docker run --rm "$image" sh -ec '
            test ! -w /app/server.cjs
            test ! -w /app/security-runtime/bootstrap.cjs
            test ! -w /app/security-runtime/identity-survival-guard.cjs
            test ! -e /usr/local/lib/node_modules/npm
            test ! -e /usr/local/lib/node_modules/corepack
            for p in npm npx corepack yarn yarnpkg pnpm pnpx; do
              if command -v "$p" >/dev/null 2>&1; then
                echo "Unexpected package manager in final runtime: $p" >&2
                exit 1
              fi
            done
          '

          docker run --rm "$image" node -e "require('/app/security-runtime/identity-survival-guard.cjs'); console.log('identity-guard-load=PASS')"

      - name: Exercise guard on the real staged HTTP request path
        shell: bash
        run: |
          set -euo pipefail
          image="wfm-identity-guard:${GITHUB_SHA}"
          password='Identity-Guard-CI-Only-2026-Long!'
          cid="$(docker run -d --rm \
            -p 127.0.0.1:38117:3000 \
            -e PORT=3000 \
            -e WFM_HOSTED_STAGING=true \
            -e WFM_PUBLIC_ORIGIN=https://staging.identity.test \
            -e WFM_STAGING_PASSWORD="$password" \
            -e WFM_DB=/tmp/wfm-ci.sqlite \
            "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          deadline=$((SECONDS+60))
          while :; do
            code="$(curl -sS --max-time 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:38117/api/health 2>/dev/null || true)"
            if [ "$code" = '200' ]; then
              echo 'health=PASS'
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Guarded staging server did not become healthy before deadline; last_http=$code" >&2
              cat /tmp/health.json 2>/dev/null || true
              docker inspect "$cid" >&2 || true
              docker logs "$cid" >&2 || true
              exit 1
            fi
          done

          login_code="$(curl -sS -D /tmp/login.headers -o /tmp/login.body -w '%{http_code}' \
            -H 'Host: staging.identity.test' \
            -H 'X-Forwarded-Proto: https' \
            -H 'Origin: https://staging.identity.test' \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"manager@northstar.example\",\"password\":\"$password\"}" \
            http://127.0.0.1:38117/api/login)"
          if [ "$login_code" != '200' ]; then
            echo "login failed with HTTP $login_code" >&2
            cat /tmp/login.body >&2 || true
            docker logs "$cid" >&2 || true
            exit 1
          fi
          cookie="$(awk 'BEGIN{IGNORECASE=1} /^set-cookie:/ {gsub("\\r",""); print $2; exit}' /tmp/login.headers | cut -d';' -f1)"
          test -n "$cookie"
          echo 'login=PASS'

          bound_code="$(curl -sS -o /tmp/bound.body -w '%{http_code}' \
            -H 'Host: staging.identity.test' -H 'X-Forwarded-Proto: https' \
            -H "Cookie: $cookie" http://127.0.0.1:38117/api/health)"
          test "$bound_code" = '200'
          echo 'resource-binding=PASS'

          inject_code="$(curl -sS -o /tmp/inject.body -w '%{http_code}' \
            -H 'Host: staging.identity.test' -H 'X-Forwarded-Proto: https' \
            -H "Cookie: $cookie" -H 'X-WFM-Tenant: isolation-test' \
            http://127.0.0.1:38117/api/health)"
          test "$inject_code" = '400'
          echo 'identity-header-injection-block=PASS'

          tenant="$(docker exec "$cid" node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('/tmp/wfm-ci.sqlite');const r=d.prepare('SELECT tenant FROM users WHERE email=?').get('manager@northstar.example');if(!r)process.exit(2);process.stdout.write(r.tenant);d.close();")"
          test -n "$tenant"

          docker exec -e TARGET_TENANT="$tenant" "$cid" node -e "const {createIdentitySurvivalGuard}=require('/app/security-runtime/identity-survival-guard.cjs');const g=createIdentitySurvivalGuard({dbPath:'/tmp/wfm-ci.sqlite'});const c=g.securityControlForTests();c.bumpEpoch(process.env.TARGET_TENANT);c.db.close();"

          stale_code="$(curl -sS -o /tmp/stale.body -w '%{http_code}' \
            -H 'Host: staging.identity.test' -H 'X-Forwarded-Proto: https' \
            -H "Cookie: $cookie" http://127.0.0.1:38117/api/health)"
          test "$stale_code" = '401'

          event_count="$(docker exec "$cid" node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('/tmp/wfm-ci.sqlite');const r=d.prepare(\"SELECT count(*) c FROM identity_guard_events WHERE event='session-binding-mismatch-contained'\").get();process.stdout.write(String(r.c));d.close();")"
          test "$event_count" -ge 1
          echo 'tenant-epoch-containment=PASS'
          echo 'real-staged-identity-survival=PASS'
