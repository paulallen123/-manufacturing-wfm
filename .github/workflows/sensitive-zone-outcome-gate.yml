name: Sensitive-zone outcome scope gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'frontier/controlled-environment-flow/intervention-transition-ledger.mjs'
      - 'frontier/controlled-environment-flow/intervention-transition-ledger.test.mjs'
      - '.github/workflows/sensitive-zone-outcome-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-outcome-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test frontier/controlled-environment-flow/intervention-transition-ledger.test.mjs
      - run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-sensitive-zone-scope:gate .
