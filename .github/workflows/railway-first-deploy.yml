name: Railway isolated proof persistence repair

on:
  push:
    branches:
      - 'autonomy/proof-persistence-repair-20260925'

permissions:
  contents: read

concurrency:
  group: vector-proof-persistence-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: 'f547b91f-7181-47dd-9b46-9ca1067ceaa1'
      RAILWAY_ENVIRONMENT_ID: 'a249b4e0-2467-4c2b-ae73-a1d052d80013'
      RAILWAY_SERVICE_ID: '15646a58-4f44-4222-a9da-945901470a99'
      TARGET_MOUNT_PATH: '/data'
      TARGET_DB_PATH: '/data/wfm.sqlite'
      TARGET_ORIGIN: 'https://vector-proof-target-production.up.railway.app'

    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN="$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)"
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"
          "$CLI_BIN" --version

      - name: Repair isolated proof target durable storage
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN is not configured.' >&2; exit 1; }

          before="$("$RAILWAY_BIN" volume list             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --service "$RAILWAY_SERVICE_ID"             --json)"
          printf '%s\n' "$before"

          if printf '%s' "$before" | jq -e '.. | objects | select(.mountPath? == env.TARGET_MOUNT_PATH)' >/dev/null; then
            echo 'VECTOR_PROOF_VOLUME=EXISTS'
          else
            "$RAILWAY_BIN" volume add               --project "$RAILWAY_PROJECT_ID"               --environment "$RAILWAY_ENVIRONMENT_ID"               --service "$RAILWAY_SERVICE_ID"               --mount-path "$TARGET_MOUNT_PATH"               --json
            echo 'VECTOR_PROOF_VOLUME=CREATED'
          fi

          "$RAILWAY_BIN" variables             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --service "$RAILWAY_SERVICE_ID"             --set "WFM_DB=$TARGET_DB_PATH"             --set "WFM_REQUIRE_DURABLE_STATE=true"

          "$RAILWAY_BIN" redeploy             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --service "$RAILWAY_SERVICE_ID"             --yes

          healthy=false
          for attempt in $(seq 1 72); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$TARGET_ORIGIN/api/health" || true)"
            if [ "$code" = '200' ]; then
              cat "$RUNNER_TEMP/health.json"
              healthy=true
              break
            fi
            sleep 5
          done
          [ "$healthy" = true ] || { echo 'Durability-required target did not become healthy.' >&2; exit 1; }

          after="$("$RAILWAY_BIN" volume list             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --service "$RAILWAY_SERVICE_ID"             --json)"
          printf '%s\n' "$after"
          printf '%s' "$after" | jq -e '.. | objects | select(.mountPath? == env.TARGET_MOUNT_PATH)' >/dev/null
          echo 'VECTOR_PROOF_DURABLE_STORAGE_REPAIR=PASS'
