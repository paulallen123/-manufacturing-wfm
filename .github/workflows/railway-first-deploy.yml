name: Railway customer-proof access - contained

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce temporary credential containment
        shell: bash
        run: |
          set -euo pipefail
          echo 'RAILWAY_CUSTOMER_PROOF_ACCESS=CONTAINED'
          echo 'Reason: release branches are not yet protected by server-side rules and verified-commit enforcement.'
          echo 'No Railway credential is exposed by this workflow while the hold is active.'
          exit 1
