name: Railway deploy - concept fidelity preview

on:
  push:
    branches: ['ux/concept-fidelity-rebuild']
    paths:
      - '.github/workflows/railway-first-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-concept-fidelity-preview-v1
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      RAILWAY_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      RAILWAY_SERVICE_ID: '3bea5411-cebb-4878-adcc-766f5fd58cc7'
      PREVIEW_ORIGIN: 'https://wfm-concept-fidelity-preview-production.up.railway.app'
      EXPECTED_RUNTIME_SHA256: '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d'
    steps:
      - name: Checkout exact concept branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Re-verify staging runtime and concept markers
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_RUNTIME_SHA256  artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz" | sha256sum -c -
          grep -F '"production_approved": false' DEPLOYMENT_MANIFEST.json
          grep -F '"pilot_ready": false' DEPLOYMENT_MANIFEST.json
          grep -F 'WFM_CONCEPT_FIDELITY_V3' ux-overlay/concept-fidelity.js
          node --check ux-overlay/concept-fidelity.js
          node --check security/runtime/ux-preference.cjs

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN=$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"
          "$CLI_BIN" --version

      - name: Upload exact concept source to isolated preview
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN repository secret is not configured.' >&2; exit 1; }
          "$RAILWAY_BIN" up             --service "$RAILWAY_SERVICE_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --detach

      - name: Prove hosted concept bundle
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$PREVIEW_ORIGIN/api/health" -o /tmp/concept-health.json; then break; fi
            sleep 2
          done
          test -s /tmp/concept-health.json
          cat /tmp/concept-health.json
          curl -fsS "$PREVIEW_ORIGIN/value-cockpit-ui.js" -o /tmp/concept-ui.js
          curl -fsS "$PREVIEW_ORIGIN/factory-control-ui.css" -o /tmp/concept-ui.css
          grep -F 'WFM_CONCEPT_FIDELITY_V3' /tmp/concept-ui.js
          grep -F 'WFM_CONCEPT_FIDELITY_BEGIN' /tmp/concept-ui.js
          grep -F 'ux-approved-today' /tmp/concept-ui.css
          echo 'HOSTED_CONCEPT_FIDELITY_PREVIEW=PASS'
