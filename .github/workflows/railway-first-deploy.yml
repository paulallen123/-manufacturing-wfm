name: Railway first deploy - UX PR37 proof

on:
  push:
    branches: [ux/role-first-simplification-20260917-v2]
    paths:
      - '.github/workflows/railway-first-deploy.yml'
      - 'Dockerfile'
      - 'ux-overlay/**'
      - 'artifact/ux-pr37-railway.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-first-deploy-wfm-ux-pr37
  cancel-in-progress: true

jobs:
  first-deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      RAILWAY_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      RAILWAY_SERVICE_ID: '575de460-60f5-4221-9e2f-d912379c8d7d'
      UX_ORIGIN: 'https://wfm-ux-pr37-production.up.railway.app'
      EXPECTED_RUNTIME_SHA256: '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d'
    steps:
      - name: Checkout isolated UX proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Re-verify sealed runtime and UX composition inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_RUNTIME_SHA256  artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz" | sha256sum -c -
          grep -F '"production_approved": false' DEPLOYMENT_MANIFEST.json
          grep -F '"pilot_ready": false' DEPLOYMENT_MANIFEST.json
          grep -F '"staging_only": true' DEPLOYMENT_MANIFEST.json
          test -f ux-overlay/ux-reset.css
          test -f ux-overlay/ux-reset.js
          test -f ux-overlay/ux-reset-cycle9.css
          test -f ux-overlay/ux-reset-cycle9.js
          grep -F 'WFM_UX_RESET_CYCLE9_BEGIN' Dockerfile

      - name: Install pinned Railway CLI with published digest verification
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN=$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"
          "$CLI_BIN" --version

      # Reviewed credential boundary: the Railway project token is available only here.
      # Target IDs are fixed to the isolated UX proof service; no customer/staging service is targeted.
      - name: Bootstrap exact existing Railway UX proof service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN repository secret is not configured.' >&2; exit 1; }
          "$RAILWAY_BIN" up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID"

      - name: Prove hosted UX overlay is live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$UX_ORIGIN/api/health" -o "$RUNNER_TEMP/ux-health.json"; then
              break
            fi
            sleep 4
          done
          test -s "$RUNNER_TEMP/ux-health.json"
          node --input-type=module - "$RUNNER_TEMP/ux-health.json" <<'NODE'
          import fs from 'node:fs';
          const h = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (h.release !== '0.6.76-hosted-staging-rc1') throw new Error(`Unexpected release ${h.release}`);
          if (h.fixtureOnly !== true || h.productionApproved !== false || h.pilotReady !== false) {
            throw new Error('Hosted UX proof escaped the staging claim boundary.');
          }
          NODE
          curl --fail --silent --show-error "$UX_ORIGIN/factory-control-ui.css" -o "$RUNNER_TEMP/factory-control-ui.css"
          curl --fail --silent --show-error "$UX_ORIGIN/value-cockpit-ui.js" -o "$RUNNER_TEMP/value-cockpit-ui.js"
          grep -F 'WFM_UX_RESET_CYCLE9_BEGIN' "$RUNNER_TEMP/factory-control-ui.css"
          grep -F 'WFM_UX_RESET_CYCLE9_BEGIN' "$RUNNER_TEMP/value-cockpit-ui.js"
          echo 'LIVE_UX_PR37_BOOTSTRAP=PASS'
