name: WFM OneDrive resilience

# Private staging repository: only owner-originated pushes execute code.
on:
  push:
    branches:
      - main
      - 'autonomy/**'
    paths:
      - 'scripts/onedrive-sync-guardian.mjs'
      - 'scripts/validate-onedrive-sync-guardian.mjs'
      - 'resilience/onedrive-sync-policy.json'
      - '.github/workflows/wfm-onedrive-resilience.yml'

permissions:
  contents: read

concurrency:
  group: wfm-onedrive-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Validate OneDrive Sync Guardian failure handling
        run: node scripts/validate-onedrive-sync-guardian.mjs
