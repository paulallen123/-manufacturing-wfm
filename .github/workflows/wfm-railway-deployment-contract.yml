name: WFM Railway deployment contract

on:
  push:
    branches:
      - main
      - 'autonomy/**'
      - 'ux/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-railway-deployment-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Reproduce Railway admission failures deterministically
        run: |
          set -euo pipefail
          node scripts/validate-railway-proof-env.mjs --self-test
          node scripts/validate-railway-deploy-workflows.mjs --self-test

      - name: Reject unsafe direct Railway deployment workflows
        run: |
          set -euo pipefail
          node scripts/validate-railway-deploy-workflows.mjs
