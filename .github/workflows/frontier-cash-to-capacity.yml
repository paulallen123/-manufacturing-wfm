name: Frontier Cash to Capacity

on:
  push:
    branches:
      - 'frontier/cash-to-capacity-vector-v1'
    paths:
      - 'src/frontier/cash-to-capacity-*.mjs'
      - 'test/frontier/cash-to-capacity-*.test.mjs'
      - 'frontier-prototypes/cash-to-capacity-vector/**'
      - '.github/workflows/frontier-cash-to-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cash-to-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Run deterministic frontier tests
        run: node --test test/frontier/cash-to-capacity-*.test.mjs
