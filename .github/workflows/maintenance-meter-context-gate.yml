name: Maintenance meter context gate

on:
  pull_request:
    paths:
      - 'operations/runtime/maintenance-meter-context.cjs'
      - 'operations/runtime/maintenance-meter-context.test.cjs'
      - '.github/workflows/maintenance-meter-context-gate.yml'

permissions:
  contents: read

jobs:
  meter-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify scoped meter context
        run: node --test operations/runtime/maintenance-meter-context.test.cjs
