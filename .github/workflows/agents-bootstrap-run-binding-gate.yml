name: Agents bootstrap run binding gate

on:
  pull_request:
    paths:
      - 'implementation/runtime/agents-api-bootstrap-route.cjs'
      - 'implementation/runtime/agents-api-bootstrap-route.test.cjs'
      - 'implementation/runtime/agents-api-adapter.cjs'
      - 'implementation/runtime/agents-api-adapter.test.cjs'
      - '.github/workflows/agents-bootstrap-run-binding-gate.yml'

permissions:
  contents: read

jobs:
  exact-run-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify route and persisted session contract
        run: node --test implementation/runtime/agents-api-bootstrap-route.test.cjs implementation/runtime/agents-api-adapter.test.cjs
