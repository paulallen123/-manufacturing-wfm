name: WFM UX runtime structure inspect

on:
  pull_request:
    paths:
      - '.github/workflows/ux-runtime-inspect.yml'
      - 'Dockerfile'
      - 'ux-overlay/**'

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build composed image
        run: docker build --pull=false -t wfm-ux-inspect:pr .
      - name: Inspect weekly-review runtime structure
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-ux-inspect:pr)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/wfm-public && mkdir -p /tmp/wfm-public
          docker cp "$cid:/app/public/." /tmp/wfm-public/
          echo '=== REVIEW UI EXACT CORE ==='
          sed -n '24,36p' /tmp/wfm-public/review-ui.js || true
          echo '=== REVIEW CSS STRUCTURE ==='
          grep -n -E 'review-(hero|grid|main|aside|metrics|categories|issues|signbar|checklist|issue|filters)' /tmp/wfm-public/review-ui.css | head -n 220 || true
          echo '=== WEEKLY REVIEW MATCHES ==='
          grep -Rni -C 1 --include='*.js' -E "weekly-review|Weekly review|sign.?off" /tmp/wfm-public/review-ui.js /tmp/wfm-public/time-review-ui.js | head -n 260 || true
