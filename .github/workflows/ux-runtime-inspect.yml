name: WFM UX runtime structure inspect

on:
  pull_request:
    paths:
      - '.github/workflows/ux-runtime-inspect.yml'
      - 'Dockerfile'
      - 'ux-overlay/**'

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build composed image
        run: docker build --pull=false -t wfm-ux-inspect:pr .
      - name: Inspect manager performance runtime structure
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-ux-inspect:pr)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/wfm-public && mkdir -p /tmp/wfm-public
          docker cp "$cid:/app/public/." /tmp/wfm-public/
          docker cp "$cid:/app/server.cjs" /tmp/wfm-server.cjs
          {
            echo '=== APPROVED PAGE ASSET ORDER ==='
            grep -oE '<(script|link)[^>]+(src|href)="[^"]+"[^>]*>' /tmp/wfm-public/index.html || true
            echo '=== PERFORMANCE / COST / SAVINGS HOOKS ==='
            grep -RIn -E "savings-decisions|value-cockpit|labou?r cost|productivity|saving|opportunity|decision|efficiency|overtime|agency|variance" /tmp/wfm-public --include='*.js' | head -n 700 || true
            echo '=== PERFORMANCE CSS HOOKS ==='
            grep -RIn -E "savings|value-cockpit|performance|decision|opportunity|efficiency|cost" /tmp/wfm-public --include='*.css' | head -n 500 || true
            echo '=== CORE NAVIGATION / RENDER CONTRACT ==='
            grep -RIn -E "savings-decisions|dataset\.page|data-page|ui\.page|function render|render\s*=|window\.render" /tmp/wfm-public --include='*.js' | head -n 420 || true
            echo '=== VALUE COCKPIT SERVED SOURCE ==='
            sed -n '1,420p' /tmp/wfm-public/value-cockpit-ui.js || true
          } | tee /tmp/wfm-runtime-contract.txt
      - name: Preserve runtime contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: wfm-ux-runtime-contract
          path: /tmp/wfm-runtime-contract.txt
          if-no-files-found: error
          retention-days: 1
