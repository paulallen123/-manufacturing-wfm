name: Scheduling absence repair integrity

on:
  pull_request:
    branches:
      - release/vector-customer-ready-candidate-20260925
    paths:
      - 'operations/runtime/manufacturing-scheduling-engine.cjs'
      - 'operations/runtime/manufacturing-scheduling-engine.test.cjs'
      - '.github/workflows/scheduling-absence-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  absence-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Run scheduling engine regressions
        run: node --test operations/runtime/manufacturing-scheduling-engine.test.cjs
