name: Last Line Defence Gates

# Private repositories do not receive GitHub's public-repository malicious-workflow
# hold. Until protected-branch controls are independently enforced, do not execute
# candidate code from pull_request events. Validate only owner-originated pushes.
on:
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: last-line-defence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-and-containment-gates:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 / Node 24
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require trusted execution context
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "push"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"

      - name: Require private repository
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "Refusing to validate a public deployment-wrapper repository."
            exit 1
          fi

      - name: Enforce immutable third-party actions and Trivy denylist
        shell: bash
        run: |
          set -euo pipefail

          # Every external GitHub Action must be pinned to a full immutable commit SHA.
          # This prevents mutable-tag takeover from silently changing CI behaviour.
          bad_actions="$(
            grep -RhoE '^[[:space:]]*uses:[[:space:]]+[^#[:space:]]+' .github/workflows \
              --include='*.yml' --include='*.yaml' 2>/dev/null \
            | sed -E 's/^[[:space:]]*uses:[[:space:]]+//' \
            | grep -vE '^\./' \
            | grep -vE '@[0-9a-fA-F]{40}$' \
            || true
          )"
          if [ -n "$bad_actions" ]; then
            echo "Refusing mutable third-party GitHub Action references:"
            echo "$bad_actions"
            exit 1
          fi

          # GitHub removed Node.js 20 from hosted runners on 2026-09-16.
          # Keep checkout on the reviewed Node 24-compatible v5.1.0 commit until an
          # intentional security review approves a newer immutable commit.
          approved_checkout='actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09'
          bad_checkout="$(
            grep -RhoE 'actions/checkout@[0-9a-fA-F]{40}' .github/workflows \
              --include='*.yml' --include='*.yaml' 2>/dev/null \
            | grep -vFx "$approved_checkout" \
            || true
          )"
          if [ -n "$bad_checkout" ]; then
            echo "Refusing unapproved checkout runtime; Node 20-backed checkout releases are retired."
            echo "$bad_checkout"
            exit 1
          fi

          # Explicitly reject Trivy artifacts known to have been compromised in the
          # March 2026 supply-chain incident, plus floating latest references.
          trivy_deny_re='(aquasec/trivy:(latest|0[.]69[.](4|5|6))|trivy[^[:space:]]*0[.]69[.](4|5|6))'
          trivy_hits="$(
            grep -RInE "$trivy_deny_re" . \
              --exclude-dir=.git \
              --exclude='last-line-defense-gates.yml' \
              2>/dev/null \
            || true
          )"
          if [ -n "$trivy_hits" ]; then
            echo "Refusing known-compromised or floating Trivy artifacts:"
            echo "$trivy_hits"
            exit 1
          fi

      - name: Validate staging-only manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.production_approved == false and .fixture_only == true' DEPLOYMENT_MANIFEST.json >/dev/null

      - name: Require patched, consistent and immutable Node runtime
        shell: bash
        run: |
          set -euo pipefail
          expected='node:22.23.2-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5'
          manifest_image="$(jq -r '.node_image' DEPLOYMENT_MANIFEST.json)"
          docker_image="$(awk '/^FROM / { print $2; exit }' Dockerfile)"
          test "$manifest_image" = "$docker_image"
          test "$manifest_image" = "$expected"
          case "$manifest_image" in
            *@sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "Refusing mutable base-image tag without digest pin."; exit 1 ;;
          esac

      - name: Require immutable runtime chunks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(artifact/runtime.b64.*)
          if [ ${#chunks[@]} -eq 0 ]; then
            echo "Runtime artifact chunks are missing. Deployment must fail closed."
            exit 1
          fi

      - name: Reconstruct and verify runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -r '.runtime_sha256' DEPLOYMENT_MANIFEST.json)"
          cat artifact/runtime.b64.* | base64 -d > /tmp/runtime.tgz
          echo "${expected}  /tmp/runtime.tgz" | sha256sum -c -
          dockerfile_expected="$(grep -oE '[a-f0-9]{64}[[:space:]]+/tmp/runtime.tgz' Dockerfile | awk '{print $1}')"
          test "$dockerfile_expected" = "$expected"

      - name: Enforce non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'USER node' Dockerfile

      - name: Build exact staging wrapper
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --tag manufacturing-wfm:last-line-defence .
