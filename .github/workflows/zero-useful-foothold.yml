name: Zero useful foothold gate

on:
  push:
    branches:
      - security/zero-useful-foothold-v1
    paths:
      - 'security/zero-foothold/**'
      - 'ci/reliability/**'
      - 'scripts/validate-zero-useful-foothold.mjs'
      - 'scripts/validate-ci-resilience.mjs'
      - 'scripts/run-zero-cost-ci.mjs'
      - '.circleci/config.yml'
      - '.github/workflows/zero-useful-foothold.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-useful-foothold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-zero-useful-foothold:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove zero useful foothold invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/validate-zero-useful-foothold.mjs
          node scripts/validate-ci-resilience.mjs

      - name: Preserve exact proof receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-useful-foothold-proof-${{ github.sha }}
          path: |
            zero-useful-foothold-proof.json
            ci-resilience-proof.json
          if-no-files-found: error
          retention-days: 7
