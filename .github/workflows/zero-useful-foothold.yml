name: Zero useful foothold gate

on:
  push:
    branches:
      - security/zero-useful-foothold-v1
    paths:
      - 'security/zero-foothold/**'
      - '.github/workflows/zero-useful-foothold.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-useful-foothold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-zero-useful-foothold:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact approved Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove zero useful foothold invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test security/zero-foothold/zero-useful-foothold-guard.test.mjs
