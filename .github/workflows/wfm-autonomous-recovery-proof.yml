name: WFM autonomous recovery proof

on:
  push:
    branches:
      - main
      - 'autonomy/**'
    paths:
      - 'DEPLOYMENT_MANIFEST.json'
      - 'artifact/**'
      - 'resilience/**'
      - 'scripts/validate-deployment.mjs'
      - 'scripts/validate-resilience-scenarios.mjs'
      - 'scripts/validate-autonomous-recovery-proof.mjs'
      - 'scripts/validate-autonomous-recovery-matrix.mjs'
      - 'scripts/validate-support-incident-recovery-proof.mjs'
      - 'scripts/validate-provider-recovery-authority-proof.mjs'
      - 'scripts/validate-provider-adapter-reconciliation-proof.mjs'
      - 'scripts/diagnose-provider-retry-checkpoint.mjs'
      - '.github/workflows/wfm-autonomous-recovery-proof.yml'

permissions:
  contents: read

concurrency:
  group: wfm-autonomous-recovery-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-known-recovery:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Re-prove deployment provenance
        run: node scripts/validate-deployment.mjs

      - name: Re-prove resilience policy
        run: node scripts/validate-resilience-scenarios.mjs

      - name: Inject and recover a known worker failure with zero human interaction
        run: node scripts/validate-autonomous-recovery-proof.mjs

      - name: Prove deterministic recovery matrix
        run: node scripts/validate-autonomous-recovery-matrix.mjs

      - name: Prove customer report to bounded recovery chain
        run: node --experimental-sqlite scripts/validate-support-incident-recovery-proof.mjs

      - name: Prove attested signed provider recovery authority
        run: node --experimental-sqlite scripts/validate-provider-recovery-authority-proof.mjs

      - name: Diagnose retained provider retry checkpoint shape
        run: node --experimental-sqlite scripts/diagnose-provider-retry-checkpoint.mjs

      - name: Prove recovered provider adapter continuation and reconciliation
        run: node --experimental-sqlite scripts/validate-provider-adapter-reconciliation-proof.mjs

      - name: Assert proof receipts exist and remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test -s autonomous-recovery-proof.json
          test -s autonomous-recovery-matrix-proof.json
          test -s support-incident-recovery-proof.json
          test -s provider-recovery-authority-proof.json
          test -s provider-adapter-reconciliation-proof.json
          node - <<'NODE'
          const worker=require('./autonomous-recovery-proof.json');
          const matrix=require('./autonomous-recovery-matrix-proof.json');
          const support=require('./support-incident-recovery-proof.json');
          const provider=require('./provider-recovery-authority-proof.json');
          const adapter=require('./provider-adapter-reconciliation-proof.json');
          const safe = p => p.negativeAuthorityTests?.payrollWriteDenied===true && p.negativeAuthorityTests?.languageModelDirectExecutionDenied===true && p.negativeAuthorityTests?.crossTenantExecutionDenied===true && p.negativeAuthorityTests?.unknownFaultFailsClosed===true;
          if(worker.status!=='PASS'||worker.humanInteractionRequired!==false||worker.productionMutation!==false||worker.safetyKernelApproved!==true||!safe(worker)) process.exit(1);
          if(matrix.status!=='PASS'||matrix.humanInteractionRequired!==false||matrix.productionMutation!==false||matrix.scenariosPassed!==6||!safe(matrix)) process.exit(1);
          if(!matrix.scenarios.every(s=>s.blockedBeforeIndependentProof&&s.independentDryRunVerified&&s.safetyKernelApproved&&s.isolatedRecoveryVerified&&s.idempotencyVerified)) process.exit(1);
          if(support.status!=='PASS'||support.humanInteractionRequired!==false||support.productionMutation!==false||support.customerTextGrantsAuthority!==false||support.instructionShapedCustomerTextIgnoredForAuthority!==true||support.corroboratingSystemFindingRequired!==true||support.selectionSource!=='retained-deterministic-system-finding'||support.selectedAction!=='integration.retry'||support.safetyKernelApproved!==true||support.idempotencyVerified!==true||!safe(support)) process.exit(1);
          if(provider.status!=='PASS'||provider.humanInteractionRequired!==false||provider.productionMutation!==false||provider.attestedIndependentVerification!==true||provider.signedExternalObservationVerified!==true||provider.externalObservationIgnoredForAuthority!==true||provider.realDurableOneShotActionGrant!==true||provider.realBoundedProviderExecutor!==true||provider.providerNetworkCall!==false||provider.businessMutation!==false||provider.actionGrantReplayDenied!==true||provider.providerObservationTamperDenied!==true||provider.crossTenantDenied!==true||provider.staleEvidenceDenied!==true||provider.directLlmExecutionDenied!==true||provider.payrollWriteDenied!==true||provider.unknownRepairFailsClosed!==true) process.exit(1);
          if(adapter.status!=='PASS'||adapter.humanInteractionRequired!==false||adapter.productionMutation!==false||adapter.realProviderJobStore!==true||adapter.realProviderInvestigation!==true||adapter.attestedIndependentVerification!==true||adapter.signedOneShotRecoveryPermit!==true||adapter.boundedRecoveryExecutor!==true||adapter.recoveryExecutorProviderNetworkCall!==false||adapter.recoveryExecutorBusinessMutation!==false||adapter.normalSealedAdapterContinued!==true||adapter.resumedFromCommittedCheckpoint!==true||adapter.externalNetworkCall!==false||adapter.realIntegrationGatewayStage!==true||adapter.gatewayBusinessApplyCalled!==false||adapter.pageReplayDeduplicated!==true||adapter.changedPayloadSameIdempotencyKeyDenied!==true||adapter.finalProviderState!=='completed'||adapter.finalReconciliation!=='reconciled'||adapter.finalRecordDelta!==0||adapter.finalHeldRecords!==0||adapter.heldRecordScenarioAutonomyDenied!==true||adapter.crossTenantDenied!==true||adapter.directLlmExecutionDenied!==true||adapter.payrollWriteDenied!==true||adapter.unknownBusinessMutationRunbookDenied!==true) process.exit(1);
          console.log(JSON.stringify({worker,matrix,support,provider,adapter},null,2));
          NODE
