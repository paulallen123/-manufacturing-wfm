name: WFM hosted auth harness prevention

on:
  push:
    branches:
      - main
      - 'autonomy/**'
      - 'proof/**'
    paths:
      - '.github/workflows/**'
      - 'scripts/validate-hosted-auth-harness.mjs'
      - 'reliability/fixtures/hosted-auth-harness.json'
      - 'reliability/incidents/2026-09-18-hosted-auth-cookie-jar-oracle.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-auth-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prevent-invalid-hosted-auth-oracles:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Reproduce and classify auth-harness fixtures
        run: node scripts/validate-hosted-auth-harness.mjs --fixtures reliability/fixtures/hosted-auth-harness.json

      - name: Reject repository auth-harness transport regressions
        run: node scripts/validate-hosted-auth-harness.mjs --scan .github/workflows
