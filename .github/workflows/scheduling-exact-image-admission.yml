name: Scheduling exact source and image admission

on:
  push:
    branches: ['proof/scheduling-image-71bd-20261013']
    paths:
      - '.github/workflows/scheduling-exact-image-admission.yml'

permissions:
  contents: read

concurrency:
  group: scheduling-image-71bd-20261013
  cancel-in-progress: false

env:
  TARGET_SHA: 71bd4dab2acd5557a965ef238d6bde402384f04d

jobs:
  ownership-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse unowned proof execution
        shell: bash
        run: test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"

  exact-source-regression:
    needs: ownership-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Bind exact source and supported runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(node --version)" = "v22.23.2"
          test "$(git hash-object operations/runtime/manufacturing-scheduling-engine.cjs)" = \
            "e23a02a5e098990ad75fd1154632021b4ee94d43"
          test "$(git hash-object operations/runtime/manufacturing-scheduling-engine.test.cjs)" = \
            "a214f6da4d236b996465ab58e2157e7a83068392"
      - name: Install composed-runtime proof dependencies
        shell: bash
        run: npm ci --prefix security/runtime --ignore-scripts
      - name: Exercise scheduler and affected consumers
        run: |
          node --test \
            operations/runtime/manufacturing-scheduling-engine.test.cjs \
            operations/runtime/scheduling-intelligence-service.test.cjs \
            operations/runtime/scheduling-authority.test.cjs \
            operations/runtime/manufacturing-demand-forecast.test.cjs \
            operations/runtime/schedule-attendance-reconciliation.test.cjs \
            operations/runtime/scheduling-forecast-reconciliation-service.test.cjs

  exact-installed-image:
    needs: [ownership-guard, exact-source-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Build the exact target through existing Docker admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          docker build --progress=plain \
            --build-arg RAILWAY_GIT_COMMIT_SHA="$TARGET_SHA" \
            -t "vector-scheduling-proof:$TARGET_SHA" .
      - name: Verify final image identity and scheduler installation
        shell: bash
        run: |
          set -euo pipefail
          engine_sha="$(sha256sum operations/runtime/manufacturing-scheduling-engine.cjs | cut -d ' ' -f 1)"
          docker run --rm --user node --entrypoint /bin/sh \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE/operations/runtime,target=/proof/source,readonly" \
            -e "EXPECTED_SOURCE_SHA=$TARGET_SHA" \
            -e "EXPECTED_ENGINE_SHA=$engine_sha" \
            "vector-scheduling-proof:$TARGET_SHA" -c '
              set -eu
              test "$(cat /app/.wfm-build-source-sha)" = "$EXPECTED_SOURCE_SHA"
              test "$(node --version)" = "v22.23.2"
              test -f /app/operations-runtime/manufacturing-scheduling-engine.cjs
              test ! -L /app/operations-runtime/manufacturing-scheduling-engine.cjs
              test "$(sha256sum /app/operations-runtime/manufacturing-scheduling-engine.cjs | cut -d " " -f 1)" = "$EXPECTED_ENGINE_SHA"
              cmp /proof/source/manufacturing-scheduling-engine.cjs \
                /app/operations-runtime/manufacturing-scheduling-engine.cjs
            '
          docker run --rm --user node --entrypoint node \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "vector-scheduling-proof:$TARGET_SHA" -e '
              const engine = require("/app/operations-runtime/manufacturing-scheduling-engine.cjs");
              const plan = engine.createSchedulingPlan({
                tenant: "proof", contextRevision: "proof:1", sourceEvidence: ["synthetic:1"],
                workers: [{id:"w1",type:"EMPLOYEE",status:"ACTIVE",homeSite:"a",eligibleSites:["a"],skills:["s"],certifications:[],availability:[{start:"2026-10-13T06:00:00Z",end:"2026-10-13T18:00:00Z"}],hoursWorkedWeek:0,contractedHours:40,hourlyCost:1}],
                requirements: [{id:"r1",site:"a",role:"operator",start:"2026-10-13T08:00:00Z",end:"2026-10-13T16:00:00Z",headcount:1,requiredSkills:["s"]}]
              });
              if (plan.assignments[0].workerId !== "w1" || plan.executionPermitted !== false) process.exit(1);
            '

  admission-verdict:
    if: always()
    needs: [ownership-guard, exact-source-regression, exact-installed-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every named admission job to succeed
        shell: bash
        env:
          GUARD_RESULT: ${{ needs.ownership-guard.result }}
          SOURCE_RESULT: ${{ needs.exact-source-regression.result }}
          IMAGE_RESULT: ${{ needs.exact-installed-image.result }}
        run: |
          test "$GUARD_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$IMAGE_RESULT" = success
