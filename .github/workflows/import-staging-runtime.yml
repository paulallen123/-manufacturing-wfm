name: Import sealed WFM staging runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-staging-runtime.yml'

permissions:
  contents: write

jobs:
  import-runtime:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WFM_IMPORT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3948-8210-a868-f0b2a947a2a8/raw?se=2026-09-17T13%3A13%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=a61f37a2-e970-5a4d-9ffb-2033e77846d8&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T09%3A40%3A11Z&ske=2026-09-18T09%3A40%3A11Z&sks=b&skv=2026-02-06&sig=u14s9WA8cmX1Gfe7apq7Cz%2BPTwt5Lla3SDRXNrD5iwo%3D'
      WFM_IMPORT_SHA256: '6444bf808ee0d666c77d5815dc36dcc41417252a5f77e4e3ba45f27f3c643f57'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify sealed runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl --fail --location --silent --show-error "$WFM_IMPORT_URL" -o artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz
          echo "$WFM_IMPORT_SHA256  artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz" | sha256sum -c -
      - name: Commit verified runtime into private repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import verified sealed 0.6.76 staging runtime'
          git push origin HEAD:main
