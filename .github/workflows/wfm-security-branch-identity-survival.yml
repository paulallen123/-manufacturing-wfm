name: WFM security-branch identity survival

on:
  push:
    branches:
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-security-branch-identity-survival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-survival-regression:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Require identity-survival implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          test -s security/runtime/identity-survival-guard.cjs
          test -s security/runtime/bootstrap.cjs
          test -s security/runtime/identity-survival-guard.test.cjs
          grep -Fq 'WFM_IDENTITY_SURVIVAL_GUARD=enforce' Dockerfile
          grep -Fq 'CMD ["node","security-runtime/bootstrap.cjs"]' Dockerfile
          grep -Fq 'COPY security/runtime/identity-survival-guard.cjs' Dockerfile
          grep -Fq 'COPY security/runtime/bootstrap.cjs' Dockerfile

      - name: Run identity survival unit and isolation tests
        run: node --test security/runtime/identity-survival-guard.test.cjs

      - name: Build exact security-hardened staging image
        run: docker build --pull=false -t wfm-security-identity:${{ github.sha }} .

      - name: Prove runtime identity guard survives container hardening
        shell: bash
        run: |
          set -euo pipefail
          image="wfm-security-identity:${GITHUB_SHA}"
          test "$(docker inspect --format '{{.Config.User}}' "$image")" = 'node'
          test "$(docker inspect --format '{{json .Config.Cmd}}' "$image")" = '["node","security-runtime/bootstrap.cjs"]'
          test "$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image" | grep '^WFM_IDENTITY_SURVIVAL_GUARD=')" = 'WFM_IDENTITY_SURVIVAL_GUARD=enforce'
          docker run --rm --entrypoint sh "$image" -ec '
            test ! -w /app/server.cjs
            test ! -w /app/security-runtime/bootstrap.cjs
            test ! -w /app/security-runtime/identity-survival-guard.cjs
            test ! -e /usr/local/lib/node_modules/npm
            test ! -e /usr/bin/perl
            test ! -e /usr/bin/mount
            test ! -e /usr/bin/umount
            test ! -e /usr/bin/nsenter
            test -z "$(find / -xdev -type f \( -perm /4000 -o -perm /2000 \) -print -quit)"
          '
          docker run --rm --entrypoint node "$image" -e "require('/app/security-runtime/identity-survival-guard.cjs'); console.log('security-branch-identity-survival=PASS')"

      - name: Preserve production block
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('DEPLOYMENT_MANIFEST.json', 'utf8'));
          if (manifest.production_approved !== false) throw new Error('production_approved must remain false on security hardening branches');
          if (manifest.pilot_ready !== false) throw new Error('pilot_ready must remain false on security hardening branches');
          if (manifest.staging_only !== true) throw new Error('security hardening candidate must remain staging_only');
          NODE
