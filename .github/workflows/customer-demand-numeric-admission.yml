name: Customer demand numeric admission
on:
  push:
    branches: ['backlog/customer-demand-numeric-20261013']
permissions:
  contents: read
concurrency:
  group: customer-demand-numeric-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-service-regression:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Bind exact source and supported runtime
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = "v22.23.2"
          git hash-object operations/runtime/customer-demand-intelligence.cjs operations/runtime/customer-demand-numeric-admission.test.cjs operations/runtime/customer-demand-numeric-service.test.cjs
      - name: Exercise demand score, persistence and existing service
        run: node --test operations/runtime/customer-demand-intelligence.test.cjs operations/runtime/customer-demand-numeric-admission.test.cjs operations/runtime/customer-demand-numeric-service.test.cjs operations/runtime/demand-decision-service.test.cjs
