name: Canonical staging release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-canonical-staging-release
  cancel-in-progress: true

jobs:
  contained:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce temporary release containment
        shell: bash
        run: |
          set -euo pipefail
          echo 'CANONICAL_STAGING_RELEASE=CONTAINED'
          echo 'Reason: canonical GitHub release branches are not yet protected by server-side rules and verified-commit enforcement.'
          echo 'No Railway deployment credential is exposed by this workflow while the hold is active.'
          exit 1
