name: Canonical staging release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-canonical-staging-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      RAILWAY_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      RAILWAY_SERVICE_ID: '3bea5411-cebb-4878-adcc-766f5fd58cc7'
      WFM_PUBLIC_ORIGIN: 'https://wfm-concept-fidelity-preview-production.up.railway.app'

    steps:
      - name: Checkout exact staging mirror SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release authority and exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          staging_sha="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/release/staging" \
            | node --input-type=module -e "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).object.sha))")"
          test "$staging_sha" = "$GITHUB_SHA"
          node scripts/validate-release-policy.mjs
          echo "CANONICAL_STAGING_SOURCE_SHA=$GITHUB_SHA"

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN="$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)"
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"
          "$CLI_BIN" --version

      - name: Deploy exact candidate to canonical staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN repository secret is not configured.' >&2; exit 1; }

          "$RAILWAY_BIN" up             --project "$RAILWAY_PROJECT_ID"             --service "$RAILWAY_SERVICE_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --ci

          matched=0
          for attempt in $(seq 1 90); do
            "$RAILWAY_BIN" deployment list               --service "$RAILWAY_SERVICE_ID"               --environment "$RAILWAY_ENVIRONMENT_ID"               --json > "$RUNNER_TEMP/canonical-staging-deployments.json"

            read -r status sha <<<"$(node --input-type=module - "$RUNNER_TEMP/canonical-staging-deployments.json" "$GITHUB_SHA" <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = process.argv[3];
          const list = Array.isArray(value) ? value : (value.deployments || []);
          const deployment = list.find((entry) => String(entry?.meta?.commitHash || entry?.commitHash || '') === expected) || {};
          process.stdout.write(`${String(deployment.status || deployment.state || '').toUpperCase()} ${String(deployment?.meta?.commitHash || deployment?.commitHash || '')}`);
          NODE
            )"

            echo "CANONICAL_STAGING_DEPLOYMENT_STATUS=$status SHA=$sha"
            if [ "$sha" = "$GITHUB_SHA" ] && [ "$status" = "SUCCESS" ]; then matched=1; break; fi
            if [ "$sha" = "$GITHUB_SHA" ] && { [ "$status" = "FAILED" ] || [ "$status" = "CRASHED" ] || [ "$status" = "REMOVED" ]; }; then
              exit 1
            fi
            sleep 4
          done
          test "$matched" = "1"

      - name: Verify canonical staging health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WFM_PUBLIC_ORIGIN/api/health" > "$RUNNER_TEMP/canonical-staging-health.json"
          node --input-type=module - "$RUNNER_TEMP/canonical-staging-health.json" <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (health.productionApproved !== false) throw new Error('Canonical staging unexpectedly has production authority.');
          console.log('CANONICAL_STAGING_HEALTH=PASS');
          NODE
