name: Integration Activation Runtime Proof

on:
  push:
    branches:
      - 'automation/integration-activation-gate-20260919-r11'
    paths:
      - 'integration/runtime/**'
      - '.github/workflows/integration-activation-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-activation-runtime-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove activation and runtime controls
        run: |
          set -euo pipefail
          node --test integration/runtime/connection-proof-gate.test.cjs
          node --test integration/runtime/provider-circuit-breaker.test.cjs
          node --test integration/runtime/transport-runtime-policy.test.cjs
          node --test integration/runtime/source-authority-fence.test.cjs
          node --test integration/runtime/provider-proof-profiles.test.cjs
          node --test integration/runtime/runtime-ingestion-gate.test.cjs
