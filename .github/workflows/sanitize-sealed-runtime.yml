name: Prove sealed Vector runtime sanitization without mutation

on:
  push:
    branches:
      - fix/24h-freeze-sealed-runtime-sanitizer-20260919
    paths:
      - '.github/workflows/sanitize-sealed-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-read-only-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prove sanitizer on an ephemeral artifact copy
        shell: bash
        run: |
          set -euo pipefail
          ART='artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz'
          SOURCE_SHA="$(sha256sum "$ART" | awk '{print $1}')"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          tar -xzf "$ART" -C "$TMP"
          node scripts/retire-legacy-presentation.mjs "$TMP/public"
          test "$(sha256sum "$ART" | awk '{print $1}')" = "$SOURCE_SHA"
          git diff --exit-code
          git status --porcelain=v1 | grep -q . && { echo 'Frozen source changed during proof.' >&2; exit 1; } || true
          echo "FROZEN_RUNTIME_MUTATION=DENIED"
          echo "EPHEMERAL_PRESENTATION_SANITIZER=PASS"

      - name: Re-run exact candidate Docker admission
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -t wfm-frozen-sanitizer-proof:${{ github.sha }} .

      - name: Prove built runtime is Vector-only without changing sealed source
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-frozen-sanitizer-proof:${{ github.sha }})"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf "$RUNNER_TEMP/public" && mkdir -p "$RUNNER_TEMP/public"
          docker cp "$cid:/app/public/." "$RUNNER_TEMP/public/"
          if grep -RIlE 'WFM_UX_RESET_CYCLE11_BEGIN|WFM_UX_RESET_CYCLE12_BEGIN|VECTOR_PRIORITY_BRIDGE_V1|Payroll review due today|AUTOMATED VALUE DESK|The system finds the saving\.|ux-signoff-desk|ux11-queue|review-callout|review-layout|vc-hero|vc-card' "$RUNNER_TEMP/public" --include='*.js' --include='*.css' --include='*.html'; then
            echo 'Retired presentation content survived exact runtime composition.' >&2
            exit 1
          fi
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/public/vector-shell.js"
          grep -F 'vector-shell.js' "$RUNNER_TEMP/public/index.html"
          git diff --exit-code
          echo 'FROZEN_SOURCE_INTACT=PASS'
          echo 'VECTOR_ONLY_COMPOSED_RUNTIME=PASS'
          echo 'CLAIM_BOUNDARY=read-only proof only; no frozen artifact, customer-proof release, readiness flag, provider or production mutation'