name: Verify sealed Vector runtime transform

on:
  pull_request:
    branches:
      - feature/one-day-enterprise-implementation-v1
    paths:
      - '.github/workflows/sanitize-sealed-runtime.yml'
      - 'scripts/retire-legacy-presentation.mjs'
      - 'Dockerfile'
  push:
    branches:
      - feature/one-day-enterprise-implementation-v1
    paths:
      - '.github/workflows/sanitize-sealed-runtime.yml'
      - 'scripts/retire-legacy-presentation.mjs'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-transform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen source artifact and transform on disposable copies only
        shell: bash
        run: |
          set -euo pipefail
          ART='artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz'
          MANIFEST_SHA="$(python3 - <<'PY'
          import json
          print(json.load(open('DEPLOYMENT_MANIFEST.json'))['runtime_sha256'])
          PY
          )"
          echo "$MANIFEST_SHA  $ART" | sha256sum -c -

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/first" "$TMP/second"

          tar -xzf "$ART" -C "$TMP/first"
          node scripts/retire-legacy-presentation.mjs "$TMP/first/public"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$TMP/sanitized-1.tar.gz" -C "$TMP/first" .
          FIRST_SHA="$(sha256sum "$TMP/sanitized-1.tar.gz" | awk '{print $1}')"

          tar -xzf "$TMP/sanitized-1.tar.gz" -C "$TMP/second"
          node scripts/retire-legacy-presentation.mjs "$TMP/second/public"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$TMP/sanitized-2.tar.gz" -C "$TMP/second" .
          SECOND_SHA="$(sha256sum "$TMP/sanitized-2.tar.gz" | awk '{print $1}')"

          test "$FIRST_SHA" = "$SECOND_SHA"
          test -z "$(git status --porcelain)"
          node scripts/validate-vector-only-ui.mjs

          echo "FROZEN_SOURCE_ARTIFACT_SHA256=$MANIFEST_SHA"
          echo "DISPOSABLE_SANITIZED_SHA256=$FIRST_SHA"
          echo 'FROZEN_CUSTOMER_PROOF_MUTATION=NONE'
          echo 'VECTOR_SANITIZER_IDEMPOTENCE=PASS'
