name: Delivery disruption replay gate

on:
  pull_request:
    paths:
      - 'operations/runtime/demand-decision-service.cjs'
      - 'operations/runtime/delivery-disruption-shadow.cjs'
      - 'operations/runtime/decision-episode.cjs'
      - 'operations/runtime/delivery-replay-*.cjs'
      - 'operations/runtime/delivery-replay.test.cjs'
      - 'operations/runtime/delivery-snapshot.test.cjs'
      - '.github/workflows/delivery-disruption-replay.yml'
  push:
    branches:
      - 'codex/delivery-disruption-replay-20261013'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Exact replay and contention regression
        run: node --test operations/runtime/delivery-replay.test.cjs operations/runtime/delivery-snapshot.test.cjs operations/runtime/demand-decision-service.test.cjs operations/runtime/delivery-disruption-shadow.test.cjs
