name: WFM onboarding crash restart proof

on:
  push:
    branches:
      - 'autonomy/onboarding-crash-recovery-proof-*'

permissions:
  contents: read

jobs:
  crash-restart-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove crash restart is read-only and duplicate-safe
        shell: bash
        run: node --test implementation/runtime/provisioning-crash-restart-integration.test.cjs
