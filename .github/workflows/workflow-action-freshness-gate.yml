name: Workflow action freshness gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'operations/runtime/workflow-action-evidence-contract.cjs'
      - 'operations/runtime/workflow-action-evidence-contract.test.cjs'
      - '.github/workflows/workflow-action-freshness-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-action-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test operations/runtime/workflow-action-evidence-contract.test.cjs
      - run: node --check operations/runtime/workflow-action-evidence-contract.cjs
      - run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-action-freshness:gate .
