name: Water outcome identity gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'frontier/water-resilience-orchestration/**'
      - '.github/workflows/water-outcome-identity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-water-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify water outcome identity contracts
        run: node --test frontier/water-resilience-orchestration/water-resilience-orchestration.test.mjs
      - name: Build full customer candidate
        run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-water-identity:gate .
