name: Policy population source regression
on:
  push:
    branches: ['backlog/policy-population-preflight-20261013']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: policy-population-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-regression:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact isolated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Execute complete policy source suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v22.23.2"
          git ls-files --stage -- policy/runtime
          node --test policy/runtime/*.test.cjs
