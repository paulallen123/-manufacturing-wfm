name: WFM zero-engineer support contract

on:
  push:
    branches:
      - 'autonomy/zero-engineer-support-sprint-**'
    paths:
      - 'SUPPORT_TIER_CONTRACT.md'
      - 'resilience/support-tier-contract.json'
      - 'resilience/failure-scenarios.json'
      - 'resilience/security-baseline.json'
      - 'scripts/validate-support-tier-contract.mjs'
      - 'resilience/support-selfhelp.cjs'
      - 'scripts/validate-support-selfhelp.mjs'
      - '.github/workflows/wfm-zero-engineer-support-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-zero-engineer-support-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Validate existing resilience policy
        run: node scripts/validate-resilience-scenarios.mjs

      - name: Validate zero-engineer tier contract
        run: node scripts/validate-support-tier-contract.mjs

      - name: Validate deterministic Tier 0 self-help
        run: node scripts/validate-support-selfhelp.mjs

      - name: Assert proof receipt
        run: |
          set -euo pipefail
          test -s support-tier-contract-proof.json
          node -e "const p=require('./support-tier-contract-proof.json'); if(p.status!=='PASS'||p.zeroVendorEngineerRequired!==true||p.allCatalogueScenariosMapped!==true||p.languageModelDirectAuthority!==false||p.t2PatchAgentProductionMutation!==false) process.exit(1)"
