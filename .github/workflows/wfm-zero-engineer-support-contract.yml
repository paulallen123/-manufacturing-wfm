name: WFM zero-engineer support contract

on:
  push:
    branches:
      - 'autonomy/zero-engineer-support-sprint-**'
    paths:
      - 'SUPPORT_TIER_CONTRACT.md'
      - 'resilience/support-tier-contract.json'
      - 'resilience/failure-scenarios.json'
      - 'resilience/security-baseline.json'
      - 'resilience/agent-network-boundary.json'
      - 'resilience/support-selfhelp.cjs'
      - 'resilience/autonomous-repair-factory.cjs'
      - 'resilience/isolated-repair-worker.cjs'
      - 'resilience/independent-repair-verifier.cjs'
      - 'resilience/disposable-staging-gate.cjs'
      - 'resilience/autonomous-repair-pipeline.cjs'
      - 'resilience/canary-rollback-controller.cjs'
      - 'resilience/autonomous-repair-canary-orchestrator.cjs'
      - 'resilience/canonical-release-boundary.cjs'
      - 'resilience/canonical-release-policy-snapshot.json'
      - 'resilience/t3-shadow-simulator.cjs'
      - 'resilience/t3-shadow-verifier.cjs'
      - 'resilience/t3-customer-authorisation-gate.cjs'
      - 'resilience/t3-execution-preflight-verifier.cjs'
      - 'resilience/t3-execution-readiness-gate.cjs'
      - 'resilience/t3-deterministic-execution-sandbox.cjs'
      - 'resilience/t4-containment-controller.cjs'
      - 'resilience/autonomy-control-loop.cjs'
      - 'resilience/incident-learning-planner.cjs'
      - 'resilience/incident-regression-corpus.cjs'
      - 'resilience/provider-recovery-handoff.cjs'
      - 'scripts/validate-deployment.mjs'
      - 'scripts/validate-resilience-scenarios.mjs'
      - 'scripts/validate-support-tier-contract.mjs'
      - 'scripts/validate-support-selfhelp.mjs'
      - 'scripts/validate-provider-recovery-handoff.mjs'
      - 'scripts/validate-autonomous-repair-factory.mjs'
      - 'scripts/validate-isolated-repair-worker.mjs'
      - 'scripts/validate-independent-repair-verifier.mjs'
      - 'scripts/validate-disposable-staging-gate.mjs'
      - 'scripts/validate-autonomous-repair-pipeline.mjs'
      - 'scripts/validate-canary-rollback-controller.mjs'
      - 'scripts/validate-autonomous-repair-canary-orchestrator.mjs'
      - 'scripts/validate-canonical-release-boundary.mjs'
      - 'scripts/validate-t3-shadow-support.mjs'
      - 'scripts/validate-t3-customer-authorisation-gate.mjs'
      - 'scripts/validate-t3-execution-readiness.mjs'
      - 'scripts/validate-t3-deterministic-execution-sandbox.mjs'
      - 'scripts/validate-t4-containment-chaos.mjs'
      - 'scripts/validate-t4-outer-terminal-integrity.mjs'
      - 'scripts/validate-autonomy-control-loop.mjs'
      - 'scripts/validate-incident-learning-planner.mjs'
      - 'scripts/validate-historical-incident-replay.mjs'
      - 'scripts/validate-incident-regression-corpus.mjs'
      - 'scripts/validate-persistent-incident-corpus.mjs'
      - 'scripts/validate-autonomy-source-syntax.mjs'
      - 'scripts/run-portable-autonomy-proof.mjs'
      - '.github/workflows/wfm-zero-engineer-support-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wfm-zero-engineer-support-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout trusted owner push with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Hydrate prior verified incident regression corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_PAGES="$RUNNER_TEMP/wfm-autonomy-run-pages"
          CANDIDATES="$RUNNER_TEMP/wfm-prior-runs.json"
          REJECTIONS="$RUNNER_TEMP/wfm-prior-rejections.tsv"
          HYDRATION="$GITHUB_WORKSPACE/incident-regression-corpus-hydration.json"
          mkdir -p "$RUN_PAGES"
          : > "$REJECTIONS"

          BRANCH_ENCODED="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$GITHUB_REF_NAME")"
          PAGE=1
          while [ "$PAGE" -le 10 ]; do
            PAGE_FILE="$RUN_PAGES/$PAGE.json"
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/wfm-zero-engineer-support-contract.yml/runs?branch=${BRANCH_ENCODED}&per_page=100&page=${PAGE}" > "$PAGE_FILE"
            COUNT="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8")).get("workflow_runs", [])))' "$PAGE_FILE")"
            if [ "$COUNT" -lt 100 ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          python3 - "$RUN_PAGES" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" "$CANDIDATES" <<'PY'
          import json, pathlib, sys
          pages, current_run, branch, output = sys.argv[1:]
          candidates = []
          for file in sorted(pathlib.Path(pages).glob('*.json'), key=lambda p: int(p.stem)):
              data = json.load(open(file, encoding='utf-8'))
              for run in data.get('workflow_runs', []):
                  if str(run.get('id', '')) == str(current_run):
                      continue
                  if run.get('head_branch') != branch:
                      continue
                  if run.get('status') != 'completed':
                      continue
                  candidates.append({
                      'runId': int(run.get('id') or 0),
                      'headSha': str(run.get('head_sha') or '').lower(),
                      'createdAt': str(run.get('created_at') or ''),
                      'updatedAt': str(run.get('updated_at') or ''),
                  })
          candidates.sort(key=lambda item: (item['createdAt'], item['runId']), reverse=True)
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(candidates, handle)
          PY

          mapfile -t RUN_ROWS < <(python3 - "$CANDIDATES" <<'PY'
          import json, sys
          for run in json.load(open(sys.argv[1], encoding='utf-8')):
              print(f"{run['runId']}\t{run['headSha']}\t{run['createdAt']}")
          PY
          )

          if [ "${#RUN_ROWS[@]}" -eq 0 ]; then
            python3 - "$HYDRATION" <<'PY'
          import json, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({
                  'schemaVersion': 1,
                  'proof': 'workflow-prior-corpus-hydration',
                  'status': 'BOOTSTRAP_NO_PRIOR_RUNS',
                  'priorSnapshotLoaded': False,
                  'durableHistoryKnown': False,
                  'evidenceUnavailable': False,
                  'selectedRunId': None,
                  'selectedArtifactId': None,
                  'rejectedCandidateCount': 0,
                  'productionMutation': False,
                  'customerMutation': False,
                  'releaseAuthorityGranted': False,
              }, handle, indent=2)
              handle.write('\n')
          PY
            echo 'No prior completed autonomy run is available; continuity proof will bootstrap a new verified corpus snapshot.'
            exit 0
          fi

          HISTORY_KNOWN=0
          EVIDENCE_UNAVAILABLE=0
          SELECTED_RUN_ID=''
          SELECTED_ARTIFACT_ID=''
          SELECTED_ARTIFACT_CREATED_AT=''
          SELECTED_HEAD_SHA=''
          SELECTED_DIR=''

          for ROW in "${RUN_ROWS[@]}"; do
            IFS=$'\t' read -r RUN_ID RUN_HEAD_SHA RUN_CREATED_AT <<< "$ROW"
            ARTIFACT_META="$RUNNER_TEMP/wfm-artifacts-${RUN_ID}.json"
            if ! curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > "$ARTIFACT_META"; then
              EVIDENCE_UNAVAILABLE=1
              printf '%s\t%s\t%s\n' "$RUN_ID" '' 'artifact-list-unavailable' >> "$REJECTIONS"
              continue
            fi

            ARTIFACT_SELECTION="$RUNNER_TEMP/wfm-artifact-selection-${RUN_ID}.json"
            python3 - "$ARTIFACT_META" "$RUN_ID" "$ARTIFACT_SELECTION" <<'PY'
          import json, sys
          meta, run_id, output = sys.argv[1:]
          data = json.load(open(meta, encoding='utf-8'))
          candidates = []
          expected = f'portable-autonomy-proof-{run_id}'
          for artifact in data.get('artifacts', []):
              if artifact.get('expired'):
                  continue
              if artifact.get('name') != expected:
                  continue
              candidates.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0), artifact))
          candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
          if candidates:
              artifact = candidates[0][2]
              with open(output, 'w', encoding='utf-8') as handle:
                  json.dump({
                      'artifactId': int(artifact.get('id') or 0),
                      'artifactName': artifact.get('name'),
                      'artifactCreatedAt': artifact.get('created_at'),
                  }, handle)
          PY
            if [ ! -s "$ARTIFACT_SELECTION" ]; then
              printf '%s\t%s\t%s\n' "$RUN_ID" '' 'no-preserved-proof-artifact' >> "$REJECTIONS"
              continue
            fi

            ARTIFACT_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifactId"])' "$ARTIFACT_SELECTION")"
            ARTIFACT_CREATED_AT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifactCreatedAt"])' "$ARTIFACT_SELECTION")"
            DOWNLOAD_DIR="$RUNNER_TEMP/wfm-prior-artifact-${RUN_ID}"
            ZIP_FILE="$RUNNER_TEMP/wfm-prior-artifact-${RUN_ID}.zip"
            rm -rf "$DOWNLOAD_DIR" "$ZIP_FILE"
            mkdir -p "$DOWNLOAD_DIR"
            if ! curl --fail-with-body --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              --output "$ZIP_FILE"; then
              EVIDENCE_UNAVAILABLE=1
              printf '%s\t%s\t%s\n' "$RUN_ID" "$ARTIFACT_ID" 'artifact-download-unavailable' >> "$REJECTIONS"
              continue
            fi
            if ! unzip -q "$ZIP_FILE" -d "$DOWNLOAD_DIR"; then
              EVIDENCE_UNAVAILABLE=1
              printf '%s\t%s\t%s\n' "$RUN_ID" "$ARTIFACT_ID" 'artifact-unzip-failed' >> "$REJECTIONS"
              continue
            fi

            if [ -s "$DOWNLOAD_DIR/incident-regression-corpus.snapshot.json" ]; then
              HISTORY_KNOWN=1
            fi

            VERIFY_ERROR="$RUNNER_TEMP/wfm-prior-verify-${RUN_ID}.txt"
            if python3 - "$DOWNLOAD_DIR" "$RUN_HEAD_SHA" 2>"$VERIFY_ERROR" <<'PY'
          import hashlib, json, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          expected_head_sha = str(sys.argv[2] or '').lower()
          portable_path = directory / 'portable-autonomy-proof.json'
          envelope_path = directory / 'autonomy-proof-envelope.json'
          snapshot_path = directory / 'incident-regression-corpus.snapshot.json'
          continuity_path = directory / 'incident-regression-corpus-continuity.json'
          for candidate in (portable_path, envelope_path, snapshot_path, continuity_path):
              if not candidate.is_file():
                  raise SystemExit(f'missing-required-evidence:{candidate.name}')
          portable_raw = portable_path.read_bytes()
          snapshot_raw = snapshot_path.read_bytes()
          portable = json.loads(portable_raw)
          envelope = json.loads(envelope_path.read_text(encoding='utf-8'))
          snapshot = json.loads(snapshot_raw)
          continuity = json.loads(continuity_path.read_text(encoding='utf-8'))
          corpus = portable.get('incidentRegressionCorpus') or {}
          sha = lambda value: hashlib.sha256(value).hexdigest()
          accepted_envelope_states = {'LOGIC_ONLY_RELEASE_BLOCKED', 'ELIGIBLE_EXACT_RELEASE_EVIDENCE'}
          checks = [
              portable.get('status') == 'PASS',
              portable.get('exactRuntime') is True,
              portable.get('providerNeutral') is True,
              portable.get('productionMutation') is False,
              portable.get('customerMutation') is False,
              envelope.get('finalEvidenceStatus') in accepted_envelope_states,
              envelope.get('bindingMatches') is True,
              envelope.get('workflowHeadSha') == expected_head_sha,
              envelope.get('portableProofSha256') == sha(portable_raw),
              corpus.get('snapshotSha256') == sha(snapshot_raw),
              corpus.get('corpusDigest') == snapshot.get('corpusDigest'),
              isinstance(snapshot.get('entryCount'), int) and snapshot.get('entryCount') > 0,
              continuity.get('status') == 'PASS',
              continuity.get('proof') == 'provider-neutral-incident-regression-corpus-continuity',
              continuity.get('outputCorpusDigest') == snapshot.get('corpusDigest'),
              continuity.get('outputSnapshotSha256') == sha(snapshot_raw),
              continuity.get('actionAuthorityGranted') is False,
              continuity.get('productionAuthorityGranted') is False,
              continuity.get('releaseAuthorityGranted') is False,
              continuity.get('crossTenantMutation') is False,
              continuity.get('productionMutation') is False,
              continuity.get('customerMutation') is False,
          ]
          if not all(checks):
              raise SystemExit('workflow-proof-hash-or-authority-binding-failed')
          PY
            then
              SELECTED_RUN_ID="$RUN_ID"
              SELECTED_ARTIFACT_ID="$ARTIFACT_ID"
              SELECTED_ARTIFACT_CREATED_AT="$ARTIFACT_CREATED_AT"
              SELECTED_HEAD_SHA="$RUN_HEAD_SHA"
              SELECTED_DIR="$DOWNLOAD_DIR"
              break
            fi

            REASON="$(tr '\n\t' '  ' < "$VERIFY_ERROR" | sed 's/[[:space:]]\+/ /g' | cut -c1-240)"
            printf '%s\t%s\t%s\n' "$RUN_ID" "$ARTIFACT_ID" "verification-failed:${REASON:-unknown}" >> "$REJECTIONS"
          done

          if [ -n "$SELECTED_DIR" ]; then
            PRIOR="$RUNNER_TEMP/incident-regression-corpus.prior.json"
            cp "$SELECTED_DIR/incident-regression-corpus.snapshot.json" "$PRIOR"
            echo "WFM_INCIDENT_CORPUS_INPUT=$PRIOR" >> "$GITHUB_ENV"
            python3 - "$HYDRATION" "$REJECTIONS" "$SELECTED_RUN_ID" "$SELECTED_ARTIFACT_ID" "$SELECTED_ARTIFACT_CREATED_AT" "$SELECTED_HEAD_SHA" "$HISTORY_KNOWN" "$EVIDENCE_UNAVAILABLE" <<'PY'
          import json, pathlib, sys
          output, rejection_file, run_id, artifact_id, created_at, head_sha, history_known, evidence_unavailable = sys.argv[1:]
          rejected = []
          for line in pathlib.Path(rejection_file).read_text(encoding='utf-8').splitlines():
              if not line:
                  continue
              parts = line.split('\t', 2)
              rejected.append({'runId': parts[0], 'artifactId': parts[1] or None, 'reason': parts[2] if len(parts) > 2 else 'unknown'})
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump({
                  'schemaVersion': 1,
                  'proof': 'workflow-prior-corpus-hydration',
                  'status': 'PASS_SELECTED_VERIFIED_PREDECESSOR',
                  'priorSnapshotLoaded': True,
                  'durableHistoryKnown': history_known == '1',
                  'evidenceUnavailable': evidence_unavailable == '1',
                  'selectedRunId': run_id,
                  'selectedArtifactId': artifact_id,
                  'selectedArtifactCreatedAt': created_at,
                  'selectedHeadSha': head_sha,
                  'rejectedCandidateCount': len(rejected),
                  'rejectedCandidates': rejected,
                  'productionMutation': False,
                  'customerMutation': False,
                  'releaseAuthorityGranted': False,
              }, handle, indent=2)
              handle.write('\n')
          PY
            echo "Verified prior corpus loaded from run ${SELECTED_RUN_ID} artifact ${SELECTED_ARTIFACT_ID}; newer invalid/incomplete candidates were skipped safely."
            exit 0
          fi

          STATUS='BOOTSTRAP_NO_DURABLE_HISTORY'
          if [ "$HISTORY_KNOWN" = '1' ]; then
            STATUS='FAIL_CLOSED_DURABLE_HISTORY_UNAUTHENTICATED'
          elif [ "$EVIDENCE_UNAVAILABLE" = '1' ]; then
            STATUS='FAIL_CLOSED_PRIOR_EVIDENCE_UNAVAILABLE'
          fi
          python3 - "$HYDRATION" "$REJECTIONS" "$STATUS" "$HISTORY_KNOWN" "$EVIDENCE_UNAVAILABLE" <<'PY'
          import json, pathlib, sys
          output, rejection_file, status, history_known, evidence_unavailable = sys.argv[1:]
          rejected = []
          for line in pathlib.Path(rejection_file).read_text(encoding='utf-8').splitlines():
              if not line:
                  continue
              parts = line.split('\t', 2)
              rejected.append({'runId': parts[0], 'artifactId': parts[1] or None, 'reason': parts[2] if len(parts) > 2 else 'unknown'})
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump({
                  'schemaVersion': 1,
                  'proof': 'workflow-prior-corpus-hydration',
                  'status': status,
                  'priorSnapshotLoaded': False,
                  'durableHistoryKnown': history_known == '1',
                  'evidenceUnavailable': evidence_unavailable == '1',
                  'selectedRunId': None,
                  'selectedArtifactId': None,
                  'rejectedCandidateCount': len(rejected),
                  'rejectedCandidates': rejected,
                  'productionMutation': False,
                  'customerMutation': False,
                  'releaseAuthorityGranted': False,
              }, handle, indent=2)
              handle.write('\n')
          PY
          if [[ "$STATUS" == FAIL_CLOSED_* ]]; then
            echo "::error::${STATUS}: prior durable incident history could not be authenticated; refusing to bootstrap from zero." >&2
            exit 1
          fi
          echo 'No durable prior corpus history was observed; continuity proof may bootstrap from the current verified catalog.'

      - name: Classify canonical trust anchor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH_JSON="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/integration/canonical")"
          CANONICAL_PROTECTED="$(printf '%s' "$BRANCH_JSON" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("protected", False))).lower())')"
          echo "WFM_CANONICAL_TRUST_ANCHOR_PROTECTED=$CANONICAL_PROTECTED" >> "$GITHUB_ENV"
          if [ "$CANONICAL_PROTECTED" = 'true' ]; then
            echo 'Canonical trust anchor is protected; release evidence may proceed if all other gates pass.'
          else
            echo '::warning::Canonical trust anchor integration/canonical is unprotected. Exact-runtime logic proof will continue, but release evidence will remain fail-closed.' >&2
          fi

      - name: Bind live canonical state and release policy
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_REF='origin/integration/canonical'
          git rev-parse "$CANONICAL_REF" >/dev/null
          MERGE_TREE_SHA="$(git merge-tree --write-tree HEAD "$CANONICAL_REF")"
          test "${#MERGE_TREE_SHA}" -eq 40
          POLICY_FILE="$RUNNER_TEMP/canonical-release-policy.json"
          git show "$CANONICAL_REF:release/release-policy.json" > "$POLICY_FILE"
          echo "WFM_CANONICAL_RELEASE_POLICY_FILE=$POLICY_FILE" >> "$GITHUB_ENV"
          echo "WFM_AUTONOMY_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WFM_CANONICAL_BASE_SHA=$(git rev-parse "$CANONICAL_REF")" >> "$GITHUB_ENV"
          echo "WFM_CANONICAL_POLICY_BLOB_SHA=$(git rev-parse "$CANONICAL_REF:release/release-policy.json")" >> "$GITHUB_ENV"
          echo "WFM_CANONICAL_MERGE_TREE_SHA=$MERGE_TREE_SHA" >> "$GITHUB_ENV"

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run canonical portable autonomy proof
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-portable-autonomy-proof.mjs --strict-runtime 2>&1 | tee portable-autonomy-proof.log

      - name: Revalidate canonical binding at proof completion
        id: canonical_revalidate
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_JSON="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/integration/canonical")"
          FINAL_CANONICAL_SHA="$(printf '%s' "$BRANCH_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          FINAL_POLICY_BLOB_SHA="$(git rev-parse "$WFM_CANONICAL_BASE_SHA:release/release-policy.json")"
          FINAL_MERGE_TREE_SHA="$(git merge-tree --write-tree "$WFM_AUTONOMY_HEAD_SHA" "$WFM_CANONICAL_BASE_SHA")"
          if [ "$FINAL_CANONICAL_SHA" != "$WFM_CANONICAL_BASE_SHA" ] \
            || [ "$FINAL_POLICY_BLOB_SHA" != "$WFM_CANONICAL_POLICY_BLOB_SHA" ] \
            || [ "$FINAL_MERGE_TREE_SHA" != "$WFM_CANONICAL_MERGE_TREE_SHA" ]; then
            echo '::error::Canonical trust anchor moved during proof execution. Discarding stale proof; rerun against the new canonical state.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assert portable proof receipt
        id: proof_receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s portable-autonomy-proof.json
          test -s incident-regression-corpus.snapshot.json
          test -s incident-regression-corpus-continuity.json
          test -s incident-regression-corpus-hydration.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const p = JSON.parse(fs.readFileSync('portable-autonomy-proof.json', 'utf8'));
          const corpusRaw = fs.readFileSync('incident-regression-corpus.snapshot.json', 'utf8');
          const corpus = JSON.parse(corpusRaw);
          const hydration = JSON.parse(fs.readFileSync('incident-regression-corpus-hydration.json', 'utf8'));
          const corpusSha = createHash('sha256').update(corpusRaw).digest('hex');
          const b = p.releaseBinding;
          const protectedAnchor = process.env.WFM_CANONICAL_TRUST_ANCHOR_PROTECTED === 'true';
          const priorCorpusExpected = Boolean(process.env.WFM_INCIDENT_CORPUS_INPUT);
          const hydrationValid = hydration?.proof === 'workflow-prior-corpus-hydration'
            && hydration.priorSnapshotLoaded === priorCorpusExpected
            && hydration.productionMutation === false
            && hydration.customerMutation === false
            && hydration.releaseAuthorityGranted === false
            && (priorCorpusExpected
              ? hydration.status === 'PASS_SELECTED_VERIFIED_PREDECESSOR'
              : hydration.status === 'BOOTSTRAP_NO_PRIOR_RUNS' || hydration.status === 'BOOTSTRAP_NO_DURABLE_HISTORY');
          const common = p.status === 'PASS'
            && p.providerNeutral === true
            && p.requiresGitHubHostedRunner === false
            && p.exactRuntime === true
            && p.productionMutation === false
            && p.customerMutation === false
            && p.canonicalTrustAnchorProtected === protectedAnchor
            && hydrationValid
            && p.incidentRegressionCorpus
            && p.incidentRegressionCorpus.priorSnapshotLoaded === priorCorpusExpected
            && p.incidentRegressionCorpus.corpusDigest === corpus.corpusDigest
            && p.incidentRegressionCorpus.snapshotSha256 === corpusSha
            && p.incidentRegressionCorpus.entryCount === corpus.entryCount
            && b
            && b.headSha === process.env.WFM_AUTONOMY_HEAD_SHA
            && b.canonicalBaseSha === process.env.WFM_CANONICAL_BASE_SHA
            && b.canonicalPolicyBlobSha === process.env.WFM_CANONICAL_POLICY_BLOB_SHA
            && b.mergeTreeSha === process.env.WFM_CANONICAL_MERGE_TREE_SHA;
          const releaseState = protectedAnchor
            ? p.canonicalReleaseEvidenceBound === true
              && p.releaseClaimAllowed === true
              && p.releaseEvidenceStatus === 'ELIGIBLE_EXACT_RELEASE_EVIDENCE'
              && p.proofScope === 'EXACT_RUNTIME_RELEASE_ELIGIBLE'
            : p.canonicalReleaseEvidenceBound === false
              && p.releaseClaimAllowed === false
              && p.releaseEvidenceStatus === 'FAIL_CLOSED_CANONICAL_TRUST_ANCHOR_UNPROTECTED'
              && p.proofScope === 'EXACT_RUNTIME_LOGIC_ONLY';
          if (!(common && releaseState)) process.exit(1);
          NODE

      - name: Enforce release evidence fail-closed boundary
        id: release_boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WFM_CANONICAL_TRUST_ANCHOR_PROTECTED" != 'true' ]; then
            echo '::error::Exact-runtime autonomy logic proof completed, but release evidence remains FAIL_CLOSED_CANONICAL_TRUST_ANCHOR_UNPROTECTED. No release claim is permitted until integration/canonical is governed by an applicable protected-branch or ruleset trust boundary.' >&2
            exit 1
          fi

      - name: Finalize workflow-bound proof envelope
        id: proof_envelope
        if: always()
        shell: bash
        env:
          CANONICAL_REVALIDATE_OUTCOME: ${{ steps.canonical_revalidate.outcome }}
          PROOF_RECEIPT_OUTCOME: ${{ steps.proof_receipt.outcome }}
          RELEASE_BOUNDARY_OUTCOME: ${{ steps.release_boundary.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const sha256 = (value) => createHash('sha256').update(value).digest('hex');
          const proofPath = 'portable-autonomy-proof.json';
          const hydrationPath = 'incident-regression-corpus-hydration.json';
          let portable = null;
          let portableRaw = null;
          let parseError = null;
          if (fs.existsSync(proofPath)) {
            portableRaw = fs.readFileSync(proofPath);
            try {
              portable = JSON.parse(portableRaw.toString('utf8'));
            } catch (error) {
              parseError = String(error?.message || error);
            }
          }
          let hydration = null;
          let hydrationRaw = null;
          if (fs.existsSync(hydrationPath)) {
            hydrationRaw = fs.readFileSync(hydrationPath);
            try {
              hydration = JSON.parse(hydrationRaw.toString('utf8'));
            } catch (error) {
              parseError = parseError || `hydration:${String(error?.message || error)}`;
            }
          }

          const canonicalRevalidationOutcome = process.env.CANONICAL_REVALIDATE_OUTCOME || 'unknown';
          const proofReceiptOutcome = process.env.PROOF_RECEIPT_OUTCOME || 'unknown';
          const releaseBoundaryOutcome = process.env.RELEASE_BOUNDARY_OUTCOME || 'unknown';
          const workflowHeadSha = String(process.env.WORKFLOW_HEAD_SHA || '').toLowerCase();
          const canonicalBaseSha = String(process.env.WFM_CANONICAL_BASE_SHA || '').toLowerCase();
          const canonicalPolicyBlobSha = String(process.env.WFM_CANONICAL_POLICY_BLOB_SHA || '').toLowerCase();
          const mergeTreeSha = String(process.env.WFM_CANONICAL_MERGE_TREE_SHA || '').toLowerCase();

          const binding = portable?.releaseBinding || null;
          const bindingMatches = Boolean(binding)
            && binding.headSha === workflowHeadSha
            && binding.canonicalBaseSha === canonicalBaseSha
            && binding.canonicalPolicyBlobSha === canonicalPolicyBlobSha
            && binding.mergeTreeSha === mergeTreeSha;
          const portablePassed = portable?.status === 'PASS' && portable?.exactRuntime === true;
          const postProofGatesPassed = canonicalRevalidationOutcome === 'success' && proofReceiptOutcome === 'success';

          let finalEvidenceStatus;
          if (!portableRaw || !portable || parseError) {
            finalEvidenceStatus = 'INCOMPLETE_NO_VALID_PORTABLE_PROOF';
          } else if (!portablePassed) {
            finalEvidenceStatus = 'INVALID_PORTABLE_PROOF';
          } else if (!bindingMatches) {
            finalEvidenceStatus = 'INVALID_RELEASE_BINDING_MISMATCH';
          } else if (!postProofGatesPassed) {
            finalEvidenceStatus = 'INVALID_POST_PROOF_GATES_FAILED';
          } else if (releaseBoundaryOutcome === 'success' && portable.releaseClaimAllowed === true) {
            finalEvidenceStatus = 'ELIGIBLE_EXACT_RELEASE_EVIDENCE';
          } else if (releaseBoundaryOutcome === 'failure' && portable.releaseClaimAllowed === false) {
            finalEvidenceStatus = 'LOGIC_ONLY_RELEASE_BLOCKED';
          } else {
            finalEvidenceStatus = 'INVALID_RELEASE_STATE_MISMATCH';
          }

          const releaseClaimAllowed = finalEvidenceStatus === 'ELIGIBLE_EXACT_RELEASE_EVIDENCE';
          const core = {
            schemaVersion: 2,
            proof: 'workflow-bound-zero-engineer-autonomy-evidence',
            workflowRunId: String(process.env.WORKFLOW_RUN_ID || ''),
            workflowRunAttempt: String(process.env.WORKFLOW_RUN_ATTEMPT || ''),
            workflowHeadSha,
            workflowRef: String(process.env.WORKFLOW_REF || ''),
            canonicalBaseSha,
            canonicalPolicyBlobSha,
            mergeTreeSha,
            portableProofSha256: portableRaw ? sha256(portableRaw) : null,
            portableProofStatus: portable?.status || null,
            portableProofScope: portable?.proofScope || null,
            portableReleaseEvidenceStatus: portable?.releaseEvidenceStatus || null,
            portableReleaseClaimAllowed: portable?.releaseClaimAllowed === true,
            incidentRegressionCorpusDigest: portable?.incidentRegressionCorpus?.corpusDigest || null,
            incidentRegressionCorpusSnapshotSha256: portable?.incidentRegressionCorpus?.snapshotSha256 || null,
            incidentRegressionCorpusPriorSnapshotLoaded: portable?.incidentRegressionCorpus?.priorSnapshotLoaded === true,
            incidentCorpusHydrationStatus: hydration?.status || null,
            incidentCorpusHydrationSha256: hydrationRaw ? sha256(hydrationRaw) : null,
            incidentCorpusHydrationSelectedRunId: hydration?.selectedRunId || null,
            incidentCorpusHydrationSelectedArtifactId: hydration?.selectedArtifactId || null,
            canonicalRevalidationOutcome,
            proofReceiptOutcome,
            releaseBoundaryOutcome,
            bindingMatches,
            finalEvidenceStatus,
            releaseClaimAllowed,
            productionMutation: false,
            customerMutation: false,
            parseError,
          };
          const envelope = { ...core, envelopeDigest: sha256(Buffer.from(JSON.stringify(core))) };
          fs.writeFileSync('autonomy-proof-envelope.json', JSON.stringify(envelope, null, 2) + '\n');
          console.log(JSON.stringify(envelope, null, 2));

          if (finalEvidenceStatus.startsWith('INVALID_') || finalEvidenceStatus.startsWith('INCOMPLETE_')) {
            process.exit(1);
          }
          NODE

      - name: Preserve final workflow-bound proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-autonomy-proof-${{ github.run_id }}
          path: |
            portable-autonomy-proof.json
            portable-autonomy-proof.log
            autonomy-proof-envelope.json
            incident-regression-corpus.snapshot.json
            incident-regression-corpus-continuity.json
            incident-regression-corpus-hydration.json
          if-no-files-found: warn
          retention-days: 7