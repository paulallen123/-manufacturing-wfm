name: Action queue freshness gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'ux-overlay/vector-shell.js'
      - 'ux-overlay/vector-shell.css'
      - 'ux-overlay/vector-action-queue.test.cjs'
      - 'ux-overlay/vector-gusto.test.cjs'
      - 'ux-overlay/vector-staffology-controls.test.cjs'
      - 'ux-overlay/vector-settings-navigation.test.cjs'
      - '.github/workflows/action-queue-freshness-gate.yml'
      - 'scripts/prove-installed-action-queue.cjs'
      - 'scripts/prove-installed-action-queue.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-action-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test ux-overlay/vector-action-queue.test.cjs ux-overlay/vector-gusto.test.cjs ux-overlay/vector-staffology-controls.test.cjs ux-overlay/vector-settings-navigation.test.cjs
      - run: node --check ux-overlay/vector-shell.js
      - run: node --test scripts/prove-installed-action-queue.test.cjs
      - run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-action-queue-freshness:gate .
      - name: Verify installed action queue bytes and behavior
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          image_id=$(docker image inspect vector-action-queue-freshness:gate --format '{{.Id}}')
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 1000:1000 --entrypoint node --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -e VECTOR_EXPECTED_SOURCE_SHA="$EXPECTED_SHA" -e VECTOR_PROOF_IMAGE_ID="$image_id" \
            -v "$PWD:/proof-source:ro" "$image_id" /proof-source/scripts/prove-installed-action-queue.cjs
