name: Live host tenant isolation proof (superseded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explain canonical proof path
        shell: bash
        run: |
          set -euo pipefail
          echo 'This duplicate workflow is retired.'
          echo 'Authenticated hosted tenant isolation now runs through railway-first-deploy.yml.'
          echo 'That reviewed path consumes only secrets.RAILWAY_TOKEN, reads the server-held staging password from the exact Railway service, removes the Railway token before proof modules run, and never writes either credential to evidence.'
          echo 'No product runtime, tenant data, or deployment is changed by this workflow.'
