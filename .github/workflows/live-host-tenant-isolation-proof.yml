name: Live host tenant isolation proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-host-tenant-isolation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-two-tenant-boundary:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WFM_ORIGIN: https://wfm-customer-proof-0676-production.up.railway.app
      EXPECTED_RELEASE: 0.6.76-hosted-staging-rc1
    steps:
      - name: Prove separate hosted tenant contexts and no bootstrap leakage
        env:
          WFM_DEMO_PASSWORD: ${{ secrets.WFM_DEMO_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WFM_DEMO_PASSWORD:-}" || { echo 'WFM_DEMO_PASSWORD repository secret is not configured.' >&2; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          login() {
            local email="$1" jar="$2" out="$3"
            status="$(curl -sS -o "$out" -w '%{http_code}' -c "$jar" \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$email\",\"password\":\"$WFM_DEMO_PASSWORD\"}" \
              "$WFM_ORIGIN/api/login")"
            test "$status" = "200" || { echo "Login failed for fixture identity with HTTP $status" >&2; exit 1; }
          }

          get_json() {
            local jar="$1" path="$2" out="$3"
            status="$(curl -sS -o "$out" -w '%{http_code}' -b "$jar" "$WFM_ORIGIN$path")"
            test "$status" = "200" || { echo "$path returned HTTP $status" >&2; exit 1; }
          }

          login 'manager@northstar.example' "$tmp/north.cookies" "$tmp/north-login.json"
          login 'other@isolation.example' "$tmp/other.cookies" "$tmp/other-login.json"
          get_json "$tmp/north.cookies" /api/bootstrap "$tmp/north-bootstrap.json"
          get_json "$tmp/other.cookies" /api/bootstrap "$tmp/other-bootstrap.json"
          get_json "$tmp/north.cookies" /api/health "$tmp/health.json"

          NORTH_BOOT="$tmp/north-bootstrap.json" OTHER_BOOT="$tmp/other-bootstrap.json" HEALTH="$tmp/health.json" node <<'NODE'
          const fs=require('node:fs');
          const north=JSON.parse(fs.readFileSync(process.env.NORTH_BOOT,'utf8'));
          const other=JSON.parse(fs.readFileSync(process.env.OTHER_BOOT,'utf8'));
          const health=JSON.parse(fs.readFileSync(process.env.HEALTH,'utf8'));
          const assert=(ok,msg)=>{if(!ok)throw Error(msg)};
          assert(health.status==='ok','Hosted health is not ok');
          assert(health.release===process.env.EXPECTED_RELEASE,`Unexpected hosted release ${health.release}`);
          assert(health.fixtureOnly===true,'Hosted proof must remain fixture-only');
          assert(health.productionApproved===false,'Hosted proof must remain production-unapproved');
          assert(north.actor?.tenant==='northstar-demo',`Unexpected north tenant ${north.actor?.tenant}`);
          assert(other.actor?.tenant==='isolation-test',`Unexpected isolation tenant ${other.actor?.tenant}`);
          assert(north.actor?.tenant!==other.actor?.tenant,'Tenant identities unexpectedly match');
          const northText=JSON.stringify(north);
          const otherText=JSON.stringify(other);
          for(const forbidden of ['other@isolation.example','isolation-test']){
            assert(!northText.includes(forbidden),`Northstar bootstrap leaked isolation marker ${forbidden}`);
          }
          for(const forbidden of ['maya@northstar.example','manager@northstar.example','payroll@northstar.example','superuser@northstar.example']){
            assert(!otherText.includes(forbidden),`Isolation bootstrap leaked Northstar identity ${forbidden}`);
          }
          const digest=o=>require('node:crypto').createHash('sha256').update(JSON.stringify(o)).digest('hex');
          console.log(`HOSTED_RELEASE=${health.release}`);
          console.log(`NORTH_TENANT=${north.actor.tenant}`);
          console.log(`ISOLATION_TENANT=${other.actor.tenant}`);
          console.log(`NORTH_BOOTSTRAP_SHA256=${digest(north)}`);
          console.log(`ISOLATION_BOOTSTRAP_SHA256=${digest(other)}`);
          console.log('LIVE_HOST_TWO_TENANT_BOOTSTRAP_ISOLATION=PASS');
          NODE
