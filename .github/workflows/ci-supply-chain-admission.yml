name: CI supply-chain admission

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-supply-chain-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Adversarially self-test admission logic
        run: node scripts/validate-ci-supply-chain.mjs --self-test

      - name: Refuse mutable CI executors and actions
        run: node scripts/validate-ci-supply-chain.mjs
