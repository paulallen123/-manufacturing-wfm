name: WFM UX evolution cycle 2 gate

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'ux-overlay/**'
      - '.github/workflows/ux-cycle2-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-ux-cycle2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cycle2-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and decision-safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check ux-overlay/ux-reset-cycle2.js
          node <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync('ux-overlay/ux-reset-cycle2.js','utf8');
          const css = fs.readFileSync('ux-overlay/ux-reset-cycle2.css','utf8');
          const requiredJs = [
            'sameOperationalScope',
            'Who else is off',
            'Cost impact',
            'Only verified cover/overtime cost will be shown',
            'did not return a verified incremental-cost figure',
            '/api/leave-capacity',
            'existing fresh balance, staffing, skills and policy checks'
          ];
          for (const x of requiredJs) if (!js.includes(x)) throw new Error(`Missing cycle 2 invariant: ${x}`);
          const requiredCss = [
            '[data-ux-job="absence"] .ux-leave-evidence',
            '.ux-cost-impact',
            '@media (max-width:760px)'
          ];
          for (const x of requiredCss) if (!css.includes(x)) throw new Error(`Missing cycle 2 CSS invariant: ${x}`);
          if (/cost[^\n]{0,30}=\s*0\b/i.test(js)) throw new Error('Do not silently coerce unknown leave cost to zero.');
          console.log('UX_CYCLE2_SOURCE_INVARIANTS=PASS');
          NODE

      - name: Build exact composed image
        run: docker build --pull=false -t wfm-ux-cycle2:pr .

      - name: Verify immutable runtime and final presentation order
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-ux-cycle2:pr)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/wfm-public
          docker cp "$cid:/app/public/index.html" /tmp/wfm-public/index.html
          docker cp "$cid:/app/public/ux-reset-cycle2.js" /tmp/wfm-public/ux-reset-cycle2.js
          node --check /tmp/wfm-public/ux-reset-cycle2.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/wfm-public/index.html','utf8');
          const baseJs = html.lastIndexOf('ux-reset.js?v=20260917-1');
          const cycleJs = html.lastIndexOf('ux-reset-cycle2.js?v=20260917-2');
          const baseCss = html.lastIndexOf('ux-reset.css?v=20260917-1');
          const cycleCss = html.lastIndexOf('ux-reset-cycle2.css?v=20260917-2');
          if (baseJs < 0 || cycleJs <= baseJs) throw new Error('Cycle 2 JS must load after the role-first base layer.');
          if (baseCss < 0 || cycleCss <= baseCss) throw new Error('Cycle 2 CSS must load after the role-first base layer.');
          console.log('UX_CYCLE2_LOAD_ORDER=PASS');
          NODE
          grep -q '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d' Dockerfile
          echo 'SEALED_RUNTIME_UNCHANGED=PASS'
