name: Capability source gate

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'scripts/validate-capability-superset.mjs'
      - 'scripts/validate-capability-superset.test.mjs'
      - '.github/workflows/capability-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-capability-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify source path contract
        run: node --test scripts/validate-capability-superset.test.mjs
      - name: Validate actual candidate manifest
        run: node scripts/validate-capability-superset.mjs
      - name: Build exact customer candidate
        run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} -t vector-capability-source:gate .
