name: WFM UX cycle 10 r3 hosted interaction proof

on:
  push:
    branches:
      - 'ux/planner-focus-20260918-r3'
    paths:
      - 'scripts/ux-cycle10-r3-hosted-proof.mjs'
      - 'ux-overlay/ux-reset-cycle10.*'
      - '.github/workflows/ux-cycle10-r3-hosted-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-ux-cycle10-r3-hosted-verify
  cancel-in-progress: true

jobs:
  hosted-browser-proof:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      RAILWAY_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      RAILWAY_SERVICE_ID: 'fee028b9-f7dc-44bb-b7e4-5234e2c095c5'
      EXPECTED_ORIGIN: 'https://wfm-ux-cycle10-r3-proof-production.up.railway.app'
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN=$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"

      - name: Fetch isolated credentials and run outside-in proof
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN repository secret is unavailable.' >&2; exit 1; }
          "$RAILWAY_BIN" variable list \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json > "$RUNNER_TEMP/ux-r3-vars.json"
          node scripts/ux-cycle10-r3-hosted-proof.mjs "$RUNNER_TEMP/ux-r3-vars.json" "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ux-r3-vars.json"

      - name: Upload hosted UX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle10-r3-hosted-browser-evidence
          path: ${{ runner.temp }}/cycle10-r3-hosted-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
