name: WFM UX cycle 10 r3 hosted interaction proof

on:
  push:
    branches:
      - 'ux/planner-focus-20260918-r3'
    paths:
      - '.github/workflows/ux-cycle10-r3-hosted-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-ux-cycle10-r3-hosted-verify
  cancel-in-progress: true

jobs:
  hosted-browser-proof:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      RAILWAY_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      RAILWAY_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      RAILWAY_SERVICE_ID: 'fee028b9-f7dc-44bb-b7e4-5234e2c095c5'
      EXPECTED_ORIGIN: 'https://wfm-ux-cycle10-r3-proof-production.up.railway.app'
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN=$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"

      - name: Fetch isolated hosted credentials and run outside-in proof
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN repository secret is unavailable.' >&2; exit 1; }
          "$RAILWAY_BIN" variable list \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json > "$RUNNER_TEMP/ux-r3-vars.json"
          node --input-type=module - "$RUNNER_TEMP/ux-r3-vars.json" "$RUNNER_TEMP" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawn, spawnSync } from 'node:child_process';
          const vars = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const outDir = path.join(process.argv[3], 'cycle10-r3-hosted-evidence');
          fs.mkdirSync(outDir,{recursive:true});
          const origin = String(vars.WFM_PUBLIC_ORIGIN || '').replace(/\/$/,'');
          const password = vars.WFM_STAGING_PASSWORD;
          assert.equal(origin, process.env.EXPECTED_ORIGIN, 'Unexpected isolated proof origin.');
          assert.ok(password && password.length >= 20, 'Isolated hosted password did not resolve.');
          delete process.env.RAILWAY_TOKEN;

          async function text(pathname, init={}) {
            const r = await fetch(origin+pathname,{...init,signal:AbortSignal.timeout(20_000)});
            return {r, body:await r.text()};
          }
          function cookieFrom(r){
            const values=typeof r.headers.getSetCookie==='function'?r.headers.getSetCookie():[r.headers.get('set-cookie')].filter(Boolean);
            return values[0]?.split(';',1)[0]||'';
          }
          const health=await text('/api/health');
          assert.equal(health.r.status,200);
          const hb=JSON.parse(health.body);
          assert.equal(hb.mode,'hosted-staging');
          assert.equal(hb.productionApproved,false);
          assert.equal(hb.fixtureOnly,true);
          const unauth=await text('/api/bootstrap');
          assert.equal(unauth.r.status,401,'Protected bootstrap must fail closed before login.');
          const login=await text('/api/login',{
            method:'POST',headers:{'content-type':'application/json','origin':origin,'referer':origin+'/'},
            body:JSON.stringify({email:'manager@northstar.example',password})
          });
          assert.equal(login.r.status,200,'Manager login failed.');
          const cookie=cookieFrom(login.r); assert.ok(cookie);
          const headers={cookie,referer:origin+'/',accept:'application/json,text/plain,*/*'};
          const schedule=await text('/api/schedule-publication',{headers});
          assert.equal(schedule.r.status,200,'Schedule publication workflow unavailable to manager.');
          const js=await text('/value-cockpit-ui.js',{headers});
          const css=await text('/factory-control-ui.css',{headers});
          assert.equal(js.r.status,200); assert.equal(css.r.status,200);
          for(const marker of ['WFM_UX_RESET_CYCLE10_BEGIN','window.WFMUXCycle10=','Resolve risk before you publish','data-ux-preserved-publish']) assert.ok(js.body.includes(marker),'Missing hosted JS marker '+marker);
          for(const marker of ['WFM_UX_RESET_CYCLE10_BEGIN','.ux-plan-focus','.ux-plan-grid']) assert.ok(css.body.includes(marker),'Missing hosted CSS marker '+marker);
          console.log('HOSTED_CYCLE10_HTTP_ASSET_PROOF=PASS');
          console.log('HOSTED_CYCLE10_FAIL_CLOSED_BOOTSTRAP=PASS');
          console.log('HOSTED_CYCLE10_MANAGER_WORKFLOW_HTTP=PASS');

          const which=name=>{const x=spawnSync('which',[name],{encoding:'utf8'});return x.status===0?x.stdout.trim():''};
          const chrome=['google-chrome','google-chrome-stable','chromium','chromium-browser'].map(which).find(Boolean);
          assert.ok(chrome,'Chrome/Chromium unavailable.');
          const profile=path.join(process.argv[3],'cycle10-r3-chrome'); fs.rmSync(profile,{recursive:true,force:true});
          const port=9231;
          const chromeEnv={...process.env}; delete chromeEnv.RAILWAY_TOKEN;
          const cp=spawn(chrome,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--remote-debugging-address=127.0.0.1',`--remote-debugging-port=${port}`,`--user-data-dir=${profile}`,'--window-size=1440,1000','about:blank'],{stdio:['ignore','ignore','ignore'],env:chromeEnv});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(fn,n=75){let e;for(let i=0;i<n;i++){try{return await fn()}catch(x){e=x;await sleep(200)}}throw e}
          let ws;
          try {
            const targets=await retry(async()=>{const r=await fetch(`http://127.0.0.1:${port}/json/list`);const a=await r.json();if(!a.find(x=>x.type==='page'))throw Error('No browser page');return a});
            const page=targets.find(x=>x.type==='page'); ws=new WebSocket(page.webSocketDebuggerUrl); await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=()=>bad(Error('CDP open failed'))});
            let id=1; const pending=new Map(); ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}};
            const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
            const evalx=async expression=>(await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true})).result?.value;
            await send('Page.enable'); await send('Runtime.enable'); await send('Network.enable');
            await send('Emulation.setDeviceMetricsOverride',{width:1440,height:1000,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url:origin});
            await retry(async()=>{if(!(await evalx("document.readyState==='complete'||document.readyState==='interactive'")))throw Error('not loaded');return true});
            const browserLogin=await evalx(`(async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'manager@northstar.example',password:${JSON.stringify(password)}})});return r.status})()`);
            assert.equal(browserLogin,200);
            await send('Page.reload',{ignoreCache:true});
            await retry(async()=>{if(!(await evalx("!document.querySelector('#v2-login') && document.body?.innerText?.length>200")))throw Error('not authenticated');return true});
            const runtime=await evalx("({c10:!!window.WFMUXCycle10, role:(window.F?.actor?.role||window.ui?.role||''), page:window.ui?.page||''})");
            assert.equal(runtime.c10,true,'Hosted browser did not load Cycle 10 runtime.');
            const navigation=await evalx(`(async()=>{
              const direct=document.querySelector('[data-page="schedule-publication"]');
              if(direct){direct.click();return 'visible-nav';}
              if(window.ui&&typeof window.render==='function'){window.ui.page='schedule-publication';await window.render();return 'render-route';}
              return 'unavailable';
            })()`);
            assert.notEqual(navigation,'unavailable');
            await retry(async()=>{if(!(await evalx("document.querySelector('.content')?.dataset.uxPlannerFocus==='active'")))throw Error('Cycle 10 focus not active');return true});
            const desktop=await evalx(`(()=>({
              focus:!!document.querySelector('.ux-plan-focus'),
              gridHidden:!!document.querySelector('.ux-plan-grid')?.hidden,
              publish:document.querySelector('[data-ux-preserved-publish="true"]')?.textContent?.replace(/\\s+/g,' ').trim()||'',
              jumps:document.querySelectorAll('.ux-plan-jump').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              expanded:document.querySelector('.ux-plan-grid-toggle')?.getAttribute('aria-expanded')||''
            }))()`);
            assert.ok(desktop.focus); assert.ok(desktop.gridHidden); assert.match(desktop.publish,/publish/i); assert.equal(desktop.jumps,3); assert.ok(desktop.overflow<=2); assert.equal(desktop.expanded,'false');
            await evalx("document.querySelector('.ux-plan-grid-toggle').click()"); await sleep(150);
            const disclosed=await evalx("({hidden:document.querySelector('.ux-plan-grid')?.hidden,expanded:document.querySelector('.ux-plan-grid-toggle')?.getAttribute('aria-expanded')})");
            assert.equal(disclosed.hidden,false); assert.equal(disclosed.expanded,'true');
            await send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:1,mobile:true}); await sleep(300);
            const mobile=await evalx("({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,focus:!!document.querySelector('.ux-plan-focus'),publish:!!document.querySelector('[data-ux-preserved-publish=\"true\"]')})");
            assert.ok(mobile.overflow<=2); assert.ok(mobile.focus); assert.ok(mobile.publish);
            const shot=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:true,fromSurface:true}); fs.writeFileSync(path.join(outDir,'cycle10-r3-hosted-mobile.png'),Buffer.from(shot.data,'base64'));
            fs.writeFileSync(path.join(outDir,'proof.json'),JSON.stringify({capturedAt:new Date().toISOString(),origin,health:{mode:hb.mode,fixtureOnly:hb.fixtureOnly,productionApproved:hb.productionApproved},navigation,desktop,disclosed,mobile,claimBoundary:'isolated hosted fixture staging only; no production/pilot approval; authoritative publish control preserved'},null,2));
            console.log('HOSTED_CYCLE10_BROWSER_INTERACTION=PASS');
            console.log('HOSTED_CYCLE10_DESKTOP_OVERFLOW='+desktop.overflow);
            console.log('HOSTED_CYCLE10_MOBILE_OVERFLOW='+mobile.overflow);
          } finally { try{ws?.close()}catch{}; cp.kill('SIGTERM'); await sleep(250); if(!cp.killed)cp.kill('SIGKILL'); }
          delete vars.WFM_STAGING_PASSWORD;
          NODE
          rm -f "$RUNNER_TEMP/ux-r3-vars.json"

      - name: Upload hosted UX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle10-r3-hosted-browser-evidence
          path: ${{ runner.temp }}/cycle10-r3-hosted-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
