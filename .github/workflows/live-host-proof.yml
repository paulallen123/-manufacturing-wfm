name: Live Host Proof

# Current customer-proof promotion target: Railway deployment 93c91f28-3994-4d45-9cdd-f9b0874214a6
on:
  push:
    branches:
      - main
      - 'autonomy/live-host-ux-proof'
    paths:
      - '.github/workflows/live-host-proof.yml'
      - 'DEPLOYMENT_MANIFEST.json'
      - 'STAGING_FREEZE.json'
      - 'Dockerfile'
      - 'artifact/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outside-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WFM_BASE_URL: https://wfm-customer-proof-0676-production.up.railway.app
      EXPECTED_RELEASE: 0.6.76-hosted-staging-rc1
    steps:
      - name: Prove public health and release identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$WFM_BASE_URL/api/health" -o /tmp/health.json
          cat /tmp/health.json
          grep -F '"status":"ok"' /tmp/health.json
          grep -F '"mode":"hosted-staging"' /tmp/health.json
          grep -F '"fixtureOnly":true' /tmp/health.json
          grep -F '"productionApproved":false' /tmp/health.json
          grep -F '"pilotReady":false' /tmp/health.json
          grep -F "\"release\":\"$EXPECTED_RELEASE\"" /tmp/health.json

      - name: Prove public customer surfaces load
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$WFM_BASE_URL/" -o /tmp/root.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$WFM_BASE_URL/kiosk.html" -o /tmp/kiosk.html
          test -s /tmp/root.html
          test -s /tmp/kiosk.html
          echo "Public application and kiosk surfaces returned non-empty HTTP 2xx responses."

      - name: Prove promoted role-first UX bundle is live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$WFM_BASE_URL/value-cockpit-ui.js" -o /tmp/value-cockpit-ui.js
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$WFM_BASE_URL/factory-control-ui.css" -o /tmp/factory-control-ui.css

          grep -F 'WFM_UX_RESET_CYCLE9_BEGIN' /tmp/value-cockpit-ui.js
          grep -F "overview:'Today'" /tmp/value-cockpit-ui.js
          grep -F 'Work the exceptions, not the timesheet.' /tmp/value-cockpit-ui.js
          grep -F 'Is my time correct?' /tmp/value-cockpit-ui.js
          grep -F 'ux-more-button' /tmp/value-cockpit-ui.js

          grep -F 'WFM_UX_RESET_CYCLE9_BEGIN' /tmp/factory-control-ui.css
          grep -F '.ux-tool-drawer' /tmp/factory-control-ui.css
          grep -F '[data-ux-time-review="calm"]' /tmp/factory-control-ui.css
          grep -F '[data-ux-employee-time="calm"]' /tmp/factory-control-ui.css

          echo 'LIVE_ROLE_FIRST_UX=PASS'

      - name: Prove protected data fails closed without authentication
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/bootstrap-unauth.json \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            "$WFM_BASE_URL/api/bootstrap")
          cat /tmp/bootstrap-unauth.json || true
          test "$status" = "401"
          echo "Unauthenticated /api/bootstrap correctly returned HTTP 401."
