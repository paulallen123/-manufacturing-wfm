name: WFM UX evolution cycle 3 gate

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'ux-overlay/**'
      - '.github/workflows/ux-cycle3-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-ux-cycle3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cycle3-signoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and sign-off intent checks
        shell: bash
        run: |
          set -euo pipefail
          node --check ux-overlay/ux-reset-cycle3.js
          node <<'NODE'
          const fs=require('node:fs');
          const js=fs.readFileSync('ux-overlay/ux-reset-cycle3.js','utf8');
          const css=fs.readFileSync('ux-overlay/ux-reset-cycle3.css','utf8');
          for(const x of ['window.payrollPreview?.report?.()','Exceptions','Weekly checks','People checked','Worked time','Checks & exceptions','Employee totals','Controls & protection','Ready to sign','data-ux-signoff-open']) if(!js.includes(x)) throw new Error('Missing cycle 3 invariant: '+x);
          for(const x of ['.ux-signoff-desk','.ux-signoff-kpis','.ux-signoff-detail','overflow:auto','[data-ux-job="signoff"]']) if(!css.includes(x)) throw new Error('Missing cycle 3 CSS invariant: '+x);
          if(js.includes('t.canSign=true')||js.includes('t.canSign = true')) throw new Error('UX layer must not manufacture sign-off eligibility.');
          console.log('UX_CYCLE3_SOURCE_INVARIANTS=PASS');
          NODE

      - name: Build exact composed image
        run: docker build --pull=false -t wfm-ux-cycle3:pr .

      - name: Verify approved presentation-bundle composition
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-ux-cycle3:pr)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/wfm-cycle3
          docker cp "$cid:/app/public/index.html" /tmp/wfm-cycle3/index.html
          docker cp "$cid:/app/public/value-cockpit-ui.js" /tmp/wfm-cycle3/value-cockpit-ui.js
          docker cp "$cid:/app/public/factory-control-ui.css" /tmp/wfm-cycle3/factory-control-ui.css
          node --check /tmp/wfm-cycle3/value-cockpit-ui.js
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('/tmp/wfm-cycle3/index.html','utf8');
          const js=fs.readFileSync('/tmp/wfm-cycle3/value-cockpit-ui.js','utf8');
          const css=fs.readFileSync('/tmp/wfm-cycle3/factory-control-ui.css','utf8');
          if (!html.includes('value-cockpit-ui.js') || !html.includes('factory-control-ui.css')) throw new Error('Approved presentation assets are not loaded.');
          if (/ux-reset(?:-cycle[23])?\.(?:js|css)/.test(html)) throw new Error('Standalone UX paths must not be introduced outside the sealed static allow-list.');
          const j1=js.indexOf('WFM_UX_RESET_BASE_BEGIN'),j2=js.indexOf('WFM_UX_RESET_CYCLE2_BEGIN'),j3=js.indexOf('WFM_UX_RESET_CYCLE3_BEGIN');
          const c1=css.indexOf('WFM_UX_RESET_BASE_BEGIN'),c2=css.indexOf('WFM_UX_RESET_CYCLE2_BEGIN'),c3=css.indexOf('WFM_UX_RESET_CYCLE3_BEGIN');
          if (!(j1>=0&&j2>j1&&j3>j2&&c1>=0&&c2>c1&&c3>c2)) throw new Error('UX layers are not composed in deterministic order.');
          for(const x of ['window.WFMUXReset=','window.WFMUXCycle2=','window.WFMUXCycle3=']) if(!js.includes(x)) throw new Error('Missing served UX implementation: '+x);
          for(const x of ['.ux-signoff-desk','.ux-signoff-kpis','.ux-signoff-detail']) if(!css.includes(x)) throw new Error('Missing served Cycle 3 CSS: '+x);
          console.log('UX_CYCLE3_APPROVED_ASSET_COMPOSITION=PASS');
          NODE
          grep -q '3ca08429d1b8dc9e9f604f0414865d41ff871c07bdf76f0a1c84541ab7f27f4d' Dockerfile
          if grep -Eq '^(COPY|ADD).*server\.cjs|^RUN .*server\.cjs' Dockerfile; then echo '::error::UX composition must not replace or mutate sealed server logic'; exit 1; fi
          echo 'BASE_RUNTIME_ARTIFACT_AND_SERVER_CONTRACT_UNCHANGED=PASS'

      - name: Run isolated composed image and browser-check sign-off UX
        shell: bash
        run: |
          set -euo pipefail
          redact_logs(){ docker logs wfm-ux-cycle3-run 2>&1 | sed -E 's/(Demo password: ).*/\1[redacted]/' || true; }
          docker run -d --name wfm-ux-cycle3-run --network host \
            -e PORT=4100 \
            -e NODE_ENV=staging \
            -e NODE_OPTIONS=--experimental-sqlite \
            -e WFM_DB=/tmp/wfm-ux-cycle3.sqlite \
            wfm-ux-cycle3:pr
          trap 'redact_logs; docker rm -f wfm-ux-cycle3-run >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4100/api/health >/tmp/health.json; then break; fi
            sleep .5
          done
          test -s /tmp/health.json
          cat /tmp/health.json

          # Prove the browser-addressable assets contain the overlay while the server allow-list
          # still rejects the former standalone UX path.
          curl -fsS http://127.0.0.1:4100/value-cockpit-ui.js >/tmp/served-ui.js
          curl -fsS http://127.0.0.1:4100/factory-control-ui.css >/tmp/served-ui.css
          grep -q 'WFM_UX_RESET_CYCLE3_BEGIN' /tmp/served-ui.js
          grep -q 'WFM_UX_RESET_CYCLE3_BEGIN' /tmp/served-ui.css
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4100/ux-reset-cycle3.js)" = "404"
          echo 'UX_CYCLE3_SERVER_DELIVERY_CONTRACT=PASS'

          export WFM_DEMO_PASSWORD="$(docker logs wfm-ux-cycle3-run 2>&1 | sed -n 's/^.*Demo password: //p' | tail -1)"
          test -n "${WFM_DEMO_PASSWORD:-}"
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9224 --user-data-dir=/tmp/wfm-cycle3-chrome --window-size=1440,1000 about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" >/dev/null 2>&1 || true; redact_logs; docker rm -f wfm-ux-cycle3-run >/dev/null 2>&1 || true' EXIT
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(fn,n=60){let e;for(let i=0;i<n;i++){try{return await fn()}catch(x){e=x;await sleep(200)}}throw e}
          const targets=await retry(async()=>{const r=await fetch('http://127.0.0.1:9224/json/list');const x=await r.json();if(!x.length)throw Error('No CDP target');return x});
          const ws=new WebSocket(targets.find(x=>x.type==='page').webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=()=>bad(Error('CDP open failed'))});
          let id=1;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
          const evalx=async expression=>(await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true})).result?.value;
          const wait=async expression=>retry(async()=>{const v=await evalx(expression);if(!v)throw Error('wait');return v},100);
          await send('Page.enable');await send('Runtime.enable');await send('Page.navigate',{url:'http://127.0.0.1:4100'});await wait("document.readyState==='complete'||document.readyState==='interactive'");
          await sleep(600);
          await wait("typeof window.WFMUXReset==='object'&&typeof window.WFMUXCycle2==='object'&&typeof window.WFMUXCycle3==='object'");
          if(await evalx("Boolean(document.querySelector('#v2-login'))")){
            const password=process.env.WFM_DEMO_PASSWORD;
            if(!password)throw Error('Local test password was not captured from the sealed runtime');
            const creds=JSON.stringify({email:'superuser@northstar.example',password});
            const ok=await evalx(`(()=>{const c=${creds};const f=document.querySelector('#v2-login');const e=f?.querySelector('[name="email"]'),p=f?.querySelector('[name="password"]');if(!e||!p)return false;e.value=c.email;e.dispatchEvent(new Event('change',{bubbles:true}));p.value=c.password;p.dispatchEvent(new Event('input',{bubbles:true}));f.requestSubmit();return true})()`);if(!ok)throw Error('Login form could not be submitted');await wait("!document.querySelector('#v2-login')");
          }
          const clicked=await evalx(`(()=>{const x=[...document.querySelectorAll('[data-page="weekly-review"]')].find(n=>n.offsetParent!==null);if(!x)return false;x.click();return true})()`);if(!clicked)throw Error('Weekly sign-off navigation route not found');
          await wait("Boolean(document.querySelector('.review-layout'))");
          await sleep(600);
          const diagnostic=()=>evalx(`(()=>{const layout=document.querySelector('.review-layout'),main=layout?.querySelector('.review-main');return {page:typeof ui!=='undefined'?ui.page:null,role:(typeof F!=='undefined'&&F.actor?.role)||(typeof ui!=='undefined'?ui.role:null),base:typeof window.WFMUXReset,cycle2:typeof window.WFMUXCycle2,cycle3:typeof window.WFMUXCycle3,preview:typeof window.payrollPreview,previewReport:typeof window.payrollPreview?.report,tabs:!!document.querySelector('.review-tabs'),layout:!!layout,steps:!!document.querySelector('.review-steps'),main:!!main,panelCount:main?[...main.children].filter(x=>x.classList?.contains('panel')).length:0,signbar:!!main?.querySelector('.review-signbar'),aside:!!layout?.querySelector('.review-aside'),desk:!!document.querySelector('.ux-signoff-desk')}})()`);
          let diag=await diagnostic();console.log('UX_CYCLE3_COMPOSITION_DIAGNOSTIC='+JSON.stringify(diag));
          if(!diag.desk){await evalx("window.WFMUXCycle3?.apply?.(); true");await sleep(250);diag=await diagnostic();console.log('UX_CYCLE3_COMPOSITION_AFTER_APPLY='+JSON.stringify(diag));}
          if(!diag.desk)throw Error('Cycle 3 did not compose weekly sign-off: '+JSON.stringify(diag));
          const proof=await evalx(`(()=>({desk:!!document.querySelector('.ux-signoff-desk'),details:document.querySelectorAll('.ux-signoff-detail').length,hero:!!document.querySelector('.review-hero'),pageOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,labels:[...document.querySelectorAll('.ux-signoff-kpis small')].map(x=>x.textContent.trim()),signAction:document.querySelector('.ux-signoff-desk [data-act="review-sign"],.ux-signoff-desk [data-act="review-return"]')?.textContent.trim()||null}))()`);
          console.log('UX_CYCLE3_BROWSER_PROOF='+JSON.stringify(proof));
          if(!proof.desk||proof.details!==3||proof.hero||proof.pageOverflow>2)throw Error('Condensed sign-off browser invariant failed');
          for(const label of ['Exceptions','Weekly checks','People checked','Worked time'])if(!proof.labels.includes(label))throw Error('Missing KPI '+label);
          ws.close();
          NODE
