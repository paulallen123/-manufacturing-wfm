name: Zero-touch contract autostart proof

on:
  push:
    branches:
      - fix/zero-touch-contract-autostart-20260926

permissions:
  contents: read

jobs:
  implementation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run autonomous implementation regression
        run: node --test implementation/runtime/one-day-enterprise-engine.test.cjs
