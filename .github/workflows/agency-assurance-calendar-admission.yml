name: Agency assurance calendar admission

on:
  pull_request:
    branches: [release/vector-customer-ready-candidate-20260925]
    paths:
      - 'src/frontier/agency-right-to-work-lifecycle.mjs'
      - 'test/frontier/agency-right-to-work-lifecycle.test.mjs'
      - 'test/frontier/agency-assurance-calendar-consumer.test.mjs'
      - '.github/workflows/agency-assurance-calendar-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assurance-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test test/frontier/agency-right-to-work-lifecycle.test.mjs test/frontier/agency-right-to-work-assurance-ledger.test.mjs test/frontier/agency-assurance-calendar-consumer.test.mjs
      - run: node --check src/frontier/agency-right-to-work-lifecycle.mjs && node --check test/frontier/agency-assurance-calendar-consumer.test.mjs
      - run: docker build --pull=false --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t vector-assurance-calendar:gate .
