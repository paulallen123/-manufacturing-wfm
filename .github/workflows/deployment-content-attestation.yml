name: WFM composed deployment attestation

on:
  push:
    branches:
      - main
      - 'autonomy/**'
    paths:
      - '.github/workflows/deployment-content-attestation.yml'
      - 'Dockerfile'
      - 'DEPLOYMENT_MANIFEST.json'
      - 'artifact/**'
      - 'security/runtime/**'
      - 'ux-overlay/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-deployment-content-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-attestation:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run deployment-attestation unit regressions
        run: node --test security/runtime/deployment-attestation.test.cjs

      - name: Build exact composed staging image
        run: docker build --pull=false -t wfm-deployment-attestation:${{ github.sha }} .

      - name: Prove composed identity changes when an overlay changes
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="wfm-deployment-attestation:${GITHUB_SHA}"
          BASELINE="$(docker run --rm --entrypoint cat "$IMAGE" /app/security-runtime/deployment-sha256 | tr -d '\r\n')"
          test "${#BASELINE}" -eq 64

          printf '\n/* provenance-chaos-fixture */\n' >> ux-overlay/ux-reset-cycle9.js
          docker build --pull=false -t wfm-deployment-attestation-chaos:${GITHUB_SHA} .
          CHAOS="$(docker run --rm --entrypoint cat "wfm-deployment-attestation-chaos:${GITHUB_SHA}" /app/security-runtime/deployment-sha256 | tr -d '\r\n')"
          test "${#CHAOS}" -eq 64
          if [ "$BASELINE" = "$CHAOS" ]; then
            echo 'ERROR: composed deployment identity did not change after UX overlay mutation' >&2
            exit 1
          fi
          git checkout -- ux-overlay/ux-reset-cycle9.js
          echo 'overlay-drift-detection=PASS'

      - name: Prove startup fails closed on absent or mismatched composed identity
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="wfm-deployment-attestation:${GITHUB_SHA}"
          RUNTIME_SHA="$(node -p "require('./DEPLOYMENT_MANIFEST.json').runtime_sha256")"
          DEPLOYMENT_SHA="$(docker run --rm --entrypoint cat "$IMAGE" /app/security-runtime/deployment-sha256 | tr -d '\r\n')"
          if [[ "${DEPLOYMENT_SHA:0:1}" == "0" ]]; then
            MISMATCH="1${DEPLOYMENT_SHA:1}"
          else
            MISMATCH="0${DEPLOYMENT_SHA:1}"
          fi

          if docker run --rm \
            -e WFM_RUNTIME_SHA256="$RUNTIME_SHA" \
            "$IMAGE" >missing-deployment-id.log 2>&1; then
            echo 'ERROR: image started without externally configured composed identity' >&2
            exit 1
          fi
          grep -Fq 'WFM_DEPLOYMENT_ATTESTATION_CONFIG_INVALID' missing-deployment-id.log

          if docker run --rm \
            -e WFM_RUNTIME_SHA256="$RUNTIME_SHA" \
            -e WFM_DEPLOYMENT_SHA256="$MISMATCH" \
            "$IMAGE" >mismatched-deployment-id.log 2>&1; then
            echo 'ERROR: image started with mismatched composed identity' >&2
            exit 1
          fi
          grep -Fq 'WFM_DEPLOYMENT_ATTESTATION_MISMATCH' mismatched-deployment-id.log

          if docker run --rm \
            -e WFM_RUNTIME_SHA256="$RUNTIME_SHA" \
            -e WFM_DEPLOYMENT_SHA256="$DEPLOYMENT_SHA" \
            -e WFM_HOSTED_STAGING=true \
            "$IMAGE" >matching-deployment-id.log 2>&1; then
            echo 'ERROR: expected hosted DB guard to stop deliberately incomplete fixture' >&2
            exit 1
          fi
          grep -Fq 'WFM_RUNTIME_ATTESTATION_PASSED' matching-deployment-id.log
          grep -Fq 'WFM_DEPLOYMENT_ATTESTATION_PASSED' matching-deployment-id.log
          grep -Fq 'Hosted staging refuses to start without WFM_DB' matching-deployment-id.log
