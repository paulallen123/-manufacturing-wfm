name: Capacity Rescue exact source and image admission

on:
  push:
    branches:
      - proof/capacity-rescue-image-4a0946d-20261017
    paths:
      - .github/workflows/capacity-rescue-image-4a0946d.yml

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed outside owner-authored proof push
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER"
          test "$OWNER" = paulallen123
          test "$REPOSITORY" = paulallen123/-manufacturing-wfm
          test "$REF" = refs/heads/proof/capacity-rescue-image-4a0946d-20261017
          test "$EVENT" = push

  admission:
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: 4a0946de945490f8b927c08863d2e2cf2a17efd0
      IMAGE: capacity-rescue-proof:4a0946d
    steps:
      - name: Check out immutable target, not proof branch or PR merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4a0946de945490f8b927c08863d2e2cf2a17efd0
          persist-credentials: false
      - name: Verify exact target and reviewed blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD:operations/runtime/capacity-rescue-shadow.cjs)" = 0bd582d1b41e203fb623112f2f4453fd67daaad7
          test "$(git rev-parse HEAD:operations/runtime/capacity-rescue-shadow.current-base.test.cjs)" = 50d1b1010ac8e2f42b2c75ac9790c8b094bea206
          test "$(git hash-object Dockerfile)" = a31e87448e6950906691c13d56ed6c9cc986bb55
      - name: Install supported exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          check-latest: false
      - name: Capacity Rescue and affected source suites
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.2
          node --test operations/runtime/capacity-rescue-shadow.current-base.test.cjs operations/runtime/decision-episode.test.cjs operations/runtime/demand-decision-service.test.cjs
      - name: Build unchanged target Dockerfile without deployment
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          test "$(git hash-object Dockerfile)" = a31e87448e6950906691c13d56ed6c9cc986bb55
          docker build --progress=plain --build-arg RAILWAY_GIT_COMMIT_SHA="$TARGET_SHA" --tag "$IMAGE" --file Dockerfile .
          docker image inspect "$IMAGE" --format 'FINAL_IMAGE_ID={{.Id}}'
      - name: Inspect sealed final image and installed-path boundary
        run: |
          set -euo pipefail
          expected="$(sha256sum operations/runtime/capacity-rescue-shadow.cjs | cut -d ' ' -f 1)"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user node --entrypoint node \
            -e TARGET_SHA="$TARGET_SHA" -e EXPECTED_MODULE_SHA256="$expected" "$IMAGE" -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const assert = require("node:assert/strict");
            assert.equal(process.version, "v22.23.2");
            assert.equal(fs.readFileSync("/app/.wfm-build-source-sha", "utf8").trim(), process.env.TARGET_SHA);
            console.log("FINAL_IMAGE_SEALED_SOURCE_SHA=" + process.env.TARGET_SHA);
            const path = "/app/operations-runtime/capacity-rescue-shadow.cjs";
            if (fs.existsSync(path)) {
              const hash = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
              assert.equal(hash, process.env.EXPECTED_MODULE_SHA256);
              console.log("CAPACITY_RESCUE_INSTALLED_PATH_BYTE_MATCH=" + path);
            } else {
              console.log("CAPACITY_RESCUE_INSTALLED_PATH_ABSENT=" + path);
              console.log("SOURCE_IMAGE_ADMISSION_ONLY; MODULE_INSTALLATION_NOT_PROVEN");
            }
            '

  verdict:
    if: ${{ always() }}
    needs: [authority, admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled, or skipped prerequisites
        env:
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          ADMISSION_RESULT: ${{ needs.admission.result }}
        run: |
          set -euo pipefail
          test "$AUTHORITY_RESULT" = success
          test "$ADMISSION_RESULT" = success
          echo 'PASS: isolated exact-target source/image admission only; no integration, deployment, customer, or production authority.'
