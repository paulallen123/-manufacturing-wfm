name: Agency Operating System V2 Shadow Gate

on:
  push:
    branches:
      - 'feature/agency-operating-system-v3-20260925'
    paths:
      - 'src/frontier/agency-worker-passport.mjs'
      - 'src/frontier/agency-operations-intelligence.mjs'
      - 'src/frontier/agency-decision-ledger.mjs'
      - 'src/frontier/agency-operating-system.mjs'
      - 'test/frontier/agency-operating-system-v2.test.mjs'
      - '.github/workflows/agency-operating-system-v2-shadow.yml'
  pull_request:
    paths:
      - 'src/frontier/agency-worker-passport.mjs'
      - 'src/frontier/agency-operations-intelligence.mjs'
      - 'src/frontier/agency-decision-ledger.mjs'
      - 'src/frontier/agency-operating-system.mjs'
      - 'test/frontier/agency-operating-system-v2.test.mjs'
      - '.github/workflows/agency-operating-system-v2-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-operating-system-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agency-operating-system-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run agency operating system and retained exchange tests on pinned Node
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            node:22.23.2-bookworm-slim@sha256:4d676821dff059fd00d277ee4261ef34ea712317fed0737c03941481b5760c96 \
            node --test \
              test/frontier/agency-operating-system-v2.test.mjs \
              test/frontier/agency-labour-exchange.test.mjs \
              test/frontier/agency-labour-performance.test.mjs
