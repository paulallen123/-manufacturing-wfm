name: Release authority posture safety

on:
  push:
    branches:
      - 'autonomy/security-release-authority-posture-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-authority-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted owner push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove fail-closed release-authority logic
        run: |
          node --test scripts/verify-github-release-authority.test.mjs
          node --test scripts/assess-source-bound-deployment.test.mjs

      - name: Verify live GitHub release authority posture
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-release-authority.mjs
