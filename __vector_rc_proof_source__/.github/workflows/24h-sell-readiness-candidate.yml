name: 24h sell-readiness candidate

on:
  push:
    branches:
      - feature/one-day-enterprise-implementation-v1
      - release/24h-sell-readiness-20260918-r1
    paths:
      - '.github/workflows/24h-sell-readiness-candidate.yml'
      - 'implementation/**'
      - 'integration/**'
      - 'learning/**'
      - 'resilience/**'
      - 'scripts/compose-vector-presentation.mjs'
      - 'scripts/current-candidate-role-browser-proof.mjs'
      - 'scripts/current-candidate-role-browser-proof-server.mjs'
      - 'scripts/run-portable-autonomy-proof.mjs'
      - 'scripts/validate-autonomy-*.mjs'
      - 'scripts/validate-support-*.mjs'
      - 'scripts/validate-provider-recovery-handoff.mjs'
      - 'scripts/validate-autonomous-repair-*.mjs'
      - 'scripts/validate-isolated-repair-worker.mjs'
      - 'scripts/validate-independent-repair-verifier.mjs'
      - 'scripts/validate-disposable-staging-gate.mjs'
      - 'scripts/validate-canary-rollback-controller.mjs'
      - 'scripts/validate-ci-provider-failover.mjs'
      - 'scripts/validate-vector-only-ui.mjs'
      - 'ux-overlay/**'
      - 'security/runtime/**'
      - 'operations/runtime/**'
      - 'Dockerfile'
      - 'Dockerfile.current-candidate-role-browser-proof'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-24h-sell-readiness-candidate
  cancel-in-progress: true

jobs:
  prove-and-deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_NO_AUTO_UPDATE: '1'
      TEST_PROJECT_ID: '9cd73309-0ece-4b9a-891f-7daa13d94f0d'
      TEST_ENVIRONMENT_ID: '9e7875b6-e214-4c32-9cee-81235e3d49ff'
      TEST_SERVICE_ID: '8cadddc3-15e9-4c38-a93f-0af829054f29'
      TEST_ORIGIN: 'https://wfm-one-day-enterprise-v1-production.up.railway.app'
      PROOF_PROJECT_ID: '9a774359-37fa-47e8-bde0-932420c32923'
      PROOF_ENVIRONMENT_ID: '6a33f2c1-bedd-46dc-85e7-2ef5d3b54de6'
      PROOF_SERVICE_ID: '2631d462-61bf-4c01-ac4b-e106a562feeb'
      PROOF_ORIGIN: 'https://wfm-integration-fabric-v1-proof-production.up.railway.app'

    steps:
      - name: Checkout exact combined candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Pin exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove implementation integration learning security and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            implementation/runtime/one-day-enterprise-engine.test.cjs \
            implementation/runtime/configuration-inference-engine.test.cjs \
            implementation/runtime/implementation-learning-integration.test.cjs \
            learning/runtime/adaptive-learning-engine.test.cjs \
            integration/runtime/autonomous-integration-hub.test.cjs \
            integration/runtime/directory-oauth-broker.test.cjs \
            integration/worker/directory-discovery-worker.test.cjs \
            security/runtime/hosted-listen-guard.test.cjs \
            operations/runtime/workforce-lifecycle-guard.test.cjs
          node implementation/simulation/one-day-enterprise-simulation.mjs --assert-target

      - name: Prove T0-T4 autonomous support boundary
        run: node scripts/run-portable-autonomy-proof.mjs --strict-runtime

      - name: Prove canonical Vector source contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-vector-only-ui.mjs
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' scripts/compose-vector-presentation.mjs

      - name: Build exact combined staging image
        run: docker build --pull=false -t wfm-24h-candidate:${{ github.sha }} .

      - name: Bind canonical Vector asset bytes to exact image
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create wfm-24h-candidate:${GITHUB_SHA})"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf "$RUNNER_TEMP/vector-built" && mkdir -p "$RUNNER_TEMP/vector-built"
          docker cp "$cid:/app/public/vector-ui.js" "$RUNNER_TEMP/vector-built/vector-ui.js"
          docker cp "$cid:/app/public/vector-ui.css" "$RUNNER_TEMP/vector-built/vector-ui.css"
          docker cp "$cid:/app/public/index.html" "$RUNNER_TEMP/vector-built/index.html"

          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/vector-built/vector-ui.js"
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/vector-built/vector-ui.css"
          grep -F '/vector-ui.js' "$RUNNER_TEMP/vector-built/index.html"
          grep -F '/vector-ui.css' "$RUNNER_TEMP/vector-built/index.html"

          retired=(
            vector-shell.js
            review-ui.js
            review-ui.css
            factory-control-ui.css
            value-cockpit-ui.js
            value-cockpit-ui.css
            ui-evolution.css
          )
          for asset in "${retired[@]}"; do
            ! grep -F "$asset" "$RUNNER_TEMP/vector-built/index.html"
          done

          js_sha="$(sha256sum "$RUNNER_TEMP/vector-built/vector-ui.js" | awk '{print $1}')"
          css_sha="$(sha256sum "$RUNNER_TEMP/vector-built/vector-ui.css" | awk '{print $1}')"
          test -n "$js_sha" && test -n "$css_sha"
          echo "VECTOR_CANONICAL_JS_SHA256=$js_sha" >> "$GITHUB_ENV"
          echo "VECTOR_CANONICAL_CSS_SHA256=$css_sha" >> "$GITHUB_ENV"
          echo "VECTOR_EXACT_IMAGE_ASSET_BINDING=PASS sha=$GITHUB_SHA js=$js_sha css=$css_sha"

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_URL='https://github.com/railwayapp/cli/releases/download/v5.57.8/railway-v5.57.8-x86_64-unknown-linux-gnu.tar.gz'
          CLI_SHA256='43bc4f0385af68cfecaff09efbf5a933a87df728e01d77cb5613c30b74ac3d9d'
          curl --fail --location --silent --show-error "$CLI_URL" -o "$RUNNER_TEMP/railway.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP/railway-cli"
          CLI_BIN="$(find "$RUNNER_TEMP/railway-cli" -type f -name railway -perm -u+x | head -n 1)"
          test -n "$CLI_BIN"
          echo "RAILWAY_BIN=$CLI_BIN" >> "$GITHUB_ENV"
          "$CLI_BIN" --version

      - name: Upload exact candidate to existing one-day service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN is not configured'; exit 1; }
          "$RAILWAY_BIN" up --project "$TEST_PROJECT_ID" --service "$TEST_SERVICE_ID" --environment "$TEST_ENVIRONMENT_ID" --ci

      - name: Prove one-day service serves exact canonical Vector bytes
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error "$TEST_ORIGIN/api/health" > "$RUNNER_TEMP/test-health.json"; then success=1; break; fi
            sleep 4
          done
          test "$success" = 1
          node -e "const h=require(process.env.RUNNER_TEMP+'/test-health.json');if(h.fixtureOnly!==true||h.productionApproved!==false)process.exit(1)"

          curl --fail --silent --show-error "$TEST_ORIGIN/vector-ui.js" > "$RUNNER_TEMP/test-vector-ui.js"
          curl --fail --silent --show-error "$TEST_ORIGIN/vector-ui.css" > "$RUNNER_TEMP/test-vector-ui.css"
          curl --fail --silent --show-error "$TEST_ORIGIN/" > "$RUNNER_TEMP/test-index.html"

          echo "$VECTOR_CANONICAL_JS_SHA256  $RUNNER_TEMP/test-vector-ui.js" | sha256sum -c -
          echo "$VECTOR_CANONICAL_CSS_SHA256  $RUNNER_TEMP/test-vector-ui.css" | sha256sum -c -
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/test-vector-ui.js"
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/test-vector-ui.css"
          grep -F '/vector-ui.js' "$RUNNER_TEMP/test-index.html"
          grep -F '/vector-ui.css' "$RUNNER_TEMP/test-index.html"

          for retired in vector-shell.js review-ui.js review-ui.css factory-control-ui.css value-cockpit-ui.js value-cockpit-ui.css ui-evolution.css; do
            ! grep -F "$retired" "$RUNNER_TEMP/test-index.html"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$TEST_ORIGIN/$retired")"
            case "$status" in
              404|410) ;;
              *) echo "Retired presentation asset unexpectedly served: $retired status=$status" >&2; exit 1 ;;
            esac
          done
          echo 'ONE_DAY_CANONICAL_VECTOR_HOST_BINDING=PASS'

      - name: Prove exact-source canonical Vector browser experience
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN is not configured'; exit 1; }

          vars_file="$(mktemp)"
          chmod 600 "$vars_file"
          trap 'rm -f "$vars_file"; if [ -n "${browser_cid:-}" ]; then docker rm -f "$browser_cid" >/dev/null 2>&1 || true; fi' EXIT
          "$RAILWAY_BIN" variable list \
            --service "$TEST_SERVICE_ID" \
            --environment "$TEST_ENVIRONMENT_ID" \
            --kv > "$vars_file"
          browser_password="$(sed -n 's/^WFM_STAGING_PASSWORD=//p' "$vars_file" | head -n 1)"
          rm -f "$vars_file"
          test "${#browser_password}" -ge 20 || { echo 'Isolated proof password unavailable'; exit 1; }
          echo "::add-mask::$browser_password"

          docker build --pull=false \
            -f Dockerfile.current-candidate-role-browser-proof \
            -t wfm-vector-browser-proof:${GITHUB_SHA} .

          browser_cid="$(docker run -d \
            -e VECTOR_PROOF_URL="$TEST_ORIGIN" \
            -e WFM_EXPECTED_CANDIDATE_SHA="$GITHUB_SHA" \
            -e WFM_STAGING_PASSWORD="$browser_password" \
            -e VECTOR_CANONICAL_JS_SHA256="$VECTOR_CANONICAL_JS_SHA256" \
            -e VECTOR_CANONICAL_CSS_SHA256="$VECTOR_CANONICAL_CSS_SHA256" \
            -e WFM_REQUIRE_VECTOR_ASSET_DIGESTS=true \
            -e WFM_REQUIRE_ACTION_AFFORDANCE_COVERAGE=false \
            wfm-vector-browser-proof:${GITHUB_SHA})"

          browser_pass=0
          for attempt in $(seq 1 150); do
            browser_logs="$(docker logs "$browser_cid" 2>&1 || true)"
            if grep -Fq 'BROWSER_PROOF_SERVER=FAIL' <<<"$browser_logs"; then
              printf '%s\n' "$browser_logs"
              exit 1
            fi
            if grep -Fq 'BROWSER_PROOF_SERVER=PASS' <<<"$browser_logs"; then
              browser_pass=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$browser_cid" 2>/dev/null || echo false)" != 'true' ]; then
              printf '%s\n' "$browser_logs"
              echo 'Canonical browser proof container stopped before PASS' >&2
              exit 1
            fi
            sleep 2
          done
          test "$browser_pass" = 1 || { docker logs "$browser_cid" 2>&1 || true; echo 'Canonical browser proof timed out' >&2; exit 1; }

          docker logs "$browser_cid" > "$RUNNER_TEMP/vector-browser-proof.log" 2>&1
          grep -F 'BROWSER_PROOF_ASSET_BINDING=BOUND' "$RUNNER_TEMP/vector-browser-proof.log"
          grep -F 'CURRENT_CANDIDATE_ROLE_BROWSER_MATRIX=PASS' "$RUNNER_TEMP/vector-browser-proof.log"
          grep -F 'CURRENT_ACTION_QUEUE_GROUPING=PASS' "$RUNNER_TEMP/vector-browser-proof.log"
          echo 'VECTOR_STRICT_BROWSER_ASSET_IDENTITY=PASS'

      - name: Upload exact candidate to existing integration proof service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          "$RAILWAY_BIN" up --project "$PROOF_PROJECT_ID" --service "$PROOF_SERVICE_ID" --environment "$PROOF_ENVIRONMENT_ID" --ci

      - name: Prove integration service serves exact canonical Vector bytes
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error "$PROOF_ORIGIN/api/health" > "$RUNNER_TEMP/proof-health.json"; then success=1; break; fi
            sleep 4
          done
          test "$success" = 1
          node -e "const h=require(process.env.RUNNER_TEMP+'/proof-health.json');if(h.fixtureOnly!==true||h.productionApproved!==false)process.exit(1)"

          curl --fail --silent --show-error "$PROOF_ORIGIN/vector-ui.js" > "$RUNNER_TEMP/proof-vector-ui.js"
          curl --fail --silent --show-error "$PROOF_ORIGIN/vector-ui.css" > "$RUNNER_TEMP/proof-vector-ui.css"
          curl --fail --silent --show-error "$PROOF_ORIGIN/" > "$RUNNER_TEMP/proof-index.html"

          echo "$VECTOR_CANONICAL_JS_SHA256  $RUNNER_TEMP/proof-vector-ui.js" | sha256sum -c -
          echo "$VECTOR_CANONICAL_CSS_SHA256  $RUNNER_TEMP/proof-vector-ui.css" | sha256sum -c -
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/proof-vector-ui.js"
          grep -F 'VECTOR_WORKFORCE_OPERATIONS_APPROVED_V1' "$RUNNER_TEMP/proof-vector-ui.css"
          grep -F '/vector-ui.js' "$RUNNER_TEMP/proof-index.html"
          grep -F '/vector-ui.css' "$RUNNER_TEMP/proof-index.html"

          for retired in vector-shell.js review-ui.js review-ui.css factory-control-ui.css value-cockpit-ui.js value-cockpit-ui.css ui-evolution.css; do
            ! grep -F "$retired" "$RUNNER_TEMP/proof-index.html"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PROOF_ORIGIN/$retired")"
            case "$status" in
              404|410) ;;
              *) echo "Retired presentation asset unexpectedly served: $retired status=$status" >&2; exit 1 ;;
            esac
          done
          echo 'INTEGRATION_CANONICAL_VECTOR_HOST_BINDING=PASS'

      - name: Publish machine-readable proof receipt
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt={
            generatedAt:new Date().toISOString(),
            sha:process.env.GITHUB_SHA,
            branch:process.env.GITHUB_REF_NAME,
            candidate:'one-day + autonomous integration + adaptive learning + canonical Vector role-first UX + T0-T4 support',
            vectorAssetDigests:{
              js:process.env.VECTOR_CANONICAL_JS_SHA256||null,
              css:process.env.VECTOR_CANONICAL_CSS_SHA256||null
            },
            browserProof:{
              exactVectorAssetIdentityRequired:true,
              actionAffordanceCoverageRequired:false
            },
            productionMutation:false,
            frozenCustomerProofMutation:false,
            targetServices:['wfm-one-day-enterprise-v1','wfm-integration-fabric-v1-proof'],
            note:'A successful workflow proves exact source-to-host Vector asset identity plus the existing role/responsive browser matrix. Review/View status lifecycle affordances remain a separate explicit gate until authoritative source rows exercise both states.'
          };
          fs.writeFileSync('24h-sell-readiness-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wfm-24h-sell-readiness-receipts
          path: |
            24h-sell-readiness-receipt.json
            portable-autonomy-proof.json
            ${{ runner.temp }}/vector-browser-proof.log
          if-no-files-found: warn
          retention-days: 14
