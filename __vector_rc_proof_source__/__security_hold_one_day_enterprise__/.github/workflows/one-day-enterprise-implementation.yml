name: One-Day Enterprise Implementation

on:
  push:
    branches:
      - 'feature/one-day-enterprise-implementation-v1'
    paths:
      - 'implementation/**'
      - 'learning/**'
      - 'security/runtime/bootstrap.cjs'
      - 'Dockerfile'
      - '.github/workflows/one-day-enterprise-implementation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-day-enterprise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run implementation control-plane tests
        run: node --test implementation/runtime/one-day-enterprise-engine.test.cjs

      - name: Run adaptive competence tests
        run: node --test learning/runtime/adaptive-learning-engine.test.cjs

      - name: Prove implementation readiness is bound to real competence
        run: node --test implementation/runtime/implementation-learning-integration.test.cjs

      - name: Reproduce one-day architecture timing theory
        run: node implementation/simulation/one-day-enterprise-simulation.mjs --assert-target

      - name: Build exact staging image
        run: docker build --pull=false -t wfm-one-day-enterprise:${{ github.sha }} .
