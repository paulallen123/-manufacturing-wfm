version: 2.1

commands:
  require_frozen_candidate:
    steps:
      - run:
          name: Admit explicit frozen candidate only
          command: bash scripts/require-frozen-candidate.sh

jobs:
  forge_integration_validation:
    docker:
      - image: cimg/node:22.23.2
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate exact ordinary integration source without freeze gating
          command: |
            set -euo pipefail
            test "$(node --version)" = "v22.23.2"
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1}"
            mkdir -p circleci-artifacts/ordinary-integration
            printf '%s\n' "$CIRCLE_SHA1" > circleci-artifacts/ordinary-integration/source-sha.txt
            node --version > circleci-artifacts/ordinary-integration/node-version.txt
            git ls-files --stage -- .circleci/config.yml scripts/run-forge-ci.mjs scripts/require-frozen-candidate.sh scripts/require-frozen-candidate.test.mjs > circleci-artifacts/ordinary-integration/git-blobs.txt
            node --test scripts/require-frozen-candidate.test.mjs 2>&1 | tee circleci-artifacts/ordinary-integration/admission-tests.tap
            node scripts/run-forge-ci.mjs 2>&1 | tee circleci-artifacts/ordinary-integration/source-validation.log
      - store_artifacts:
          path: circleci-artifacts/ordinary-integration
          destination: ordinary-integration-proof

  forge_core_validation:
    docker:
      - image: cimg/node:22.23.2
    resource_class: small
    steps:
      - checkout
      - require_frozen_candidate
      - run:
          name: Verify exact Node runtime
          command: test "$(node --version)" = "v22.23.2"
      - run:
          name: Verify isolated signed proof client source contract
          command: |
            set -euo pipefail
            mkdir -p circleci-artifacts
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1}"
            printf '%s\n' "$CIRCLE_SHA1" > circleci-artifacts/auth-client-source-sha.txt
            node --version > circleci-artifacts/auth-client-node-version.txt
            require_exact_regression_test() {
              local file=$1 expected=$2 entry mode prefix part
              local -a components
              entry=$(git --literal-pathspecs ls-tree HEAD -- "$file")
              [[ "$entry" == "100644 blob $expected"$'\t'"$file" ]] || {
                printf 'Required test HEAD entry mismatch: %s\n' "$file" >&2; return 1;
              }
              entry=$(git --literal-pathspecs ls-files --stage -- "$file")
              [[ "$entry" == "100644 $expected 0"$'\t'"$file" ]] || {
                printf 'Required test index entry mismatch: %s\n' "$file" >&2; return 1;
              }
              IFS=/ read -r -a components <<< "$file"
              prefix=
              for part in "${components[@]}"; do
                prefix="${prefix:+$prefix/}$part"
                [[ ! -L "$prefix" ]] || {
                  printf 'Required test path contains symlink: %s\n' "$prefix" >&2; return 1;
                }
              done
              [[ -f "$file" ]] || {
                printf 'Required test is not a present regular file: %s\n' "$file" >&2; return 1;
              }
              mode=$(stat -c '%a' -- "$file")
              (( (8#$mode & 8#111) == 0 )) || {
                printf 'Required test has executable mode: %s\n' "$file" >&2; return 1;
              }
              [[ "$(git hash-object --no-filters -- "$file")" == "$expected" ]] || {
                printf 'Required test working-tree blob mismatch: %s\n' "$file" >&2; return 1;
              }
              git --literal-pathspecs diff --no-ext-diff --quiet HEAD -- "$file" || {
                printf 'Required test is dirty: %s\n' "$file" >&2; return 1;
              }
              printf '100644 %s 0\t%s\n' "$expected" "$file"
            }
            {
              require_exact_regression_test docs/execution/proof-runner-activation/dependency-security.test.cjs dd9dff48d2ac4a4e753f9b6477c75634233bea56
              require_exact_regression_test reporting/runtime/vector-reporting-create-audit-atomicity.test.cjs abc6f4e57f0e6c55a5633c93328b167c227614a3
              require_exact_regression_test reporting/runtime/vector-reporting-version-audit-atomicity.test.cjs 17cc738ebb972d86e880a3ab21d755e91cf41b7a
              require_exact_regression_test reporting/runtime/vector-reporting-mutation-audit-atomicity.test.cjs e30653870986f20edaf04ff62f9e6d93a5575abd
              require_exact_regression_test reporting/runtime/vector-reporting-persisted-no-adapter.test.cjs b5ff75774c65e2bc0c2ee53a00921dc4713b016f
              require_exact_regression_test reporting/runtime/vector-reporting-resume-no-adapter.test.cjs 2e97fc52267da6aa7e9500a78f8ed850b0e7f8a2
            } > circleci-artifacts/required-regression-test-git-blobs.txt
            cat circleci-artifacts/required-regression-test-git-blobs.txt
            git ls-files --stage -- scripts/require-frozen-candidate.sh scripts/require-frozen-candidate.test.mjs > circleci-artifacts/frozen-candidate-gate-git-blobs.txt
            git ls-files --stage -- .circleci/config.yml artifact/vector-proof-freeze.trigger Dockerfile.current-candidate-role-browser-proof scripts/current-candidate-role-browser-proof.mjs scripts/current-candidate-role-browser-proof.auth.test.mjs scripts/current-candidate-role-browser-proof-server.mjs scripts/current-candidate-role-browser-proof-server.test.mjs scripts/vector-proof-result.mjs security/runtime/proof-runner-auth.cjs security/runtime/proof-runner-auth.test.cjs security/runtime/identity-survival-guard.cjs security/runtime/identity-survival-guard.test.cjs security/runtime/runtime-identity.cjs security/runtime/runtime-identity.test.cjs security/runtime/bootstrap.cjs security/runtime/bootstrap-proof-runner-wiring.test.cjs implementation/runtime/readiness-evidence-contract.cjs implementation/runtime/one-day-enterprise-engine-core.cjs implementation/runtime/one-day-enterprise-engine.test.cjs scripts/run-forge-ci.mjs > circleci-artifacts/auth-client-git-blobs.txt
            git ls-files --stage -- docs/execution/proof-runner-activation/README.md docs/execution/proof-runner-activation/launcher.cjs docs/execution/proof-runner-activation/prepare.cjs docs/execution/proof-runner-activation/launcher.test.cjs docs/execution/proof-runner-activation/preflight.test.cjs docs/execution/proof-runner-activation/child-environment.test.cjs docs/execution/proof-runner-activation/dependency-security.test.cjs docs/execution/proof-runner-activation/source-binding.test.cjs docs/execution/proof-runner-activation/published-source.test-fixture.cjs docs/execution/proof-runner-activation/generated/bundle.json docs/execution/proof-runner-activation/generated/manifest.json docs/execution/proof-runner-activation/generated/start-command.txt scripts/current-candidate-role-browser-proof.environment.test.mjs > circleci-artifacts/cp001-unpublished-runner-git-blobs.txt
            git ls-files --stage -- reporting/runtime/vector-reporting-service.cjs reporting/runtime/vector-reporting-create-audit-atomicity.test.cjs reporting/runtime/vector-reporting-version-audit-atomicity.test.cjs reporting/runtime/vector-reporting-mutation-audit-atomicity.test.cjs > circleci-artifacts/reporting-audit-git-blobs.txt
            node --test \
              scripts/require-frozen-candidate.test.mjs \
              docs/execution/proof-runner-activation/launcher.test.cjs \
              docs/execution/proof-runner-activation/preflight.test.cjs \
              docs/execution/proof-runner-activation/child-environment.test.cjs \
              docs/execution/proof-runner-activation/dependency-security.test.cjs \
              docs/execution/proof-runner-activation/source-binding.test.cjs \
              scripts/current-candidate-role-browser-proof.environment.test.mjs \
              scripts/current-candidate-role-browser-proof.auth.test.mjs \
              security/runtime/proof-runner-auth.test.cjs \
              security/runtime/identity-survival-guard.test.cjs \
              security/runtime/runtime-identity.test.cjs \
              security/runtime/bootstrap-proof-runner-wiring.test.cjs \
              scripts/current-candidate-role-browser-proof-server.test.mjs \
              reporting/runtime/vector-reporting-create-audit-atomicity.test.cjs \
              reporting/runtime/vector-reporting-version-audit-atomicity.test.cjs \
              reporting/runtime/vector-reporting-mutation-audit-atomicity.test.cjs \
              2>&1 | tee circleci-artifacts/auth-client-tests.tap
      - run:
          name: Current FORGE source validation
          command: node scripts/run-forge-ci.mjs
      - run:
          name: Collect source proof receipts
          when: always
          command: |
            mkdir -p circleci-artifacts
            cp *-proof.json circleci-artifacts/ 2>/dev/null || true
      - store_artifacts:
          path: circleci-artifacts
          destination: forge-source-proof

  forge_runtime_validation:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - require_frozen_candidate
      - run:
          name: Build exact FORGE runtime candidate
          command: |
            set -euo pipefail
            mkdir -p /tmp/circleci-runtime-artifacts/staffology
            docker build --pull=false --progress=plain --target staffology-proof-evidence --build-arg RAILWAY_GIT_COMMIT_SHA="${CIRCLE_SHA1}" --output "type=local,dest=/tmp/circleci-runtime-artifacts/staffology" . 2>&1 | tee /tmp/circleci-runtime-artifacts/staffology-proof-build.log
            docker build --pull=false --progress=plain --build-arg RAILWAY_GIT_COMMIT_SHA="${CIRCLE_SHA1}" -t "vector-forge-ci:${CIRCLE_SHA1}" . 2>&1 | tee /tmp/circleci-runtime-artifacts/runtime-image-build.log
      - run:
          name: Verify exact proof client image module packaging
          command: |
            set -euo pipefail
            mkdir -p /tmp/circleci-runtime-artifacts
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1}"
            printf '%s\n' "$CIRCLE_SHA1" > /tmp/circleci-runtime-artifacts/auth-client-source-sha.txt
            git ls-files --stage -- Dockerfile.current-candidate-role-browser-proof scripts/current-candidate-role-browser-proof.mjs scripts/current-candidate-role-browser-proof-server.mjs scripts/vector-proof-result.mjs security/runtime/proof-runner-auth.cjs > /tmp/circleci-runtime-artifacts/auth-client-git-blobs.txt
            AUTH_IMAGE="vector-role-auth-ci:${CIRCLE_SHA1}"
            docker build --pull=false --progress=plain -f Dockerfile.current-candidate-role-browser-proof -t "$AUTH_IMAGE" . 2>&1 | tee /tmp/circleci-runtime-artifacts/auth-client-image-build.log
            docker image inspect "$AUTH_IMAGE" > /tmp/circleci-runtime-artifacts/auth-client-image-inspect.json
            docker run --rm --network=none --entrypoint node "$AUTH_IMAGE" --version 2>&1 | tee /tmp/circleci-runtime-artifacts/auth-client-image-node-version.txt
            docker run --rm --network=none --entrypoint node \
              -e PROOF_SOURCE_SHA="${CIRCLE_SHA1}" \
              -e PROOF_CLIENT_BLOB="$(git rev-parse HEAD:scripts/current-candidate-role-browser-proof.mjs)" \
              -e PROOF_WRAPPER_BLOB="$(git rev-parse HEAD:scripts/current-candidate-role-browser-proof-server.mjs)" \
              -e PROOF_RESULT_BLOB="$(git rev-parse HEAD:scripts/vector-proof-result.mjs)" \
              -e PROOF_AUTH_BLOB="$(git rev-parse HEAD:security/runtime/proof-runner-auth.cjs)" \
              "$AUTH_IMAGE" --input-type=module -e '
                import assert from "node:assert/strict";
                import { readFileSync } from "node:fs";
                import { createHash } from "node:crypto";
                import { DatabaseSync } from "node:sqlite";
                import auth from "/proof/security/runtime/proof-runner-auth.cjs";
                const files = [
                  ["scripts/current-candidate-role-browser-proof.mjs", "PROOF_CLIENT_BLOB"],
                  ["scripts/current-candidate-role-browser-proof-server.mjs", "PROOF_WRAPPER_BLOB"],
                  ["scripts/vector-proof-result.mjs", "PROOF_RESULT_BLOB"],
                  ["security/runtime/proof-runner-auth.cjs", "PROOF_AUTH_BLOB"]
                ];
                const modules = files.map(([file, binding]) => {
                  const bytes = readFileSync("/proof/" + file);
                  const blob = createHash("sha1").update(Buffer.from("blob " + bytes.length + "\0")).update(bytes).digest("hex");
                  assert.equal(blob, process.env[binding], "Copied source mismatch: " + file);
                  return { path: file, blob };
                });
                assert.equal(auth.PROOF_RUNNER_PATH, "/api/proof-runner/session");
                assert.equal(auth.canonicalAssertion({ email: "Fixture@fixture.invalid", origin: "https://fixture.invalid/", nonce: "module-smoke", issuedAt: 1, expiresAt: 2 }), ["VECTOR_PROOF_RUNNER_V1", "wfm-proof-runner", "wfm-proof-session", "fixture@fixture.invalid", "https://fixture.invalid", "module-smoke", "1", "2"].join("\n"));
                const db = new DatabaseSync(":memory:");
                assert.equal(db.prepare("SELECT 1 AS available").get().available, 1);
                db.close();
                console.log(JSON.stringify({ scope: "PACKAGING_MODULE_SMOKE_ONLY", checkoutSourceSha: process.env.PROOF_SOURCE_SHA, node: process.version, modules, sqliteAvailable: true, signedSessionExecuted: false, chromiumExecuted: false, hostedProof: false }));
              ' 2>&1 | tee /tmp/circleci-runtime-artifacts/auth-client-module-smoke.log
      - run:
          name: Verify runtime security boundary
          command: |
            set -euo pipefail
            IMAGE="vector-forge-ci:${CIRCLE_SHA1}"
            test "$(docker run --rm --entrypoint node "$IMAGE" --version)" = "v22.23.2"
            test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "root"
            test "$(docker inspect --format '{{json .Config.Entrypoint}}' "$IMAGE")" = '["/usr/local/bin/vector-entrypoint.sh"]'
            docker run --rm --entrypoint sh "$IMAGE" -ec '
              test ! -e /usr/local/lib/node_modules/npm
              test ! -e /usr/local/lib/node_modules/corepack
              for p in npm npx corepack yarn yarnpkg pnpm pnpx; do
                if command -v "$p" >/dev/null 2>&1; then
                  echo "Unexpected package manager in final runtime: $p" >&2
                  exit 1
                fi
              done
            '
            if docker run --rm -e NODE_ENV=production --entrypoint node "$IMAGE" /app/server.cjs >production-refusal.log 2>&1; then
              echo 'ERROR: staging candidate unexpectedly started in production mode' >&2
              cat production-refusal.log >&2
              exit 1
            fi
            grep -q 'cannot run as production' production-refusal.log
      - run:
          name: Prove isolated hosted HTTP boundary
          command: |
            set -euo pipefail
            IMAGE="vector-forge-ci:${CIRCLE_SHA1}"
            CI_PASSWORD="CI-$(openssl rand -hex 16)"
            DIAGNOSTICS=/tmp/hosted-http-diagnostics.log
            : > "$DIAGNOSTICS"
            passed() { printf 'HOSTED_HTTP_ASSERTION=PASS check=%s\n' "$1" | tee -a "$DIAGNOSTICS"; }
            docker run -d --name vector-forge-proof -p 3000:3000               -e PORT=3000               -e NODE_ENV=staging               -e NODE_OPTIONS=--experimental-sqlite               -e WFM_HOSTED_STAGING=true               -e WFM_CANDIDATE_SHA="${CIRCLE_SHA1}"               -e WFM_PUBLIC_ORIGIN=https://vector-forge-ci.invalid               -e WFM_DB=/tmp/vector-forge-proof.sqlite               -e WFM_STAGING_PASSWORD="$CI_PASSWORD"               "$IMAGE"
            proxy_curl() {
              curl -fsS -H 'Host: vector-forge-ci.invalid' -H 'X-Forwarded-Proto: https' "$@"
            }
            deadline=$((SECONDS+60))
            until proxy_curl http://127.0.0.1:3000/api/health >/tmp/health.json; do
              if (( SECONDS >= deadline )); then
                echo 'Runtime did not become healthy before the readiness deadline.' >&2
                docker logs vector-forge-proof >&2 || true
                exit 1
              fi
              sleep 0.25
            done
            passed health-ready
            proxy_curl http://127.0.0.1:3000/api/health
            proxy_curl -D /tmp/runtime-identity.headers http://127.0.0.1:3000/api/runtime-identity >/tmp/runtime-identity.json
            node -e 'const fs=require("fs");const body=JSON.parse(fs.readFileSync("/tmp/runtime-identity.json","utf8"));if(body.candidateSha!==process.env.CIRCLE_SHA1||body.sourceBinding!=="build-file-matched")throw Error("RUNTIME_IDENTITY_NOT_BUILD_FILE_MATCHED")'
            grep -iq "^x-wfm-source-sha: ${CIRCLE_SHA1}" /tmp/runtime-identity.headers
            grep -iq '^x-wfm-source-binding: build-file-matched' /tmp/runtime-identity.headers
            passed runtime-identity-build-file-matched
            proxy_curl http://127.0.0.1:3000/ >/dev/null
            passed root-page
            status=$(curl -sS -o /tmp/bootstrap-unauth.json -w '%{http_code}'               -H 'Host: vector-forge-ci.invalid'               -H 'X-Forwarded-Proto: https'               http://127.0.0.1:3000/api/bootstrap)
            test "$status" = "401"
            passed bootstrap-unauthenticated-401
            docker exec vector-forge-proof cat /proc/1/status | bash scripts/verify-runtime-process-uid.sh | tee -a "$DIAGNOSTICS"
            curl -sS -o /tmp/demand-unauth.json -w '%{http_code}'               -H 'Host: vector-forge-ci.invalid'               -H 'X-Forwarded-Proto: https'               http://127.0.0.1:3000/api/operations/intelligence/summary               | grep -qx '401'
            passed demand-unauthenticated-401
      - run:
          name: Capture exact runtime proof
          when: always
          command: |
            mkdir -p /tmp/circleci-runtime-artifacts
            docker logs vector-forge-proof >/tmp/circleci-runtime-artifacts/vector-forge-proof.log 2>&1 || true
            cp production-refusal.log /tmp/circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/health.json /tmp/circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/runtime-identity.json /tmp/runtime-identity.headers /tmp/circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/hosted-http-diagnostics.log /tmp/circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/bootstrap-unauth.json /tmp/circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/demand-unauth.json /tmp/circleci-runtime-artifacts/ 2>/dev/null || true
            printf '%s\n' "$CIRCLE_SHA1" > /tmp/circleci-runtime-artifacts/source-sha.txt
            docker inspect --format '{{.Image}}' vector-forge-proof > /tmp/circleci-runtime-artifacts/runtime-container-image-id.txt 2>/dev/null || true
            docker inspect "vector-forge-ci:${CIRCLE_SHA1}" > /tmp/circleci-runtime-artifacts/image-inspect.json 2>/dev/null || true
      - run:
          name: Bind mandatory runtime artifact manifest
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1}"
            node scripts/runtime-artifact-manifest.mjs /tmp/circleci-runtime-artifacts "${CIRCLE_SHA1}"
      - run:
          name: Clean up proof container
          when: always
          command: docker rm -f vector-forge-proof >/dev/null 2>&1 || true
      - store_artifacts:
          path: /tmp/circleci-runtime-artifacts
          destination: forge-runtime-proof

workflows:
  vector_forge_proof:
    when: false
    jobs:
      - forge_integration_validation
      - forge_core_validation
      - forge_runtime_validation:
          requires:
            - forge_core_validation
          filters:
            branches:
              only:
                - /feature\/vector-.*/
                - /release\/.*/
                - /staging\/.*/
                - /review\/staffology-.*/
                - test/vector-empty-organisation-regression-20261020
            tags:
              ignore: /.*/
