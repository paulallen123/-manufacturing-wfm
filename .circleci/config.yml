version: 2.1

jobs:
  forge_core_validation:
    docker:
      - image: cimg/node:22.23.2
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify exact Node runtime
          command: test "$(node --version)" = "v22.23.2"
      - run:
          name: Validate branch drift budget
          command: |
            set -euo pipefail
            git fetch --no-tags origin feature/vector-eow-convergence-20260925:refs/remotes/origin/feature/vector-eow-convergence-20260925
            node scripts/validate-branch-drift-budget.mjs --base origin/feature/vector-eow-convergence-20260925 --head HEAD --warn-behind 5 --max-behind 10
      - run:
          name: Bind exact candidate identity
          command: node scripts/generate-vector-candidate-identity.mjs
      - run:
          name: Current FORGE source validation
          command: node scripts/run-forge-ci.mjs
      - run:
          name: Collect source proof receipts
          when: always
          command: |
            mkdir -p circleci-artifacts
            cp *-proof.json circleci-artifacts/ 2>/dev/null || true
            cp candidate-identity.json blocker-preflight-report.json circleci-artifacts/ 2>/dev/null || true
      - store_artifacts:
          path: circleci-artifacts
          destination: forge-source-proof

  forge_runtime_validation:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build exact FORGE runtime candidate
          command: |
            set -euo pipefail
            docker build --pull=false -t "vector-forge-ci:${CIRCLE_SHA1}" .
      - run:
          name: Verify runtime security boundary
          command: |
            set -euo pipefail
            IMAGE="vector-forge-ci:${CIRCLE_SHA1}"
            test "$(docker run --rm --entrypoint node "$IMAGE" --version)" = "v22.23.2"
            test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "node"
            docker run --rm --entrypoint sh "$IMAGE" -ec '
              test ! -e /usr/local/lib/node_modules/npm
              test ! -e /usr/local/lib/node_modules/corepack
              for p in npm npx corepack yarn yarnpkg pnpm pnpx; do
                if command -v "$p" >/dev/null 2>&1; then
                  echo "Unexpected package manager in final runtime: $p" >&2
                  exit 1
                fi
              done
            '
            if docker run --rm -e NODE_ENV=production --entrypoint node "$IMAGE" /app/server.cjs >production-refusal.log 2>&1; then
              echo 'ERROR: staging candidate unexpectedly started in production mode' >&2
              cat production-refusal.log >&2
              exit 1
            fi
            grep -q 'cannot run as production' production-refusal.log
      - run:
          name: Prove isolated hosted HTTP boundary
          command: |
            set -euo pipefail
            IMAGE="vector-forge-ci:${CIRCLE_SHA1}"
            CI_PASSWORD="CI-$(openssl rand -hex 16)"
            docker run -d --name vector-forge-proof -p 3000:3000               -e PORT=3000               -e NODE_ENV=staging               -e NODE_OPTIONS=--experimental-sqlite               -e WFM_HOSTED_STAGING=true               -e WFM_PUBLIC_ORIGIN=https://vector-forge-ci.invalid               -e WFM_DB=/tmp/vector-forge-proof.sqlite               -e WFM_STAGING_PASSWORD="$CI_PASSWORD"               "$IMAGE"
            proxy_curl() {
              curl -fsS -H 'Host: vector-forge-ci.invalid' -H 'X-Forwarded-Proto: https' "$@"
            }
            for i in $(seq 1 30); do
              if proxy_curl http://127.0.0.1:3000/api/health >/tmp/health.json; then
                break
              fi
              sleep 1
            done
            proxy_curl http://127.0.0.1:3000/api/health
            proxy_curl http://127.0.0.1:3000/ >/dev/null
            status=$(curl -sS -o /tmp/bootstrap-unauth.json -w '%{http_code}'               -H 'Host: vector-forge-ci.invalid'               -H 'X-Forwarded-Proto: https'               http://127.0.0.1:3000/api/bootstrap)
            test "$status" = "401"
            test "$(docker exec vector-forge-proof id -u)" != "0"
            curl -sS -o /tmp/demand-unauth.json -w '%{http_code}'               -H 'Host: vector-forge-ci.invalid'               -H 'X-Forwarded-Proto: https'               http://127.0.0.1:3000/api/operations/intelligence/summary               | grep -qx '401'
      - run:
          name: Capture exact runtime proof
          when: always
          command: |
            mkdir -p circleci-runtime-artifacts
            docker logs vector-forge-proof >circleci-runtime-artifacts/vector-forge-proof.log 2>&1 || true
            cp production-refusal.log circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/health.json circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/bootstrap-unauth.json circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/demand-unauth.json circleci-runtime-artifacts/ 2>/dev/null || true
            printf '%s
' "$CIRCLE_SHA1" > circleci-runtime-artifacts/source-sha.txt
            docker inspect "vector-forge-ci:${CIRCLE_SHA1}" > circleci-runtime-artifacts/image-inspect.json 2>/dev/null || true
      - run:
          name: Clean up proof container
          when: always
          command: docker rm -f vector-forge-proof >/dev/null 2>&1 || true
      - store_artifacts:
          path: circleci-runtime-artifacts
          destination: forge-runtime-proof

workflows:
  vector_forge_proof:
    jobs:
      - forge_core_validation
      - forge_runtime_validation:
          requires:
            - forge_core_validation
          filters:
            branches:
              only:
                - /feature\/vector-.*/
                - /release\/.*/
                - /staging\/.*/
            tags:
              ignore: /.*/
