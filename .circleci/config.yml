version: 2.1

jobs:
  core_validation:
    docker:
      - image: cimg/node:22.23.2
    resource_class: small
    steps:
      - checkout

      - run:
          name: Verify exact CI Node runtime
          command: test "$(node --version)" = "v22.23.2"

      - run:
          name: Consolidated core validation
          command: node scripts/run-zero-cost-ci.mjs

      - run:
          name: Verify sealed customer-proof archive
          command: tar -tzf artifact/wfm-0.6.76-hosted-staging-rc1.tar.gz >/dev/null

      - run:
          name: Collect proof receipts
          when: always
          command: |
            mkdir -p circleci-artifacts
            cp *-proof.json circleci-artifacts/ 2>/dev/null || true
            cp zero-cost-ci-metrics.json circleci-artifacts/ 2>/dev/null || true

      - store_artifacts:
          path: circleci-artifacts
          destination: core-proof-receipts

  release_runtime_validation:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Build exact runtime candidate
          command: |
            set -euo pipefail
            docker build --pull=false -t "wfm-zero-cost-ci:${CIRCLE_SHA1}" .

      - run:
          name: Verify runtime security boundary
          command: |
            set -euo pipefail
            IMAGE="wfm-zero-cost-ci:${CIRCLE_SHA1}"

            test "$(docker run --rm --entrypoint node "$IMAGE" --version)" = "v22.23.2"
            test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "node"

            docker run --rm --entrypoint sh "$IMAGE" -ec '
              test ! -e /usr/local/lib/node_modules/npm
              test ! -e /usr/local/lib/node_modules/corepack
              for p in npm npx corepack yarn yarnpkg pnpm pnpx; do
                if command -v "$p" >/dev/null 2>&1; then
                  echo "Unexpected package manager in final runtime: $p" >&2
                  exit 1
                fi
              done
            '

            if docker run --rm -e NODE_ENV=production --entrypoint node "$IMAGE" /app/server.cjs >production-refusal.log 2>&1; then
              echo 'ERROR: staging candidate unexpectedly started in production mode' >&2
              cat production-refusal.log >&2
              exit 1
            fi
            grep -q 'cannot run as production' production-refusal.log

      - run:
          name: Prove isolated customer HTTP boundary
          command: |
            set -euo pipefail
            IMAGE="wfm-zero-cost-ci:${CIRCLE_SHA1}"
            CI_PASSWORD="CI-$(openssl rand -hex 16)"

            docker run -d --name wfm-proof -p 3000:3000 \
              -e PORT=3000 \
              -e NODE_ENV=staging \
              -e NODE_OPTIONS=--experimental-sqlite \
              -e WFM_HOSTED_STAGING=true \
              -e WFM_PUBLIC_ORIGIN=https://wfm-ci.invalid \
              -e WFM_DB=/tmp/wfm-proof.sqlite \
              -e WFM_STAGING_PASSWORD="$CI_PASSWORD" \
              "$IMAGE"

            proxy_curl() {
              curl -fsS -H 'Host: wfm-ci.invalid' -H 'X-Forwarded-Proto: https' "$@"
            }

            for i in $(seq 1 30); do
              if proxy_curl http://127.0.0.1:3000/api/health >/tmp/health.json; then
                break
              fi
              sleep 1
            done

            proxy_curl http://127.0.0.1:3000/api/health
            proxy_curl http://127.0.0.1:3000/ >/dev/null
            proxy_curl http://127.0.0.1:3000/kiosk.html >/dev/null

            status=$(curl -sS -o /tmp/bootstrap-unauth.json -w '%{http_code}' \
              -H 'Host: wfm-ci.invalid' \
              -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:3000/api/bootstrap)
            test "$status" = "401"
            test "$(docker exec wfm-proof id -u)" != "0"

      - run:
          name: Capture runtime proof
          when: always
          command: |
            mkdir -p circleci-runtime-artifacts
            docker logs wfm-proof >circleci-runtime-artifacts/wfm-proof.log 2>&1 || true
            cp production-refusal.log circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/health.json circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/bootstrap-unauth.json circleci-runtime-artifacts/ 2>/dev/null || true

      - run:
          name: Clean up proof container
          when: always
          command: docker rm -f wfm-proof >/dev/null 2>&1 || true

      - store_artifacts:
          path: circleci-runtime-artifacts
          destination: runtime-proof

workflows:
  zero_cost_ci:
    jobs:
      - core_validation

      - release_runtime_validation:
          requires:
            - core_validation
          filters:
            branches:
              only:
                - main
                - /release\/.*/
                - /staging\/.*/
            tags:
              ignore: /.*/
