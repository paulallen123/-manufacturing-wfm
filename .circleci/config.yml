version: 2.1

commands:
  require_frozen_candidate:
    steps:
      - run:
          name: Admit explicit frozen candidate only
          command: |
            if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- artifact/vector-proof-freeze.trigger; then
              echo 'No frozen-candidate trigger change; halting heavy proof without marking product failure.'
              circleci-agent step halt
            fi

jobs:
  forge_core_validation:
    docker:
      - image: cimg/node:22.23.2
    resource_class: small
    steps:
      - checkout
      - require_frozen_candidate
      - run:
          name: Verify exact Node runtime
          command: test "$(node --version)" = "v22.23.2"
      - run:
          name: Current FORGE source validation
          command: node scripts/run-forge-ci.mjs
      - run:
          name: Collect source proof receipts
          when: always
          command: |
            mkdir -p circleci-artifacts
            cp *-proof.json circleci-artifacts/ 2>/dev/null || true
      - store_artifacts:
          path: circleci-artifacts
          destination: forge-source-proof

  forge_runtime_validation:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - require_frozen_candidate
      - run:
          name: Build exact FORGE runtime candidate
          command: |
            set -euo pipefail
            mkdir -p circleci-runtime-artifacts/staffology
            docker build --pull=false --progress=plain --target staffology-proof-evidence --build-arg RAILWAY_GIT_COMMIT_SHA="${CIRCLE_SHA1}" --output "type=local,dest=circleci-runtime-artifacts/staffology" . 2>&1 | tee circleci-runtime-artifacts/staffology-proof-build.log
            docker build --pull=false --progress=plain --build-arg RAILWAY_GIT_COMMIT_SHA="${CIRCLE_SHA1}" -t "vector-forge-ci:${CIRCLE_SHA1}" . 2>&1 | tee circleci-runtime-artifacts/runtime-image-build.log
      - run:
          name: Verify runtime security boundary
          command: |
            set -euo pipefail
            IMAGE="vector-forge-ci:${CIRCLE_SHA1}"
            test "$(docker run --rm --entrypoint node "$IMAGE" --version)" = "v22.23.2"
            test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "root"
            test "$(docker inspect --format '{{json .Config.Entrypoint}}' "$IMAGE")" = '["/usr/local/bin/vector-entrypoint.sh"]'
            docker run --rm --entrypoint sh "$IMAGE" -ec '
              test ! -e /usr/local/lib/node_modules/npm
              test ! -e /usr/local/lib/node_modules/corepack
              for p in npm npx corepack yarn yarnpkg pnpm pnpx; do
                if command -v "$p" >/dev/null 2>&1; then
                  echo "Unexpected package manager in final runtime: $p" >&2
                  exit 1
                fi
              done
            '
            if docker run --rm -e NODE_ENV=production --entrypoint node "$IMAGE" /app/server.cjs >production-refusal.log 2>&1; then
              echo 'ERROR: staging candidate unexpectedly started in production mode' >&2
              cat production-refusal.log >&2
              exit 1
            fi
            grep -q 'cannot run as production' production-refusal.log
      - run:
          name: Prove isolated hosted HTTP boundary
          command: |
            set -euo pipefail
            IMAGE="vector-forge-ci:${CIRCLE_SHA1}"
            CI_PASSWORD="CI-$(openssl rand -hex 16)"
            docker run -d --name vector-forge-proof -p 3000:3000               -e PORT=3000               -e NODE_ENV=staging               -e NODE_OPTIONS=--experimental-sqlite               -e WFM_HOSTED_STAGING=true               -e WFM_CANDIDATE_SHA="${CIRCLE_SHA1}"               -e WFM_PUBLIC_ORIGIN=https://vector-forge-ci.invalid               -e WFM_DB=/tmp/vector-forge-proof.sqlite               -e WFM_STAGING_PASSWORD="$CI_PASSWORD"               "$IMAGE"
            proxy_curl() {
              curl -fsS -H 'Host: vector-forge-ci.invalid' -H 'X-Forwarded-Proto: https' "$@"
            }
            deadline=$((SECONDS+60))
            until proxy_curl http://127.0.0.1:3000/api/health >/tmp/health.json; do
              if (( SECONDS >= deadline )); then
                echo 'Runtime did not become healthy before the readiness deadline.' >&2
                docker logs vector-forge-proof >&2 || true
                exit 1
              fi
              sleep 0.25
            done
            proxy_curl http://127.0.0.1:3000/api/health
            proxy_curl -D /tmp/runtime-identity.headers http://127.0.0.1:3000/api/runtime-identity >/tmp/runtime-identity.json
            node -e 'const fs=require("fs");const body=JSON.parse(fs.readFileSync("/tmp/runtime-identity.json","utf8"));if(body.candidateSha!==process.env.CIRCLE_SHA1||body.sourceBinding!=="build-file-matched")throw Error("RUNTIME_IDENTITY_NOT_BUILD_FILE_MATCHED")'
            grep -iq "^x-wfm-source-sha: ${CIRCLE_SHA1}" /tmp/runtime-identity.headers
            grep -iq '^x-wfm-source-binding: build-file-matched' /tmp/runtime-identity.headers
            proxy_curl http://127.0.0.1:3000/ >/dev/null
            status=$(curl -sS -o /tmp/bootstrap-unauth.json -w '%{http_code}'               -H 'Host: vector-forge-ci.invalid'               -H 'X-Forwarded-Proto: https'               http://127.0.0.1:3000/api/bootstrap)
            test "$status" = "401"
            test "$(docker exec vector-forge-proof id -u)" != "0"
            curl -sS -o /tmp/demand-unauth.json -w '%{http_code}'               -H 'Host: vector-forge-ci.invalid'               -H 'X-Forwarded-Proto: https'               http://127.0.0.1:3000/api/operations/intelligence/summary               | grep -qx '401'
      - run:
          name: Capture exact runtime proof
          when: always
          command: |
            mkdir -p circleci-runtime-artifacts
            docker logs vector-forge-proof >circleci-runtime-artifacts/vector-forge-proof.log 2>&1 || true
            cp production-refusal.log circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/health.json circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/runtime-identity.json /tmp/runtime-identity.headers circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/bootstrap-unauth.json circleci-runtime-artifacts/ 2>/dev/null || true
            cp /tmp/demand-unauth.json circleci-runtime-artifacts/ 2>/dev/null || true
            printf '%s\n' "$CIRCLE_SHA1" > circleci-runtime-artifacts/source-sha.txt
            docker inspect "vector-forge-ci:${CIRCLE_SHA1}" > circleci-runtime-artifacts/image-inspect.json 2>/dev/null || true
      - run:
          name: Clean up proof container
          when: always
          command: docker rm -f vector-forge-proof >/dev/null 2>&1 || true
      - store_artifacts:
          path: circleci-runtime-artifacts
          destination: forge-runtime-proof

workflows:
  vector_forge_proof:
    jobs:
      - forge_core_validation
      - forge_runtime_validation:
          requires:
            - forge_core_validation
          filters:
            branches:
              only:
                - /feature\/vector-.*/
                - /release\/.*/
                - /staging\/.*/
                - /review\/staffology-.*/
            tags:
              ignore: /.*/
